services:
  - type: web
    name: ajiousama-radiko
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m py_compile radiko_proxy_core.py radiko_epg.py radiko_cloud_start.py radio_tv.py
    startCommand: python radiko_cloud_start.py
    healthCheckPath: /health
    envVars:
      - key: IMAGEIO_FFMPEG_EXE
        value: /usr/bin/ffmpeg
      - key: RADIKO_MAIL
        sync: false
      - key: RADIKO_PASSWORD
        sync: false
      - key: RADIKO_SIGNING_SECRET
        generateValue: true

name: Rebuild Local Horse Racing Logos
on:
  workflow_dispatch:
  push:
    paths:
      - 'generate_localrace_logos.py'
      - 'generate_localrace_logos_repair.py'
      - 'assets/localrace_sheet_b64/**'
      - 'freewifi_today_public_sports.py'
      - '.github/workflows/rebuild_localrace_logos.yml'
permissions:
  contents: write
concurrency:
  group: himitsu-localrace-logo-writer
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Generate approved local-racing logos
        run: python generate_localrace_logos_repair.py
      - name: Validate
        run: |
          count=$(find logos/public_sports/venues -maxdepth 1 -type f -name 'localrace_*.png' | wc -l)
          test "$count" -ge 15
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('logos/public_sports/venues').glob('localrace_*.png'))
          assert len(files) >= 15, len(files)
          for f in files:
              with Image.open(f) as im:
                  assert im.size == (512, 512), (f, im.size)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A logos/public_sports/venues/localrace_*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild approved local horse racing logos [skip render]'
          git pull --rebase origin main
          git push origin main

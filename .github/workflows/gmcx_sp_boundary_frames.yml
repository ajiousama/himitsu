name: GCCX Special Boundary Frame Verification

on:
  push:
    branches: [main]
    paths:
      - "gmcx_sp_boundary_frames.py"
      - ".github/workflows/gmcx_sp_boundary_frames.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install video analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Capture indexed one-second frames around live-special transition
        run: python -u gmcx_sp_boundary_frames.py
      - name: Retain diagnostic sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmcx-sp-title-boundary-frames
          path: gmcx_sp_boundary_frames/*
          if-no-files-found: warn

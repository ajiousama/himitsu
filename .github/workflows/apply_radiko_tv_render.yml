name: Apply Render Radio TV to FreeWiFi

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_freewifi.py'
      - '.github/workflows/apply_radiko_tv_render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-render-radio-tv
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Render radio TV URLs to 12 radiko stations
        run: python radio_tv_freewifi.py

      - name: Validate 12 Render URLs and keep NHK direct
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^https://ajiousama-radiko.onrender.com/radio-tv/' freewifi)" -eq 12
          test "$(grep -c '^https://simul2.drdi.st.nhk/live/' freewifi)" -ge 4
          grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/ABC$' freewifi
          echo '12 radiko Render TV URLs validated; NHK remains direct'

      - name: Commit FreeWiFi update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'freewifi already current'
            exit 0
          fi
          git commit -m 'Use Render image radio TV for 12 radiko stations'
          git pull --rebase origin main
          git push origin HEAD:main

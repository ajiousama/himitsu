name: Fix regional keirin grouping

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix_regional_keirin.yml'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix keirin grouping rule and current playlist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          reorder = Path('reorder_freewifi.py')
          src = reorder.read_text(encoding='utf-8')
          guard = '''    # Public-sports keirin channels must never be classified as terrestrial Kanto/Kansai.\n    if tvg_id.startswith("keirin."):\n        return "今日の開催場"\n\n'''
          anchor = '''    if any(x in tvg_id for x in KANSAI_IDS) or any(x in joined for x in KANSAI_WORDS):\n        return "関西"\n'''
          if guard not in src:
              if anchor not in src:
                  raise SystemExit('reorder_freewifi.py anchor not found')
              src = src.replace(anchor, guard + anchor, 1)
              reorder.write_text(src, encoding='utf-8')

          p = Path('freewifi')
          text = p.read_text(encoding='utf-8-sig', errors='replace')
          lines = text.splitlines()
          out = []
          i = 0
          removed = []
          while i < len(lines):
              line = lines[i]
              if line.startswith('#EXTINF:'):
                  m_id = re.search(r'tvg-id="([^"]+)"', line)
                  m_group = re.search(r'group-title="([^"]+)"', line)
                  if m_id and m_id.group(1).startswith('keirin.') and m_group and m_group.group(1) in {'関東', '関西'}:
                      removed.append((m_id.group(1), m_group.group(1)))
                      i += 1
                      while i < len(lines) and not lines[i].startswith('#EXTINF:') and not lines[i].startswith('## ') and not lines[i].startswith('### ') and not lines[i].startswith('# ==='):
                          i += 1
                      continue
              out.append(line)
              i += 1

          cleaned = '\n'.join(out).rstrip() + '\n'
          if re.search(r'#EXTINF:[^\n]*tvg-id="keirin\.[^"]+"[^\n]*group-title="(?:関東|関西)"', cleaned):
              raise SystemExit('regional keirin entries still remain')
          p.write_text(cleaned, encoding='utf-8')
          print('Removed regional keirin entries:', removed)
          PY

      - name: Validate
        shell: bash
        run: |
          ! grep -E 'tvg-id="keirin\.[^"]+".*group-title="(関東|関西)"' freewifi
          grep -q 'tvg_id.startswith("keirin.")' reorder_freewifi.py
          grep -q '# === TODAY_PUBLIC_SPORTS_START ===' freewifi

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix_regional_keirin.yml
          git add freewifi reorder_freewifi.py .github/workflows/fix_regional_keirin.yml
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Prevent keirin from entering Kanto Kansai groups'
          git pull --rebase origin main
          git push origin HEAD:main

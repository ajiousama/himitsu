name: Update Ehime Mandarin Pirates LIVE + EPG

on:
  workflow_dispatch:
  push:
    paths:
      - 'mandarin_youtube_guard.py'
      - 'mandarin_epg.py'
      - '.github/workflows/update_mandarin_epg.yml'
      - 'general_youtube.m3u'
  schedule:
    # Check the official team YouTube every 5 minutes so a stopped or restarted relay is reflected quickly.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          yt-dlp --version

      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          rm -f youtube_cookies.txt
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
          fi

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply official Mandarin YouTube state
        run: python mandarin_youtube_guard.py

      - name: Refresh Mandarin EPG
        run: python mandarin_epg.py

      - name: Validate outputs
        shell: bash
        run: |
          test -s general_youtube.m3u
          test -s freewifi
          python -c "import xml.etree.ElementTree as ET; ET.parse('public_sports_epg_local.xml'); print('XML OK')"
          test "$(grep -c 'tvg-id=\"youtube.ehime_mandarin\"' general_youtube.m3u || true)" -le 1
          test "$(grep -c 'tvg-id=\"youtube.ehime_mandarin\"' freewifi || true)" -le 1

      - name: Commit Mandarin LIVE + EPG state
        shell: bash
        run: |
          rm -f youtube_cookies.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add general_youtube.m3u freewifi public_sports_epg_local.xml
          if git diff --cached --quiet; then
            echo 'No Mandarin changes'
            exit 0
          fi
          git commit -m 'Update Ehime Mandarin LIVE and EPG state'
          git pull --rebase origin main
          git push origin main

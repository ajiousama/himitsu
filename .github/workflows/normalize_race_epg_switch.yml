name: Normalize Race EPG +3 (read-only audit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_normalize_race_epg_switch test_publish_public_sports
      - run: python normalize_race_epg_switch.py --check guides.xml public_sports_epg_local.xml

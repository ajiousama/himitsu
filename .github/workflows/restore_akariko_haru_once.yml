name: Restore Akariko via HARU once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_akariko_haru_once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore Akariko entries with HARU blog host
        run: python restore_akariko_haru.py

      - name: Commit restored FreeWiFi
        run: |
          if git diff --quiet -- freewifi; then
            echo 'No FreeWiFi changes; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git commit -m 'Restore Akariko via HARU blog [skip ci]'
          git push origin HEAD:main

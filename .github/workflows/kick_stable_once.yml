name: KICK stable one-time migration

on:
  push:
    paths:
      - '.github/workflows/kick_stable_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply stable resolver once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python kick_stable_update.py
            grep -q 'https://himitsu-six.vercel.app/api/kick?ch=gccx' freewifi
            grep -q 'https://himitsu-six.vercel.app/api/kick?ch=nogizaka' freewifi
            git add freewifi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Finalize stable KICK resolver URLs'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

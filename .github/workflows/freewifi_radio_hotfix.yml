# Emergency playback-first radio repair for FreeWiFi.
name: FreeWiFi Radio Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freewifi_radio_hotfix.yml'
      - 'radio_tv_nationwide_freewifi.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe direct radio gateway
        shell: bash
        run: |
          set -euo pipefail
          base='https://himitsu-six.vercel.app/api/radiko'
          for sid in JOEU-FM RNB ABC; do
            out="/tmp/${sid}.bin"
            rm -f "$out"
            set +e
            curl -L -A 'VLC/3.0.20 LibVLC/3.0.20' --connect-timeout 10 --max-time 18 \
              "$base?station=$sid&stage=media" -o "$out"
            rc=$?
            set -e
            size=0
            if [ -f "$out" ]; then size=$(wc -c < "$out"); fi
            echo "$sid curl_rc=$rc bytes=$size"
            if [ "$size" -lt 1024 ]; then
              echo "$sid direct radio gateway returned too little data" >&2
              exit 1
            fi
          done

      - name: Reapply playback-first FreeWiFi radio block
        run: python radio_tv_nationwide_freewifi.py

      - name: Commit FreeWiFi radio hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- freewifi; then
            echo 'FreeWiFi radio already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git commit -m 'Apply FreeWiFi audio-first radio hotfix [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

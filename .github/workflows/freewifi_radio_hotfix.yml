# Emergency image+audio radio repair for FreeWiFi.
# v7 matrix: deliberately GET shortly after HEAD to exercise in-flight prewarm reuse.
name: FreeWiFi Radio Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freewifi_radio_hotfix.yml'
      - 'radio_tv_nationwide_freewifi.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply image+audio FreeWiFi radio block
        run: python radio_tv_nationwide_freewifi.py

      - name: Commit FreeWiFi image+audio radio hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- freewifi; then
            echo 'FreeWiFi radio already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add freewifi
            git commit -m 'Apply FreeWiFi image+audio radio hotfix [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Probe image and audio on FreeWiFi radio routes
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          root='https://ajiousama-radiko.onrender.com'
          base="$root/radio-tv"
          stations='JOEU-FM RNB ABC CCL 802 FMO MBS OBC KBS ALPHA-STATION E-RADIO CRK'
          failures=0
          for sid in $stations; do
            echo "=== $sid ==="
            curl -fsSI -A 'VLC/3.0.20 LibVLC/3.0.20' --connect-timeout 10 --max-time 15 "$base/$sid" >/dev/null || true
            sleep 1
            probe="/tmp/${sid}.probe"
            set +e
            timeout 35 ffprobe -v error -rw_timeout 20000000 \
              -user_agent 'VLC/3.0.20 LibVLC/3.0.20' \
              -show_entries stream=codec_name,codec_type \
              -of default=noprint_wrappers=1 "$base/$sid" > "$probe" 2>&1
            rc=$?
            set -e
            cat "$probe" || true
            if [ "$rc" -ne 0 ] || ! grep -q 'codec_type=video' "$probe" || ! grep -q 'codec_type=audio' "$probe"; then
              echo "$sid FAILED image+audio probe" >&2
              echo "--- $sid debug ---" >&2
              curl -fsS --max-time 30 "$root/radio-debug/$sid" || true
              echo
              failures=$((failures+1))
            else
              echo "$sid OK image+audio"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures FreeWiFi radio station(s) failed image+audio verification" >&2
            exit 1
          fi

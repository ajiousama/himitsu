# Emergency playback-first radio repair for FreeWiFi.
name: FreeWiFi Radio Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freewifi_radio_hotfix.yml'
      - 'radio_tv_nationwide_freewifi.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe direct radio gateway
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          base='https://himitsu-six.vercel.app/api/radiko'
          for sid in JOEU-FM RNB ABC; do
            url="$base?station=$sid&stage=media"
            list="/tmp/${sid}.m3u8"
            curl -fsSL -A 'VLC/3.0.20 LibVLC/3.0.20' --connect-timeout 10 --max-time 18 "$url" -o "$list"
            bytes=$(wc -c < "$list")
            echo "$sid playlist_bytes=$bytes"
            grep -q '^#EXTM3U' "$list"
            probe="/tmp/${sid}.probe"
            timeout 30 ffprobe -v error -rw_timeout 15000000 \
              -user_agent 'VLC/3.0.20 LibVLC/3.0.20' \
              -select_streams a:0 -show_entries stream=codec_name,codec_type \
              -of default=noprint_wrappers=1 "$url" > "$probe"
            cat "$probe"
            grep -q 'codec_type=audio' "$probe"
          done

      - name: Reapply playback-first FreeWiFi radio block
        run: python radio_tv_nationwide_freewifi.py

      - name: Commit FreeWiFi radio hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- freewifi; then
            echo 'FreeWiFi radio already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git commit -m 'Apply FreeWiFi audio-first radio hotfix [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

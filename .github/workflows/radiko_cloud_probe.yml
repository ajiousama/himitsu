name: Probe Radiko Render Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radiko_cloud_start.py"
      - "radiko_proxy_core.py"
      - ".github/workflows/radiko_cloud_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for Render
        run: sleep 20
      - name: Probe health
        run: |
          curl -f -i -sS --max-time 90 https://ajiousama-radiko.onrender.com/health
      - name: Probe VPN capability
        run: |
          curl -f -sS --max-time 90 https://ajiousama-radiko.onrender.com/vpncheck
      - name: Probe ready with body
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 120 -o /tmp/ready.txt -w '%{http_code}' https://ajiousama-radiko.onrender.com/ready)
          echo "HTTP $CODE"
          cat /tmp/ready.txt
          test "$CODE" = "200"

name: Update General YouTube LIVE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/general_youtube_update.trigger'
      - 'general_youtube_sources.json'
      - 'general_youtube_update.py'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-general-youtube
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          yt-dlp --version

      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
          else
            printf '# Netscape HTTP Cookie File\n' > youtube_cookies.txt
          fi
          chmod 600 youtube_cookies.txt
          echo "Cookie bytes: $(wc -c < youtube_cookies.txt)"

      - name: Refresh general YouTube LIVE
        id: updater
        shell: bash
        run: |
          set +e
          python -u general_youtube_update.py
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate successful update
        if: steps.updater.outputs.rc == '0'
        shell: bash
        run: |
          COUNT=$(grep -c '^#EXTINF:' general_youtube.m3u || true)
          echo "General YouTube LIVE count: $COUNT"
          test "$COUNT" -gt 0
          grep -q '# === GENERAL_YOUTUBE_MANAGED_START ===' freewifi
          grep -q '# === GENERAL_YOUTUBE_MANAGED_END ===' freewifi

      - name: Commit LIVE URLs and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add general_youtube.m3u freewifi general_youtube_run_latest.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Update general YouTube LIVE URLs and diagnostics'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Fail when no LIVE was resolved
        if: steps.updater.outputs.rc != '0'
        run: |
          echo 'No general YouTube LIVE resolved; previous playlist/freewifi were preserved.'
          exit 1

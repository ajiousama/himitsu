name: Update General YouTube LIVE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/general_youtube_update.trigger'
      - 'general_youtube_sources.json'
      - 'general_youtube_sources_ports.json'
      - 'general_youtube_sources_airports.json'
      - 'general_youtube_update.py'
      - 'general_youtube_guard.py'
      - 'public_sports_youtube_fallback.py'
      - 'jra_freewifi_finalize.py'
      - 'freewifi_custom_channels.py'
      - 'freewifi_rakuten_keep.py'
      - 'verified_daily_status.json'
      - 'verified_daily_override.py'
      - 'apply_verified_status.py'
      - '.github/workflows/update_general_youtube.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          yt-dlp --version
      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          rm -f youtube_cookies.txt
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt; chmod 600 youtube_cookies.txt; echo "YouTube cookie restored: $(wc -c < youtube_cookies.txt) bytes"; else echo '::warning::YOUTUBE_COOKIES is not set'; fi
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Refresh public sports YouTube fallbacks
        run: python public_sports_youtube_fallback.py
      - name: Commit public sports fallbacks immediately
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_sports_youtube_fallback.m3u
          if git diff --cached --quiet; then
            echo 'No public sports fallback changes'
          else
            git commit -m 'Refresh public sports YouTube fallbacks'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Merge supplemental live-camera sources
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('general_youtube_sources.json'); base=json.loads(p.read_text(encoding='utf-8')); seen={x.get('id') for x in base}; merged=list(base)
          for path in map(Path,['general_youtube_sources_ports.json','general_youtube_sources_airports.json']):
              for item in (json.loads(path.read_text(encoding='utf-8')) if path.exists() else []):
                  if item.get('id') and item['id'] not in seen: merged.append(item); seen.add(item['id'])
          p.write_text(json.dumps(merged,ensure_ascii=False,separators=(',',':')),encoding='utf-8'); print('Merged source total:',len(merged))
          PY
      - name: Backup current playlist
        run: |
          cp general_youtube.m3u general_youtube.prev.m3u 2>/dev/null || true
          cp freewifi freewifi.prev 2>/dev/null || true
      - name: Refresh general YouTube LIVE
        shell: bash
        run: |
          if ! timeout 12m python general_youtube_update.py; then echo '::warning::YouTube refresh failed or timed out'; fi
      - name: Enforce strict live-camera sources
        run: python general_youtube_guard.py
      - name: Protect repository from empty refresh
        shell: bash
        run: |
          COUNT=$(grep -c '^#EXTINF:' general_youtube.m3u || true)
          if [ "$COUNT" -gt 0 ]; then echo "Playlist after refresh: $COUNT entries"; exit 0; fi
          PREV=$(grep -c '^#EXTINF:' general_youtube.prev.m3u 2>/dev/null || true)
          if [ "${PREV:-0}" -gt 0 ]; then mv general_youtube.prev.m3u general_youtube.m3u; [ -f freewifi.prev ] && mv freewifi.prev freewifi || true; else git show HEAD:general_youtube.m3u > general_youtube.m3u; git show HEAD:freewifi > freewifi; fi
      - name: Put JRA official LIVE in race section
        run: python jra_freewifi_finalize.py
      - name: Apply custom FreeWiFi channels
        run: python freewifi_custom_channels.py
      - name: Keep Rakuten rail/adult channels
        run: python freewifi_rakuten_keep.py
      - name: Reapply verified sports/JRA status
        run: |
          python verified_daily_override.py
          python apply_verified_status.py
      - name: Validate
        run: |
          test -s general_youtube.m3u
          test -s freewifi
          grep -q '# === GENERAL_YOUTUBE_MANAGED_START ===' freewifi
          grep -q '# === GENERAL_YOUTUBE_MANAGED_END ===' freewifi
          grep -q '# === RAKUTEN_KEEP_START ===' freewifi
          grep -q '鉄道・旅' freewifi
          grep -q 'セクシーエンタメチャンネル' freewifi
      - name: Commit updated LIVE URLs
        shell: bash
        run: |
          rm -f general_youtube.prev.m3u freewifi.prev youtube_cookies.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Status JSON files are owned by the FreeWiFi EPG workflow. Do not commit them here.
          git add general_youtube.m3u public_sports_youtube_fallback.m3u freewifi
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Update general YouTube LIVE URLs'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin main

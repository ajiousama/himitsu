name: Sync Cafe au lait EPG to Karenda and KNTV JCOM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cafeaulait.m3u'
      - 'cafeaulait/sync_direct_epg.py'
      - '.github/workflows/update_cafeaulait_epg.yml'
  schedule:
    - cron: '21 */6 * * *'

permissions:
  contents: write

concurrency:
  group: cafeaulait-direct-epg-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync 101 tvg-id values against Karenda XMLTV channels
        run: |
          python -m py_compile cafeaulait/sync_direct_epg.py
          python -u cafeaulait/sync_direct_epg.py

      - name: Validate direct upstream guide configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          data = Path('cafeaulait.m3u').read_text(encoding='utf-8')
          header, *lines = data.splitlines()
          assert 'https://raw.githubusercontent.com/karenda-jp/etc/main/guides.xml' in header
          assert 'https://raw.githubusercontent.com/dbghelp/JCOM-TV-EPG/main/jcom.xml' in header
          assert 'ajiousama/himitsu/main/guides.xml' not in header
          entries = [line for line in lines if line.startswith('#EXTINF:')]
          assert len(entries) == 101
          ids = [re.search(r'tvg-id="([^"]+)"', item).group(1) for item in entries]
          assert len(set(ids)) == 101
          assert all('catchup=' not in line and 'catchup-source=' not in line for line in entries)
          urls = [line for line in lines if line.startswith('https://coffee.linxei.biz.id/stream/jp/')]
          assert len(urls) == 101
          assert all('/stream-output.m3u8?mode=hls' in url for url in urls)
          report = Path('cafeaulait_direct_epg_report.txt').read_text(encoding='utf-8')
          assert 'supported=' in report
          assert 'kntv\tjcom\tjcom_120_174_65406\t' in report
          print('Direct Karenda+KNTV JCOM EPG mapping verified:', len(entries), 'channels')
          PY

      - name: Publish playlist and source-ID mapping report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp -d)"
          cp cafeaulait.m3u "$snapshot/cafeaulait.m3u"
          cp cafeaulait_direct_epg_report.txt "$snapshot/cafeaulait_direct_epg_report.txt"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/cafeaulait.m3u" cafeaulait.m3u
            cp "$snapshot/cafeaulait_direct_epg_report.txt" cafeaulait_direct_epg_report.txt
            git add cafeaulait.m3u cafeaulait_direct_epg_report.txt
            if git diff --cached --quiet; then
              echo "Direct EPG playlist already current"
              exit 0
            fi
            git commit -m "Align Cafe au lait EPG to Karenda and KNTV JCOM [skip ci]"
            if git push origin HEAD:main; then
              echo "Published direct EPG playlist"
              exit 0
            fi
            sleep 3
          done
          exit 1

name: Update Cafe au lait hybrid EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cafeaulait.m3u'
      - 'cafeaulait/build_epg.py'
      - '.github/workflows/update_cafeaulait_epg.yml'
  schedule:
    - cron: '21 */3 * * *'

permissions:
  contents: write

concurrency:
  group: cafeaulait-hybrid-epg-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate XMLTV time conversion and 101 channels
        shell: bash
        run: |
          python -m py_compile cafeaulait/build_epg.py
          python - <<'PY'
          import runpy
          code = runpy.run_path('cafeaulait/build_epg.py', run_name='validation')
          parse_time = code['parse_time']
          assert parse_time('20261108063000 +0900').isoformat() == '2026-11-08T06:30:00+09:00'
          assert parse_time('20261107213000 +0000').isoformat() == '2026-11-08T06:30:00+09:00'
          rows = code['targets']()
          assert len(rows) == 101
          from pathlib import Path
          playlist_lines = Path('cafeaulait.m3u').read_text(encoding='utf-8-sig').splitlines()
          entries = [line for line in playlist_lines if line.startswith('#EXTINF:')]
          archives = [line for line in entries if 'catchup="default"' in line]
          live_only = [line for line in entries if 'catchup="default"' not in line]
          assert len(entries) == 101
          assert len(archives) == 99
          assert len(live_only) == 2
          assert all('catchup-days="6"' in line and 'start={utc}' in line for line in archives)
          assert all('catchup-source=' not in line for line in live_only)
          assert all('${(b)timestamp}' not in line and 'start={utc}' in line for line in archives)
          print('Validation OK: 101 EPG entries, 99 standard catch-up templates, 2 live-only channels')
          PY

      - name: Build real hybrid EPG (FreeWiFi Karenda JCOM Sky JapanTerebi)
        run: python -u cafeaulait/build_epg.py

      - name: Validate output before publishing
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('cafeaulait_epg.xml').getroot()
          channels = [x.get('id') for x in root.findall('channel')]
          programmes = root.findall('programme')
          assert len(channels) == 101 and len(set(channels)) == 101
          assert len(programmes) > 0
          assert all(x.get('channel') in channels for x in programmes)
          print('Hybrid EPG validated:', len(channels), 'channels /', len(programmes), 'real programmes')
          PY
          test -s cafeaulait_epg_report.txt

      - name: Publish Cafe au lait EPG without altering FreeWiFi/yovi
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep generated files independent of concurrent FreeWiFi writers.
          # Rebase can conflict when another EPG run published in the meantime;
          # restore our validated snapshot on top of the latest main instead.
          snapshot="$(mktemp -d)"
          cp cafeaulait_epg.xml "$snapshot/cafeaulait_epg.xml"
          cp cafeaulait_epg_report.txt "$snapshot/cafeaulait_epg_report.txt"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/cafeaulait_epg.xml" cafeaulait_epg.xml
            cp "$snapshot/cafeaulait_epg_report.txt" cafeaulait_epg_report.txt
            git add cafeaulait_epg.xml cafeaulait_epg_report.txt
            if git diff --cached --quiet; then
              echo "Cafe au lait EPG already current"
              exit 0
            fi
            git commit -m "Update Cafe au lait hybrid EPG [skip ci] [skip render]"
            if git push origin HEAD:main; then
              echo "Published Cafe au lait hybrid EPG"
              exit 0
            fi
            echo "::warning::Concurrent main update; retrying latest snapshot"
            sleep 3
          done
          exit 1

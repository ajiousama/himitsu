name: Update Cafe au lait self-hosted EPG (no Karenda direct source)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cafeaulait.m3u'
      - 'cafeaulait/build_epg.py'
      - '.github/workflows/update_cafeaulait_epg.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cafeaulait.m3u'
      - 'cafeaulait/build_epg.py'
      - '.github/workflows/update_cafeaulait_epg.yml'
  schedule:
    - cron: '33 * * * *'

permissions:
  contents: write

concurrency:
  group: cafeaulait-selfhosted-epg-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out only EPG dependencies (avoid large media checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /cafeaulait.m3u
            /cafeaulait/build_epg.py
            /cafeaulait_epg.xml
            /cafeaulait_epg_report.txt
            /guides.xml
            /.github/workflows/update_cafeaulait_epg.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate independent 101-channel EPG
        run: |
          python -m py_compile cafeaulait/build_epg.py
          python -u cafeaulait/build_epg.py

      - name: Validate playlist, coverage and key CS channels
        run: |
          python - <<'PY'
          import collections
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          m3u = Path('cafeaulait.m3u').read_text(encoding='utf-8-sig')
          assert m3u.startswith('#EXTM3U url-tvg="https://raw.githubusercontent.com/ajiousama/himitsu/main/cafeaulait_epg.xml"')
          assert 'karenda-jp' not in m3u.lower()
          extinfs = [line for line in m3u.splitlines() if line.startswith('#EXTINF:')]
          assert len(extinfs) == 101, f'Unexpected Coffee playlist size: {len(extinfs)}'
          ids = [re.search(r'tvg-id="([^"]+)"', line).group(1) for line in extinfs]
          assert len(set(ids)) == 101
          streams = [line for line in m3u.splitlines() if line.startswith('https://coffee.linxei.biz.id/stream/jp/')]
          assert len(streams) == 101, f'Unexpected Coffee stream URL count: {len(streams)}'
          assert all('/stream-output.m3u8?mode=hls' in line for line in streams)

          root = ET.parse('cafeaulait_epg.xml').getroot()
          channels = root.findall('channel')
          programs = root.findall('programme')
          assert len(channels) == 101, f'Expected 101 channel entries, got {len(channels)}'
          program_counts = collections.Counter(p.get('channel') for p in programs)
          assert set(program_counts).issubset(set(ids))
          covered = sum(bool(program_counts.get(i)) for i in ids)
          assert covered >= 80, f'EPG regression: only {covered}/101 Coffee channels'
          for wanted in (
              'TBSチャンネル1_jp', 'TBSチャンネル2_jp',
              'NHK・BS_jp', 'nhk_bs_2', 'NHK・BSP_jp', 'メ～テレNEXT_jp',
          ):
              assert program_counts.get(wanted, 0) > 0, f'Missing verified EPG: {wanted}'

          # NHK BS and BSP4K are different services. Reject cloned 4K schedules.
          def title_grid(cid):
              return {(p.get('start'), p.findtext('title')) for p in programs if p.get('channel') == cid}
          assert title_grid('NHK・BS_jp') != title_grid('NHK・BSP_jp'), (
              'NHK BS has incorrectly duplicated BSP4K schedule'
          )

          report = Path('cafeaulait_epg_report.txt').read_text(encoding='utf-8')
          assert 'nhk_bs\tNHK・BS_jp\tnhk_official\tNHK・BS_jp\t' in report
          assert 'nhk_bs4k\tNHK・BSP_jp\tnhk_official\tNHK・BSP_jp\t' in report
          assert 'me-tele_next\tメ～テレNEXT_jp\tsky\tCS301\t' in report
          print('Cafe au lait verified:', covered, '/101;', len(programs),
                'programmes; NHK BS services separate; Me-Tele NEXT CS301')
          PY

      - name: Publish self-hosted guide and diagnostic report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp -d)"
          cp cafeaulait_epg.xml "$snapshot/cafeaulait_epg.xml"
          cp cafeaulait_epg_report.txt "$snapshot/cafeaulait_epg_report.txt"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/cafeaulait_epg.xml" cafeaulait_epg.xml
            cp "$snapshot/cafeaulait_epg_report.txt" cafeaulait_epg_report.txt
            git add cafeaulait_epg.xml cafeaulait_epg_report.txt
            if git diff --cached --quiet; then
              echo "Self-hosted Cafe au lait guide already current"
              exit 0
            fi
            git commit -m "Refresh self-hosted Cafe au lait XMLTV [skip ci]"
            if git push origin HEAD:main; then
              echo "Self-hosted Cafe au lait guide published"
              exit 0
            fi
            sleep 3
          done
          echo "Failed to publish Cafe au lait guide" >&2
          exit 1

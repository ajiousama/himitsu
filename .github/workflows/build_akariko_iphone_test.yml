name: Build Akariko iPhone test

on:
  push:
    paths:
      - ".github/workflows/build_akariko_iphone_test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Akariko-only M3U
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd()))
          from restore_akariko_haru import CHANNELS, stream_url

          lines = ["#EXTM3U"]
          for tvg_id, group, name, slug, logo in CHANNELS:
              lines.append(
                  f'#EXTINF:-1 tvg-id="{tvg_id}" tvg-logo="{logo}" '
                  f'group-title="akariko TEST {group}",{name}'
              )
              lines.append(stream_url(slug))

          Path("akariko_iphone_test.m3u").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit test playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akariko_iphone_test.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Add Akariko iPhone test playlist"
            git push
          fi

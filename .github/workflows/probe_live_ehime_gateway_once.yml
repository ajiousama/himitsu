name: Probe live Ehime gateway once
on:
  push:
    paths:
      - '.github/workflows/probe_live_ehime_gateway_once.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Probe Ainan
        shell: bash
        run: |
          set -euo pipefail
          url='https://ajiousama-ehime-catv-hls.onrender.com/ehime-catv.m3u8?ch=ainan'
          curl -fsS --max-time 15 "${url}&debug=1"
          timeout 30 ffmpeg -hide_banner -loglevel error -protocol_whitelist file,http,https,tcp,tls,crypto -i "$url" -t 2 -map 0:v:0 -map 0:a:0 -f null -
          echo 'PASS ainan'

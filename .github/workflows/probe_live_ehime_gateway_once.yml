name: Probe live Ehime gateway once
on:
  push:
    paths:
      - '.github/workflows/probe_live_ehime_gateway_once.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Probe channels
        shell: bash
        run: |
          set -euo pipefail
          base='https://ajiousama-radiko.onrender.com/ehime-catv.m3u8?ch='
          for ch in town_news24 machicam24 event_selection ehime_channel bousai igo_shogi; do
            echo "=== $ch ==="
            curl -fsS --max-time 15 "${base}${ch}&debug=1" || true
            timeout 30 ffmpeg -hide_banner -loglevel error -protocol_whitelist file,http,https,tcp,tls,crypto -i "${base}${ch}" -t 2 -map 0:v:0 -map 0:a:0 -f null -
            echo "PASS $ch"
          done

name: Probe BOAT Omura Sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe_boat_omura.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Probe current Omura player resources
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          roots=[
            'https://boatrace.sakura.tv/omura/',
            'https://livebb.jlc.ne.jp/bb_top/new_bb/index.php?tpl=24',
            'https://livebb.jlc.ne.jp/bb_top/sp_bb/live_24.php',
            'https://live.boatcast.jp/boatcastpc/index.php?tpl=24',
            'https://live.boatcast.jp/boatcastsp/live_24.php',
          ]
          seen=set(); q=[(u,0) for u in roots]
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':UA,'Referer':'https://boatrace.sakura.tv/','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=12) as r:
              return r.read().decode('utf-8','replace'),r.geturl(),r.status,r.headers.get('content-type','')
          while q and len(seen)<60:
            u,d=q.pop(0)
            if u in seen: continue
            seen.add(u)
            try:
              body,final,status,ct=get(u)
            except Exception as e:
              print('ERR',d,u,type(e).__name__,getattr(e,'code',''),e)
              continue
            print('\nFETCH',d,status,ct,final,'bytes',len(body))
            hits=[]
            for pat in [r'https?://[^\s"\'<>]+',r'["\']([^"\']+\.m3u8(?:\?[^"\']*)?)["\']']:
              for m in re.finditer(pat,body,re.I):
                v=m.group(0) if pat.startswith('http') else m.group(1)
                if any(x in v.lower() for x in ('m3u8','uliza','hls','player','movie','live','stream')):
                  if v not in hits: hits.append(v)
            for h in hits[:80]: print('HIT',h)
            if d>=2: continue
            vals=[]
            for m in re.finditer(r'(?:src|href)=["\']([^"\']+)["\']',body,re.I): vals.append(m.group(1))
            for m in re.finditer(r'["\'](https?://[^"\']+)["\']',body,re.I): vals.append(m.group(1))
            for v in vals:
              try: c=urllib.parse.urljoin(final,v)
              except: continue
              host=(urllib.parse.urlsplit(c).hostname or '').lower()
              path=urllib.parse.urlsplit(c).path.lower()
              if not host: continue
              if not any(x in host for x in ('jlc.ne.jp','boatcast.jp','uliza','boatrace-cdn','streaks.jp')): continue
              if re.search(r'\.(?:css|png|jpe?g|gif|svg|ico|woff2?|ttf|map)(?:$|\?)',path): continue
              if c not in seen and (c,d+1) not in q: q.append((c,d+1))
          print('\nTOTAL SEEN',len(seen))
          PY

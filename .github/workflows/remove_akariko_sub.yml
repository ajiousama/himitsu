name: Remove retired Akariko sub

on:
  push:
    paths:
      - '.github/workflows/remove_akariko_sub.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add persistent retired-source cleanup
        shell: bash
        run: |
          cat > freewifi_retired_sources.py <<'PY'
          from pathlib import Path

          PATH = Path('freewifi')
          RETIRED_MARKERS = (
              'akariko-bck1.sankuria.sbs',
              'akariko backup',
          )

          def main():
              text = PATH.read_text(encoding='utf-8-sig', errors='replace')
              lines = text.splitlines()
              out = []
              removed = 0
              i = 0
              while i < len(lines):
                  if lines[i].startswith('#EXTINF:'):
                      j = i + 1
                      while j < len(lines) and not lines[j].startswith('#EXTINF:') and not lines[j].startswith('## ') and not lines[j].startswith('### ') and not lines[j].startswith('# ==='):
                          j += 1
                      block = lines[i:j]
                      low = '\n'.join(block).lower()
                      if any(marker in low for marker in RETIRED_MARKERS):
                          removed += 1
                          i = j
                          continue
                      out.extend(block)
                      i = j
                      continue
                  out.append(lines[i])
                  i += 1
              result = '\n'.join(out).rstrip() + '\n'
              PATH.write_text(result, encoding='utf-8')
              print(f'Retired Akariko sub entries removed: {removed}')

          if __name__ == '__main__':
              main()
          PY

          python freewifi_retired_sources.py

      - name: Hook cleanup into FreeWiFi workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
              Path('.github/workflows/update_freewifi_epg.yml'): (
                  "      - name: Validate NAORI block\n",
                  "      - name: Remove retired FreeWiFi sources\n        run: python freewifi_retired_sources.py\n\n      - name: Validate NAORI block\n",
              ),
              Path('.github/workflows/update_general_youtube.yml'): (
                  "      - name: Refresh KICK playback URLs\n",
                  "      - name: Remove retired FreeWiFi sources\n        run: python freewifi_retired_sources.py\n      - name: Refresh KICK playback URLs\n",
              ),
          }

          for path, (needle, replacement) in patches.items():
              text = path.read_text(encoding='utf-8')
              if 'run: python freewifi_retired_sources.py' not in text:
                  if needle not in text:
                      raise SystemExit(f'Patch anchor missing: {path}')
                  text = text.replace(needle, replacement, 1)
                  path.write_text(text, encoding='utf-8')
                  print('patched', path)
              else:
                  print('already patched', path)
          PY

      - name: Validate removal
        shell: bash
        run: |
          if grep -Eiq 'akariko-bck1\.sankuria\.sbs|akariko backup' freewifi; then
            echo 'Retired Akariko sub still present'
            exit 1
          fi
          grep -q 'freewifi_retired_sources.py' .github/workflows/update_freewifi_epg.yml
          grep -q 'freewifi_retired_sources.py' .github/workflows/update_general_youtube.yml
          echo 'Akariko sub removal OK'

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove_akariko_sub.yml
          git add freewifi freewifi_retired_sources.py .github/workflows/update_freewifi_epg.yml .github/workflows/update_general_youtube.yml .github/workflows/remove_akariko_sub.yml
          git commit -m 'Remove retired Akariko sub streams'
          git pull --rebase origin main
          git push origin main

name: Update YouTube v3 Worker

on:
  workflow_dispatch:
  schedule:
    # Recovery trigger only. The active worker refreshes special channels itself.
    - cron: '17 21-23,0-14 * * *'  # JST 06:17-23:17 only
  push:
    branches: [main]
    paths:
      - 'youtube/config.json'
      - 'youtube/manager.py'
      - 'youtube/test_manager.py'
      - 'youtube/generate_missing_logos.py'
      - '.github/workflows/update_youtube.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: himitsu-youtube-v3-worker
  cancel-in-progress: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check active hours
        id: hours
        shell: bash
        run: |
          hour="$(TZ=Asia/Tokyo date +%H)"
          if [ "$hour" -ge 6 ] && [ "$hour" -le 23 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Nighttime pause: JST 00:00-05:59"
          fi

      - name: Checkout
        if: steps.hours.outputs.active == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.hours.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install YouTube resolver
        if: steps.hours.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          python -m pip install --upgrade curl_cffi Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          yt-dlp --version

      - name: Restore YouTube cookies
        if: steps.hours.outputs.active == 'true'
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          rm -f youtube_cookies.txt
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
          fi

      - name: Prepare YouTube logos before structure tests
        if: steps.hours.outputs.active == 'true'
        run: python youtube/generate_missing_logos.py

      - name: Run structure tests
        if: steps.hours.outputs.active == 'true'
        run: python -m unittest -v youtube.test_manager

      - name: Run continuous YouTube refresh worker
        if: steps.hours.outputs.active == 'true'
        shell: bash
        run: |
          set -u

          publish_general() {
            ids="${1:-}"
            echo "=== YouTube scope=general resolve once ids=${ids:-ALL} ==="
            git fetch origin main
            git reset --hard origin/main

            python youtube/generate_missing_logos.py
            if [ -n "$ids" ]; then
              general_cmd=(python youtube/manager.py --scope general --ids "$ids")
              general_timeout=5m
            else
              general_cmd=(python youtube/manager.py --scope general)
              general_timeout=15m
            fi
            if ! timeout "$general_timeout" "${general_cmd[@]}"; then
              echo "::error::general refresh failed"
              return 1
            fi
            if ! python -m unittest -v youtube.test_manager; then
              echo "::error::YouTube structure test failed after general resolve"
              return 1
            fi

            snapshot="$(mktemp -d)"
            mkdir -p "$snapshot/logos"
            cp youtube/output/general.m3u "$snapshot/general.m3u"
            cp -a youtube/logos/general/. "$snapshot/logos/"

            for attempt in 1 2 3 4 5 6; do
              echo "=== YouTube general publish overlay attempt=$attempt ==="
              git fetch origin main
              git reset --hard origin/main

              mkdir -p youtube/logos/general youtube/output
              rm -rf youtube/logos/general/*
              cp -a "$snapshot/logos/." youtube/logos/general/
              cp "$snapshot/general.m3u" youtube/output/general.m3u

              # Rebuild only the managed YouTube block onto the latest FreeWiFi
              # so concurrent BOAT/KICK/EPG commits are preserved.
              if ! python youtube/manager.py --sync-only; then
                echo "::warning::general sync-only failed on latest main"
                sleep "$attempt"
                continue
              fi
              if ! python -m unittest -v youtube.test_manager; then
                echo "::warning::YouTube structure test failed on publish overlay"
                sleep "$attempt"
                continue
              fi

              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add youtube/logos/general youtube/output/general.m3u freewifi

              if git diff --cached --quiet; then
                echo "YouTube general already current"
                rm -rf "$snapshot"
                return 0
              fi

              git commit -m "Update YouTube v3 general state [skip ci] [skip render]"
              if git push origin HEAD:main; then
                echo "YouTube general published"
                rm -rf "$snapshot"
                return 0
              fi

              echo "::warning::main moved during general publish; re-overlaying snapshot"
              sleep "$attempt"
            done

            rm -rf "$snapshot"
            echo "::error::YouTube general publish failed after overlay retries"
            return 1
          }

          publish_scope() {
            scope="$1"
            if [ "$scope" = "general" ]; then
              publish_general
              return $?
            fi
            for attempt in 1 2 3 4 5; do
              echo "=== YouTube scope=$scope attempt=$attempt ==="
              git fetch origin main
              git reset --hard origin/main

              if [ "$scope" = "special" ]; then
                if ! timeout 4m python youtube/manager.py --scope special; then
                  echo "::warning::special refresh failed on attempt $attempt"
                  sleep "$attempt"
                  continue
                fi
              else
                python youtube/generate_missing_logos.py
                if ! timeout 15m python youtube/manager.py --scope general; then
                  echo "::warning::general refresh failed on attempt $attempt"
                  sleep "$attempt"
                  continue
                fi
              fi

              if ! python -m unittest -v youtube.test_manager; then
                echo "::warning::YouTube structure test failed after scope=$scope"
                sleep "$attempt"
                continue
              fi

              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

              if [ "$scope" = "special" ]; then
                git add youtube/output/kana.m3u youtube/output/mandarin.m3u \
                        youtube/state/kana.json youtube/state/mandarin.json \
                        freewifi public_sports_epg_local.xml
              else
                git add youtube/config.json youtube/logos/general youtube/output/general.m3u freewifi
              fi

              if git diff --cached --quiet; then
                echo "YouTube $scope already current"
                return 0
              fi

              git commit -m "Update YouTube v3 $scope state [skip ci] [skip render]"
              if git push origin HEAD:main; then
                echo "YouTube $scope published"
                return 0
              fi

              echo "::warning::push race on scope=$scope; retrying from latest main"
              sleep "$attempt"
            done

            echo "::error::YouTube $scope publish failed after retries"
            return 1
          }

          # Refresh Kana/Mandarin immediately, then every ~5 minutes.
          # Refresh the larger general list about hourly, after special has been
          # handled first so a live-start change is never delayed by the full scan.
          successor_queued=0
          for cycle in $(seq 0 63); do
            hour="$(TZ=Asia/Tokyo date +%H)"
            if [ "$hour" -lt 6 ]; then
              echo "Nighttime pause reached; stopping worker until morning recovery cron"
              break
            fi

            cycle_started="$(date +%s)"

            # Urgent/local cameras refresh first so they do not wait behind the
            # full nationwide scan.
            volatile_ids="youtube.arashiyama_monkeypark,youtube.matsuyama_kankoko,youtube.matsuyama_kankoko_board,youtube.matsuyama_kankoko_exterior"
            if [ "$cycle" -eq 0 ]; then
              publish_general "youtube.tsukamoto,youtube.masaki_hama,youtube.kurushima_bridge,youtube.kobe_port_shinko2_south,youtube.osaka_port_nanko,$volatile_ids" || true
            elif [ $((cycle % 3)) -eq 0 ]; then
              # Official Arashiyama LIVE IDs can rotate, and the three tourist-port
              # cameras should disappear while dead and return automatically.
              publish_general "$volatile_ids" || true
            fi

            publish_scope special || true

            if [ $((cycle % 12)) -eq 0 ]; then
              publish_scope general || true
            fi

            # Queue the next worker before this runner reaches its 6-hour limit.
            if [ "$cycle" -eq 58 ] && [ "$successor_queued" -eq 0 ]; then
              if gh workflow run update_youtube.yml --ref main; then
                echo "Queued successor YouTube worker"
                successor_queued=1
              else
                echo "::warning::Could not queue successor; hourly recovery cron remains enabled"
              fi
            fi

            elapsed=$(( $(date +%s) - cycle_started ))
            if [ "$elapsed" -lt 300 ]; then
              sleep $((300 - elapsed))
            fi
          done

          rm -f youtube_cookies.txt

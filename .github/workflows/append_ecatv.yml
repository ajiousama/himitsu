name: Append eCATV to freewifi

on:
  push:
    paths:
      - '.github/workflows/append_ecatv.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Append eCATV channels once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('freewifi')
          text = p.read_text(encoding='utf-8')
          marker = '## 愛媛CATV（TS-401）'
          if marker in text:
              print('eCATV section already exists; no change')
              raise SystemExit(0)

          block = r'''

## 愛媛CATV（TS-401）

#EXTINF:-1 group-title="愛媛CATV",たうんプレミアム
https://cdn-ecatv-stream.durasite.net/live/plala.town/playlist.m3u8

#EXTINF:-1 group-title="愛媛CATV",たうんNews24
https://cdn.e-catv.ne.jp/mpeg-dash/hc_town_news_24/dash.mpd

#EXTINF:-1 group-title="愛媛CATV",街カメ24
https://cdn.e-catv.ne.jp/mpeg-dash/hc_machi_cam_24/dash.mpd

#EXTINF:-1 group-title="愛媛CATV",番組宣伝ch
https://cdn-ecatv-stream.durasite.net/live/plala.machisuki/playlist.m3u8

#EXTINF:-1 group-title="愛媛CATV",おしらせチャンネル
https://cdn-ecatv-stream.durasite.net/live/plala.info/playlist.m3u8

#EXTINF:-1 group-title="愛媛CATV",イベントプレミアム
https://cdn-ecatv-stream.durasite.net/live/plala.event/playlist.m3u8

#EXTINF:-1 group-title="愛媛CATV",イベントセレクション
https://cdn.e-catv.ne.jp/mpeg-dash/hc_eventsel_channel/dash.mpd

#EXTINF:-1 group-title="愛媛CATV",えひめチャンネル
https://cdn.e-catv.ne.jp/mpeg-dash/hc_ehime_channel/dash.mpd

#EXTINF:-1 group-title="愛媛CATV",えひめ・防災チャンネル
https://cdn.e-catv.ne.jp/mpeg-dash/hc_bousai_channel/dash.mpd

#EXTINF:-1 tvg-id="囲碁・将棋チャンネル_jp" group-title="愛媛CATV",囲碁将棋チャンネル
https://cdn.e-catv.ne.jp/mpeg-dash/hc_gosho_channel/dash.mpd

#EXTINF:-1 tvg-id="釣りビジョン_jp" group-title="愛媛CATV",釣りビジョン
https://cdn.e-catv.ne.jp/mpeg-dash/hc_fivi_channel/dash.mpd

#EXTINF:-1 tvg-id="CNNj_jp" group-title="愛媛CATV",CNNj
https://cdn.e-catv.ne.jp/mpeg-dash/hc_cnn_channel/dash.mpd

#EXTINF:-1 tvg-id="日経CNBC_jp" group-title="愛媛CATV",日経CNBC
https://cdn4.nikkei-cnbc.co.jp/live-ch01/livestream/ts:playlist.m3u8
'''

          p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          print('Appended eCATV section')
          PY

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- freewifi; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          git commit -m "Add eCATV channels to freewifi"
          git push

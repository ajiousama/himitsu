name: Fix Rakuten R Channel EPG IDs once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_rakuten_epg_ids_once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update current Rakuten IDs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'rch_98': 'rch_125',
              'rch_59': 'rch_124',
              'rch_40': 'rch_123',
              'rch_42': 'rch_122',
          }

          for filename in ['freewifi', 'epg_build_safe.py', 'rakuten_epg_backup.py']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8-sig')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if filename == 'epg_build_safe.py':
                  text = text.replace('"rch_122": "映画",', '"rch_122": "映画（年齢制限あり）",')
                  text = text.replace('particular rch_122 had been incorrectly borrowing karenda/rch_122.', 'Rakuten adult-category IDs were renumbered in the current karenda guide.')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'updated {filename}')
              else:
                  print(f'no change {filename}')

      - name: Verify mappings
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'tvg-id="rch_125"' freewifi
          grep -q 'tvg-id="rch_124"' freewifi
          grep -q 'tvg-id="rch_123"' freewifi
          grep -q 'tvg-id="rch_122"' freewifi
          ! grep -q 'tvg-id="rch_98"' freewifi
          ! grep -q 'tvg-id="rch_59"' freewifi
          ! grep -q 'tvg-id="rch_40"' freewifi
          ! grep -q 'tvg-id="rch_42"' freewifi
          grep -q '"rch_125": "セクシーエンタメチャンネル"' epg_build_safe.py
          grep -q '"rch_124": "おとなの歓楽街 by MEN'"'"'S NECO"' epg_build_safe.py
          grep -q '"rch_123": "刺激ストロング"' epg_build_safe.py
          grep -q '"rch_122": "映画（年齢制限あり）"' epg_build_safe.py
          grep -q '"rch_125": "セクシーエンタメチャンネル"' rakuten_epg_backup.py
          grep -q '"rch_124": "おとなの歓楽街 by MEN'"'"'S NECO"' rakuten_epg_backup.py
          grep -q '"rch_123": "刺激ストロング"' rakuten_epg_backup.py
          grep -q '"rch_122": "映画（年齢制限あり）"' rakuten_epg_backup.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi epg_build_safe.py rakuten_epg_backup.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Update Rakuten R Channel EPG IDs [skip ci]'
          git push origin HEAD:main

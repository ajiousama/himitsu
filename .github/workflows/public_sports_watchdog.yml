name: Public Sports Update Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public_sports_watchdog.yml"
      - ".github/workflows/update_boat_auto.yml"
  schedule:
    # Independent recovery path. Runs every 5 minutes and only dispatches stale/failed targets.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: himitsu-public-sports-watchdog
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover stale public-sports workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          workflows="$(gh api "repos/$REPO/actions/workflows?per_page=100")"

          find_id() {
            local pattern="$1"
            printf '%s' "$workflows" | jq -r --arg p "$pattern" '
              .workflows[]
              | select(.state == "active")
              | select(.name | test($p; "i"))
              | .id' | head -n1
          }

          should_recover() {
            local workflow_id="$1"
            local stale_minutes="$2"
            local runs latest created status conclusion now epoch age

            runs="$(gh api "repos/$REPO/actions/workflows/$workflow_id/runs?per_page=5")"
            latest="$(printf '%s' "$runs" | jq -c '.workflow_runs[0] // empty')"

            if [ -z "$latest" ]; then
              return 0
            fi

            created="$(printf '%s' "$latest" | jq -r '.created_at')"
            status="$(printf '%s' "$latest" | jq -r '.status')"
            conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
            now="$(date -u +%s)"
            epoch="$(date -u -d "$created" +%s)"
            age=$(( (now - epoch) / 60 ))

            echo "workflow=$workflow_id latest_age=${age}m status=$status conclusion=$conclusion"

            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; then
              return 1
            fi

            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
              [ "$age" -ge 3 ] && return 0
            fi

            [ "$age" -ge "$stale_minutes" ]
          }

          recover() {
            local pattern="$1"
            local stale_minutes="$2"
            local id

            id="$(find_id "$pattern")"
            if [ -z "$id" ]; then
              echo "::warning::No active workflow matched: $pattern"
              return 0
            fi

            if should_recover "$id" "$stale_minutes"; then
              echo "::warning::Dispatching stale/failed workflow matching: $pattern"
              gh api -X POST "repos/$REPO/actions/workflows/$id/dispatches" -f ref=main
            else
              echo "Healthy/recent: $pattern"
            fi
          }

          recover_boat_status() {
            local id status_json generated now epoch age runs latest run_status
            id="$(find_id "Update BOAT Auto v3")"
            if [ -z "$id" ]; then
              echo "::warning::No active BOAT workflow found"
              return 0
            fi

            status_json="$(gh api "repos/$REPO/contents/today_boat_status.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d 2>/dev/null || true)"
            generated="$(printf '%s' "$status_json" | jq -r '.generated_at // empty' 2>/dev/null || true)"
            if [ -z "$generated" ]; then
              echo "::warning::BOAT status timestamp unavailable; dispatching recovery"
              gh api -X POST "repos/$REPO/actions/workflows/$id/dispatches" -f ref=main
              return 0
            fi

            now="$(date -u +%s)"
            epoch="$(date -u -d "$generated" +%s 2>/dev/null || echo 0)"
            age=$(( (now - epoch) / 60 ))
            echo "BOAT status age=${age}m generated_at=$generated"
            if [ "$age" -lt 13 ]; then
              echo "BOAT status healthy/recent"
              return 0
            fi

            runs="$(gh api "repos/$REPO/actions/workflows/$id/runs?per_page=3")"
            latest="$(printf '%s' "$runs" | jq -c '.workflow_runs[0] // empty')"
            run_status="$(printf '%s' "$latest" | jq -r '.status // ""')"
            if [ "$run_status" = "in_progress" ]; then
              echo "::warning::BOAT status stale but updater is currently running"
              return 0
            fi

            echo "::warning::BOAT status stale (${age}m); dispatching recovery"
            gh api -X POST "repos/$REPO/actions/workflows/$id/dispatches" -f ref=main
          }

          # BOAT health is judged from the actual published status timestamp,
          # not merely from whether a workflow run happens to be queued.
          recover_boat_status
          # Main FreeWiFi/EPG and GCH fallback are hourly jobs.
          recover "Update FreeWiFi ALL" 80
          recover "Update GCH Free EPG" 80

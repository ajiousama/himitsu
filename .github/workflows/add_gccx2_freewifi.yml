name: Finalize GameCenter CX2 Free Wi-Fi

on:
  push:
    paths:
      - '.github/workflows/add_gccx2_freewifi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-gccx2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point CX2 to dedicated resolver
        shell: python
        run: |
          from pathlib import Path
          p = Path('freewifi')
          s = p.read_text(encoding='utf-8')
          old = 'https://himitsu-six.vercel.app/api/kick?ch=gccx2'
          new = 'https://himitsu-six.vercel.app/api/kick2'
          if old not in s and new not in s:
              raise SystemExit('CX2 Free Wi-Fi entry not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit Free Wi-Fi update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Route GameCenter CX2 through dedicated KICK resolver"
          git push

name: Sync GameCenter CX2 KICK to Free Wi-Fi

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add_gccx2_freewifi.yml'
      - 'kick_gccx2_sync.py'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  sync-gccx2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Check joshua-hkd and sync Free Wi-Fi
        run: python kick_gccx2_sync.py

      - name: Commit only when CX2 state changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi gccx2_live_state.json
          if git diff --cached --quiet; then
            echo "No CX2 state change"
            exit 0
          fi
          git commit -m "Sync GameCenter CX2 KICK live state [skip ci]"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin main

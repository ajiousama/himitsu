name: Validate Current Radiko Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "freewifi"
      - "radio.m3u"
      - "radiko_freewifi.py"
      - ".github/workflows/radiko_render_rewrite.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate separated Radiko image+audio layout
        shell: bash
        run: |
          set -euo pipefail

          radio_start="$(grep -n '^## ラジオ$' freewifi | head -1 | cut -d: -f1)"
          catv_start="$(grep -n '^## 愛媛CATV$' freewifi | head -1 | cut -d: -f1)"
          test -n "$radio_start"
          test -n "$catv_start"
          sed -n "${radio_start},$((catv_start - 1))p" freewifi > /tmp/freewifi-radio.txt

          FREE_RENDER_COUNT=$(grep -c 'https://ajiousama-radiko.onrender.com/radio-tv/' /tmp/freewifi-radio.txt || true)
          RADIO_RENDER_COUNT=$(grep -c 'https://ajiousama-radiko.onrender.com/radio-tv/' radio.m3u || true)
          RADIO_VERCEL_COUNT=$(grep -c 'https://himitsu-six.vercel.app/api/radiko?station=' radio.m3u || true)
          LEGACY_COUNT=$(grep -E -c 'desktop-h41fq90\.tailde6548\.ts\.net|ajiousama-radiko\.onrender\.com/live/' freewifi radio.m3u || true)

          echo "FreeWiFi compact image+audio radio URLs: $FREE_RENDER_COUNT"
          echo "radio.m3u nationwide image+audio URLs: $RADIO_RENDER_COUNT"
          echo "radio.m3u old audio-only Vercel URLs: $RADIO_VERCEL_COUNT"
          echo "obsolete gateway URLs: $LEGACY_COUNT"

          test "$LEGACY_COUNT" -eq 0
          test "$RADIO_VERCEL_COUNT" -eq 0
          test "$FREE_RENDER_COUNT" -ge 12
          test "$FREE_RENDER_COUNT" -le 20
          test "$RADIO_RENDER_COUNT" -ge 100
          ! grep -q '^### 北海道$' /tmp/freewifi-radio.txt
          grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/TBS$' radio.m3u
          grep -q '^https://simul2.drdi.st.nhk/live/17/joined/master.m3u8$' radio.m3u

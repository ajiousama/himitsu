name: Validate Current Radiko Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "freewifi"
      - "radio.m3u"
      - "radiko_freewifi.py"
      - ".github/workflows/radiko_render_rewrite.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate current Radiko gateway layout
        shell: bash
        run: |
          FREE_COUNT=$(grep -c 'https://himitsu-six.vercel.app/api/radiko?station=' freewifi || true)
          RADIO_COUNT=$(grep -c 'https://himitsu-six.vercel.app/api/radiko?station=' radio.m3u || true)
          LEGACY_COUNT=$(grep -E -c 'desktop-h41fq90\.tailde6548\.ts\.net|ajiousama-radiko\.onrender\.com/live/' freewifi radio.m3u || true)
          echo "FreeWiFi selected Radiko URLs: $FREE_COUNT"
          echo "radio.m3u all Radiko URLs: $RADIO_COUNT"
          echo "obsolete gateway URLs: $LEGACY_COUNT"
          test "$LEGACY_COUNT" -eq 0
          test "$FREE_COUNT" -ge 4
          test "$RADIO_COUNT" -ge 100

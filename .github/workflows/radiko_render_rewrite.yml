name: Validate Current Radiko Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "freewifi"
      - "radio.m3u"
      - "radiko_freewifi.py"
      - ".github/workflows/radiko_render_rewrite.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate APTV-compatible direct radio layout
        shell: bash
        run: |
          set -euo pipefail

          radio_start="$(grep -n '^## ラジオ$' freewifi | head -1 | cut -d: -f1)"
          catv_start="$(grep -n '^## 愛媛CATV$' freewifi | head -1 | cut -d: -f1)"
          test -n "$radio_start"
          test -n "$catv_start"
          test "$catv_start" -gt "$radio_start"
          sed -n "${radio_start},$((catv_start - 1))p" freewifi > /tmp/freewifi-radio.txt

          direct='https://himitsu-six.vercel.app/api/radiko?station='
          tsbase='https://raw.githubusercontent.com/ajiousama/himitsu/radio-ts-assets/'
          free_direct_count="$(grep -Fc "$direct" /tmp/freewifi-radio.txt || true)"
          free_ts_count="$(grep -Fc "$tsbase" /tmp/freewifi-radio.txt || true)"
          radio_ts_count="$(grep -Fc "$tsbase" radio.m3u || true)"
          legacy_count="$( (grep -Eh 'desktop-h41fq90\.tailde6548\.ts\.net|ajiousama-radiko\.onrender\.com/(live|radio-tv/)' freewifi radio.m3u || true) | wc -l)"

          echo "FreeWiFi direct Radiko URLs: $free_direct_count"
          echo "FreeWiFi TS visual URLs: $free_ts_count"
          echo "radio.m3u nationwide TS URLs: $radio_ts_count"
          echo "obsolete gateway URLs: $legacy_count"

          test "$free_direct_count" -eq 12
          test "$free_ts_count" -eq 0
          test "$radio_ts_count" -ge 100
          test "$legacy_count" -eq 0
          test "$(grep -c '^#EXTINF:' /tmp/freewifi-radio.txt)" -eq 12
          test "$(grep -c 'group-title="ラジオ"' /tmp/freewifi-radio.txt)" -eq 12
          ! grep -q '^### 北海道$' /tmp/freewifi-radio.txt
          ! grep -q 'himitsu-six.vercel.app/api/radio-tv' /tmp/freewifi-radio.txt
          ! grep -Eq 'NHKラジオ|NHK-FM|nhk_(r1|fm)_' /tmp/freewifi-radio.txt
          grep -Fq "${direct}RNB" /tmp/freewifi-radio.txt
          grep -Fq "${direct}OBC" /tmp/freewifi-radio.txt
          grep -Fq "${direct}KBS" /tmp/freewifi-radio.txt
          grep -q '^https://raw.githubusercontent.com/ajiousama/himitsu/radio-ts-assets/nhk_fm_matsuyama/master.m3u8
 radio.m3u

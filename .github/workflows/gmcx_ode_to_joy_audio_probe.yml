name: GCCX Ode to Joy opening audio analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_ode_to_joy_audio_probe.py"
      - ".github/workflows/gmcx_ode_to_joy_audio_probe.yml"

permissions:
  contents: read

concurrency:
  group: gccx-ode-to-joy-analysis
  cancel-in-progress: true

jobs:
  audio-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current GCCX data
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audio analysis requirements
        shell: bash
        run: |
          python -m pip install --quiet numpy requests
          ffmpeg -version | head -n 1
      - name: Detect recurring GCCX opening from actual broadcast audio
        run: python -u gmcx_ode_to_joy_audio_probe.py
      - name: Preserve findings without changing public playlists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gccx-ode-to-joy-audio-fingerprint-results
          path: gmcx_ode_to_joy_audio_review.json
          if-no-files-found: warn

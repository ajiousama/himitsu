name: Remove Akariko from Free WiFi once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove_akariko_once.yml'

permissions:
  contents: write

jobs:
  remove-akariko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only Akariko playlist entries
        shell: python
        run: |
          from pathlib import Path

          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          out = []
          i = 0
          removed = 0

          while i < len(lines):
              line = lines[i]
              if line.lstrip().startswith('#EXTINF') and 'akariko' in line.lower():
                  removed += 1
                  i += 1
                  if i < len(lines) and not lines[i].lstrip().startswith('#'):
                      i += 1
                  continue
              out.append(line)
              i += 1

          p.write_text(''.join(out), encoding='utf-8')
          print(f'REMOVED_AKARIKO_ENTRIES={removed}')

          remaining = [x for x in p.read_text(encoding='utf-8').splitlines() if 'akariko' in x.lower()]
          if remaining:
              raise SystemExit(f'Akariko references remain: {len(remaining)}')

      - name: Commit Free WiFi cleanup
        run: |
          if git diff --quiet -- freewifi; then
            echo 'No Akariko entries found; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git commit -m 'Remove Akariko entries from Free WiFi'
          git push origin HEAD:main

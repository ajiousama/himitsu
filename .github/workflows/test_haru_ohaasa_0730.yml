name: Test HARU Oha Asa 0730

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test_haru_ohaasa_0730.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare HARU and akariko origin paths
        shell: bash
        run: |
          set -u
          probe () {
            name="$1"; url="$2"; max="${3:-20}"
            code=$(curl -sSL --connect-timeout 8 --max-time "$max" -A 'Mozilla/5.0 HARU-VOD-Test' -w '%{http_code}' "$url" -o "/tmp/${name}.txt" || true)
            size=$(wc -c < "/tmp/${name}.txt" 2>/dev/null || echo 0)
            magic=$(head -c 50 "/tmp/${name}.txt" 2>/dev/null | tr '\n' ' ' || true)
            echo "$name HTTP=$code SIZE=$size BODY=$magic"
          }
          probe haru_abc_live 'https://haru.charandom.blog/stream/jp/abc/stream-output.m3u8?mode=hls'
          probe haru_abc_replay 'https://haru.charandom.blog/stream/jp/abc/replay.m3u8?mode=hls&start=1789552800'
          probe akariko_abc_live 'https://akariko-bck1.sankuria.sbs/stream/jp/abc/stream-output.m3u8?mode=hls'
          probe akariko_abc_replay 'https://akariko-bck1.sankuria.sbs/stream/jp/abc/replay.m3u8?mode=hls&start=1789552800'
          probe akariko_epg 'https://akariko-bck1.sankuria.sbs/epg/kai-epg.xml' 30

name: Test HARU Oha Asa 0730

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test_haru_ohaasa_0730.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HARU replay timestamp matrix
        shell: bash
        run: |
          set -u
          probe () {
            name="$1"; url="$2"
            code=$(curl -sSL --connect-timeout 8 --max-time 20 -A 'Mozilla/5.0 HARU-VOD-Test' -w '%{http_code}' "$url" -o "/tmp/${name}.txt" || true)
            magic=$(head -c 20 "/tmp/${name}.txt" 2>/dev/null | tr '\n' ' ' || true)
            echo "$name HTTP=$code BODY=$magic"
          }
          # ABC Oha Asa 2026-09-16: EPG-embedded start and the suspected -13h correction.
          probe abc_embedded 'https://haru.charandom.blog/stream/jp/abc/replay.m3u8?mode=hls&start=1789502400'
          probe abc_minus13h 'https://haru.charandom.blog/stream/jp/abc/replay.m3u8?mode=hls&start=1789455600'
          # Previous weekday as a retention/control check.
          probe abc_0915_embedded 'https://haru.charandom.blog/stream/jp/abc/replay.m3u8?mode=hls&start=1789416000'
          probe abc_0915_minus13h 'https://haru.charandom.blog/stream/jp/abc/replay.m3u8?mode=hls&start=1789369200'
          # Known terrestrial HARU examples as origin controls.
          probe tbs_vivant 'https://haru.charandom.blog/stream/jp/tbs/replay.m3u8?mode=hls&start=1789300800'
          probe ktv_tsurigoro 'https://haru.charandom.blog/stream/jp/kansai_tv/replay.m3u8?mode=hls&start=1789243200'

      - name: Require at least one HARU origin control
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for f in /tmp/tbs_vivant.txt /tmp/ktv_tsurigoro.txt; do
            grep -q '^#EXTM3U' "$f" && ok=1 || true
          done
          test "$ok" = 1

name: HARUKA playlist diagnostics (read-only)
on:
  push:
    branches:
      - haruka-ad-diagnostics-20261009
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure ffmpeg is installed
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Watch and fingerprint HLS transitions live
        run: python scripts/watch_haruka_transitions.py

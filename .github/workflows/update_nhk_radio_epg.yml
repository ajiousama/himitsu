name: Update NHK Radio EPG

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update FreeWiFi ALL（ajiousama単独 / 自動EPG）"
    types:
      - completed
  schedule:
    - cron: "30 0,6,12,18 * * *"
  push:
    branches:
      - main
    paths:
      - "nhk_radio_epg.py"
      - "radio/playlist.m3u"
      - ".github/workflows/update_nhk_radio_epg.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Merge NHK radio programme guide
        run: python nhk_radio_epg.py

      - name: Validate NHK radio EPG
        shell: bash
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('guides.xml'); print('XML OK')"
          CH=$(grep -E -c '<channel id="nhk_(r1|fm)_' guides.xml || true)
          PG=$(grep -E -c '<programme .*channel="nhk_(r1|fm)_' guides.xml || true)
          echo "NHK radio EPG channels: $CH"
          echo "NHK radio EPG programmes: $PG"
          test "$CH" -gt 0
          test "$PG" -gt 0

      - name: Commit NHK radio EPG
        shell: bash
        run: |
          set -euo pipefail
          cp guides.xml /tmp/guides.xml.nhk-radio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Overlay only NHK radio rows onto latest shared EPG. Never restore
            # the complete pre-acquisition guides.xml over newer race state.
            python - <<'PY'
          import xml.etree.ElementTree as ET
          from copy import deepcopy
          source = ET.parse('/tmp/guides.xml.nhk-radio').getroot()
          tree = ET.parse('guides.xml')
          root = tree.getroot()
          def cid(el):
              return el.get('id','') if el.tag == 'channel' else el.get('channel','') if el.tag == 'programme' else ''
          ids = {cid(el) for el in source if cid(el).startswith(('nhk_r1_', 'nhk_fm_'))}
          if not ids:
              raise RuntimeError('NHK radio snapshot has no target IDs')
          for el in list(root):
              if cid(el) in ids:
                  root.remove(el)
          for el in source:
              if cid(el) in ids:
                  if el.tag == 'channel':
                      root.insert(0, deepcopy(el))
                  else:
                      root.append(deepcopy(el))
          ET.indent(tree, space='  ')
          tree.write('guides.xml', encoding='utf-8', xml_declaration=True)
          PY
            git add guides.xml
            if git diff --cached --quiet; then
              echo "No NHK radio EPG changes"
              exit 0
            fi
            git commit -m "Update NHK radio EPG without overwriting other guides [skip render]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::NHK radio publication failed after retries"
          exit 1

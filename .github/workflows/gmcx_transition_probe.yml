name: GCCX precise transition review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_transition_probe.py"
      - ".github/workflows/gmcx_transition_probe.yml"

permissions:
  contents: read

concurrency:
  group: gccx-precise-transition-review
  cancel-in-progress: true

jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        task: [kai_end, fivehour_end, lemmings_end]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image and ffmpeg dependencies
        shell: bash
        run: |
          python -m pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Capture actual GCCX programme transition contact sheets
        run: python -u gmcx_transition_probe.py --task ${{ matrix.task }}
      - name: Publish inspection evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gccx-transition-${{ matrix.task }}
          path: gmcx_transition_probe_frames/${{ matrix.task }}/*
          if-no-files-found: warn

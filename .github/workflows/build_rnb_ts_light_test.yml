name: Build RNB lightweight MPEG-TS radio visual test

on:
  push:
    paths:
      - '.github/workflows/build_rnb_ts_light_test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Build lightweight RNB MPEG-TS video window
        shell: bash
        run: |
          set -euo pipefail
          OUT='radio-tv-ts-light/RNB'
          CARD='vercel-radiko/radio-video-assets/cards/RNB.jpg'
          test -s "$CARD"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          ffmpeg -y -hide_banner -loglevel error \
            -loop 1 -framerate 1/10 -i "$CARD" \
            -t 28800 \
            -vf "scale=640:360:force_original_aspect_ratio=decrease,pad=640:360:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -profile:v baseline -level:v 3.0 \
            -preset ultrafast -tune stillimage -crf 36 \
            -pix_fmt yuv420p -r 1/10 -g 6 -keyint_min 6 -sc_threshold 0 -an \
            -f hls -hls_segment_type mpegts -hls_time 300 -hls_list_size 0 \
            -hls_flags independent_segments \
            -hls_segment_filename "$OUT/seg_%03d.ts" \
            "$OUT/raw.m3u8"

      - name: Write playlists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import math
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          out = Path('radio-tv-ts-light/RNB')
          raw = (out / 'raw.m3u8').read_text(encoding='utf-8').splitlines()
          entries = []
          dur = None
          for line in raw:
              if line.startswith('#EXTINF:'):
                  dur = float(line.split(':', 1)[1].split(',', 1)[0])
              elif line and not line.startswith('#') and dur is not None:
                  entries.append((dur, line.strip()))
                  dur = None
          if not entries:
              raise SystemExit('No MPEG-TS segments generated')

          now = datetime.now(JST)
          start = now.replace(minute=0, second=0, microsecond=0) - timedelta(hours=1)
          offset = (now - start).total_seconds()
          target = math.ceil(max(d for d, _ in entries))
          lines = [
              '#EXTM3U', '#EXT-X-VERSION:3', '#EXT-X-INDEPENDENT-SEGMENTS',
              f'#EXT-X-TARGETDURATION:{target}', '#EXT-X-MEDIA-SEQUENCE:0',
              f'#EXT-X-START:TIME-OFFSET={offset:.3f},PRECISE=YES',
          ]
          stamp = start
          for duration, name in entries:
              lines.append(f'#EXT-X-PROGRAM-DATE-TIME:{stamp.isoformat(timespec="milliseconds")}')
              lines.append(f'#EXTINF:{duration:.3f},')
              lines.append(name)
              stamp += timedelta(seconds=duration)
          lines += ['#EXT-X-ENDLIST', '']
          (out / 'video.m3u8').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'master.m3u8').write_text('\n'.join([
              '#EXTM3U', '#EXT-X-VERSION:6', '#EXT-X-INDEPENDENT-SEGMENTS',
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="radio",NAME="RNB radio",DEFAULT=YES,AUTOSELECT=YES,CHANNELS="2",URI="https://himitsu-six.vercel.app/api/radiko?station=RNB&stage=media"',
              '#EXT-X-STREAM-INF:BANDWIDTH=160000,AVERAGE-BANDWIDTH=120000,RESOLUTION=640x360,FRAME-RATE=0.100,CODECS="avc1.42e01e,mp4a.40.5",AUDIO="radio",CLOSED-CAPTIONS=NONE',
              'video.m3u8', '',
          ]), encoding='utf-8')
          (out / 'raw.m3u8').unlink(missing_ok=True)

          Path('rnb_ts_light_test.m3u').write_text('\n'.join([
              '#EXTM3U',
              '#EXTINF:-1 tvg-id="radiko.RNB" tvg-logo="https://radiko.jp/v2/static/station/logo/RNB/lrtrim/688x160.png" group-title="ラジオTEST",RNB南海放送（軽量TSテスト）',
              'https://raw.githubusercontent.com/ajiousama/himitsu/main/radio-tv-ts-light/RNB/master.m3u8', '',
          ]), encoding='utf-8')
          PY

      - name: Commit lightweight test assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f radio-tv-ts-light/RNB rnb_ts_light_test.m3u
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Build lightweight RNB MPEG-TS visual test'
          git push

name: Rename NAORI labels once

on:
  push:
    paths:
      - '.github/workflows/rename_naori_once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename netgenx labels only for NAORI entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          i = 0
          changed = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('#EXTINF:') and i + 1 < len(lines) and 'naori-test.netgenx.site' in lines[i+1]:
                  new = line.replace('(netgenx)', '(naori)').replace('netgenx)', 'naori)')
                  if new != line:
                      changed += 1
                  out.append(new)
                  out.append(lines[i+1])
                  i += 2
                  continue
              out.append(line)
              i += 1
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'changed labels: {changed}')
          PY
      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/rename_naori_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi .github/workflows/rename_naori_once.yml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Label NAORI streams in freewifi'
          git push

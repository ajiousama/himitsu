name: GCCX All Recording Days Audio Recheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_full_day_audio_recheck.py"
      - ".github/workflows/gmcx_full_day_audio_recheck.yml"

permissions:
  contents: read

concurrency:
  group: gccx-all-recording-days-audio-recheck
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        vod_prefix: ["f622346e", "df1386fd", "5847ae05", "e4f91158"]
        shard: [0, 1, 2]
    steps:
      - name: Checkout GCCX VOD5 and evidence
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare FFmpeg and acoustic matcher
        shell: bash
        run: |
          python -m pip install --quiet numpy
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Recheck every source-date's existing episode and navigation cuts
        run: python -u gmcx_full_day_audio_recheck.py --vod-prefix ${{ matrix.vod_prefix }} --shard ${{ matrix.shard }} --shards 3
      - name: Preserve partial results on any source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gccx-all-days-${{ matrix.vod_prefix }}-${{ matrix.shard }}
          path: gmcx_full_day_audio_review/*
          if-no-files-found: warn

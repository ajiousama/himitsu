name: Refresh nationwide 180p radio TS

on:
  push:
    branches: [main]
    paths:
      - 'radiko_freewifi.py'
      - '.github/workflows/refresh_nationwide_radio_ts_180p.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-nationwide-radio-ts-180p
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Build nationwide radio.m3u and station metadata
        shell: bash
        run: |
          set -euo pipefail
          python radiko_freewifi.py --playlist-only
          python - <<'PY'
          import json
          import radiko_freewifi as r
          stations = r.discover_stations()
          if len(stations) < 100:
              raise SystemExit(f'too few stations: {len(stations)}')
          with open('/tmp/nationwide_stations.json', 'w', encoding='utf-8') as f:
              json.dump(stations, f, ensure_ascii=False)
          print('stations=', len(stations))
          PY

      - name: Check out rolling TS asset branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin radio-ts-assets
          rm -rf /tmp/radio-ts-assets-work
          git worktree add -B nationwide-radio-ts-assets /tmp/radio-ts-assets-work origin/radio-ts-assets

      - name: Build missing station video assets and refresh playlists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import json, math, os, subprocess, tempfile, urllib.request

          root = Path('/tmp/radio-ts-assets-work')
          stations = json.loads(Path('/tmp/nationwide_stations.json').read_text(encoding='utf-8'))
          fallback = Path('vercel-radiko/radio-video-assets/cards/RNB.jpg').resolve()
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          start = now - timedelta(hours=1)
          built = 0
          reused = 0

          def write_playlists(sid: str, out: Path):
              segs = sorted(out.glob('seg_*.ts'))
              if len(segs) < 12:
                  raise RuntimeError(f'{sid}: not enough TS segments ({len(segs)})')
              lines = [
                  '#EXTM3U',
                  '#EXT-X-VERSION:3',
                  '#EXT-X-INDEPENDENT-SEGMENTS',
                  '#EXT-X-TARGETDURATION:300',
                  '#EXT-X-MEDIA-SEQUENCE:0',
                  '#EXT-X-START:TIME-OFFSET=3600.000,PRECISE=YES',
              ]
              stamp = start
              for seg in segs:
                  lines.append(f'#EXT-X-PROGRAM-DATE-TIME:{stamp.isoformat(timespec="milliseconds")}')
                  lines.append('#EXTINF:300.000,')
                  lines.append(seg.name)
                  stamp += timedelta(seconds=300)
              lines += ['#EXT-X-ENDLIST', '']
              (out / 'video.m3u8').write_text('\n'.join(lines), encoding='utf-8')
              (out / 'master.m3u8').write_text('\n'.join([
                  '#EXTM3U',
                  '#EXT-X-VERSION:6',
                  '#EXT-X-INDEPENDENT-SEGMENTS',
                  f'#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="radio",NAME="{sid} radio",DEFAULT=YES,AUTOSELECT=YES,CHANNELS="2",URI="https://himitsu-six.vercel.app/api/radiko?station={sid}&stage=media"',
                  '#EXT-X-STREAM-INF:BANDWIDTH=180000,AVERAGE-BANDWIDTH=120000,RESOLUTION=320x180,FRAME-RATE=1.000,CODECS="avc1.42e01e,mp4a.40.5",AUDIO="radio",CLOSED-CAPTIONS=NONE',
                  'video.m3u8',
                  '',
              ]), encoding='utf-8')

          for sid, meta in sorted(stations.items()):
              out = root / sid
              out.mkdir(parents=True, exist_ok=True)
              segs = sorted(out.glob('seg_*.ts'))
              if len(segs) < 36:
                  for p in out.glob('seg_*.ts'):
                      p.unlink()
                  logo_url = (meta.get('logo') or '').strip()
                  with tempfile.TemporaryDirectory() as td:
                      logo = Path(td) / 'logo.png'
                      try:
                          req = urllib.request.Request(logo_url, headers={'User-Agent':'Mozilla/5.0'})
                          with urllib.request.urlopen(req, timeout=20) as r:
                              logo.write_bytes(r.read())
                      except Exception:
                          logo.write_bytes(fallback.read_bytes())

                      cmd = [
                          'ffmpeg','-y','-hide_banner','-loglevel','error',
                          '-loop','1','-framerate','1','-i',str(logo),
                          '-t','10800',
                          '-vf','scale=320:180:force_original_aspect_ratio=decrease,pad=320:180:(ow-iw)/2:(oh-ih)/2:color=black',
                          '-c:v','libx264','-profile:v','baseline','-level:v','3.0',
                          '-preset','ultrafast','-tune','stillimage','-crf','38',
                          '-pix_fmt','yuv420p','-r','1','-g','10','-keyint_min','10','-sc_threshold','0','-an',
                          '-f','hls','-hls_segment_type','mpegts','-hls_time','300','-hls_list_size','0',
                          '-hls_flags','independent_segments',
                          '-hls_segment_filename',str(out / 'seg_%03d.ts'),
                          str(out / 'raw.m3u8'),
                      ]
                      try:
                          subprocess.run(cmd, check=True)
                      except subprocess.CalledProcessError:
                          logo.write_bytes(fallback.read_bytes())
                          subprocess.run(cmd, check=True)
                  (out / 'raw.m3u8').unlink(missing_ok=True)
                  built += 1
              else:
                  reused += 1
              write_playlists(sid, out)

          print(f'built={built} reused={reused} total={len(stations)}')
          PY

      - name: Validate nationwide assets
        shell: bash
        run: |
          set -euo pipefail
          count="$(find /tmp/radio-ts-assets-work -mindepth 2 -maxdepth 2 -name master.m3u8 | wc -l | tr -d ' ')"
          echo "asset masters=$count"
          test "$count" -ge 100
          ts_count="$(grep -c '^https://raw.githubusercontent.com/ajiousama/himitsu/radio-ts-assets/.*/master.m3u8$' radio.m3u || true)"
          echo "radio.m3u TS Radiko count=$ts_count"
          test "$ts_count" -ge 100
          ! grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/' radio.m3u

      - name: Publish rolling nationwide TS assets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/radio-ts-assets-work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'TS assets already current'
          else
            git commit -m 'Refresh nationwide 180p radio TS assets'
            git push origin HEAD:radio-ts-assets
          fi

      - name: Commit nationwide radio.m3u
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio.m3u
          if git diff --cached --quiet; then
            echo 'radio.m3u already current'
            exit 0
          fi
          git commit -m 'Use stable TS visuals for nationwide Radiko'
          git pull --rebase origin main
          git push origin HEAD:main

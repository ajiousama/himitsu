name: Apply ZooMoo cleanup and logo once

on:
  push:
    paths:
      - '.github/workflows/apply_zoomoo_once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install accepted ZooMoo logo and keep one channel
        shell: python
        run: |
          from pathlib import Path
          import base64, re

          logo_b64 = ""
          Path('logos').mkdir(exist_ok=True)
          Path('logos/zoomoo.png').write_bytes(base64.b64decode(logo_b64))

          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          kept = False
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.lstrip().startswith('#EXTINF') and 'tvg-id="ZooMoo_jp"' in line:
                  url = lines[i+1] if i + 1 < len(lines) else ''
                  if not kept:
                      out.append('#EXTINF:-1 tvg-id="ZooMoo_jp" tvg-logo="https://raw.githubusercontent.com/ajiousama/himitsu/main/logos/zoomoo.png" group-title="CS",ZooMoo')
                      out.append(url)
                      out.append('')
                      kept = True
                  i += 2
                  while i < len(lines) and not lines[i].strip():
                      i += 1
                  continue
              out.append(line)
              i += 1

          if not kept:
              raise SystemExit('ZooMoo entry not found')
          p.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi logos/zoomoo.png
          git commit -m "Keep one ZooMoo channel and add logo [skip ci]"
          git pull --rebase origin main
          git push origin main

name: Probe GCH Free B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_gch_b.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clients
        run: |
          python -m pip install --upgrade --pre 'yt-dlp[default]' curl_cffi
      - name: Probe official free player
        shell: bash
        run: |
          python - <<'PY'
          import re
          from html import unescape
          from urllib.parse import urljoin
          from curl_cffi import requests
          import yt_dlp

          page_url='https://sp.gch.jp/jra'
          headers={'User-Agent':'Mozilla/5.0','Referer':page_url}
          html=requests.get(page_url,headers=headers,impersonate='chrome',timeout=20).text
          frames=[]
          for src in re.findall(r'<iframe[^>]+src=["\']([^"\']+)["\']',html,re.I):
              u=urljoin(page_url,unescape(src))
              if 'players.streaks.jp/gch-jra/' in u:
                  frames.append(u)
          print('frames=',len(frames))
          if not frames:
              raise SystemExit('No official free player iframe')
          player=frames[0]
          print('player=',player.split('?')[0])
          opts={'quiet':True,'no_warnings':False,'skip_download':True,'noplaylist':True,
                'http_headers':{'User-Agent':'Mozilla/5.0','Referer':page_url,'Origin':'https://players.streaks.jp'}}
          with yt_dlp.YoutubeDL(opts) as ydl:
              info=ydl.extract_info(player,download=False)
          print('id=',info.get('id'),'live_status=',info.get('live_status'),'formats=',len(info.get('formats') or []))
          found=[]
          d=info.get('url')
          if isinstance(d,str) and '.m3u8' in d: found.append(d)
          for f in info.get('formats') or []:
              u=f.get('url')
              if isinstance(u,str) and '.m3u8' in u: found.append(u)
          print('hls_count=',len(found))
          if not found:
              raise SystemExit('No HLS returned by STREAKS extractor')
          print('GCH_B_STREAKS_OK')
          PY

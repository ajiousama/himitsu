name: GCCX Title Logo Region Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_logo_search.py"
      - "test_gmcx_logo_search.py"
      - ".github/workflows/gmcx_logo_search.yml"

permissions:
  contents: read

concurrency:
  group: gmcx-title-logo-region-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Verify logo and video-veto logic
        run: python -m unittest -v test_gmcx_logo_search.py
      - name: Look for actual GCCX title logos around unresolved provisional cuts
        run: python -u gmcx_logo_search.py
      - name: Retain diagnostic evidence without changing production VOD5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmcx-title-logo-region-findings
          path: gmcx_logo_search_review.json
          if-no-files-found: warn

name: Repair EPG pipeline once

on:
  push:
    paths:
      - '.github/workflows/repair_epg_pipeline_once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore clean public-sports sync
        run: |
          python repair_public_sports_sync_once.py
          python -m py_compile freewifi_today_public_sports.py epg_final_guard.py kick_epg.py
      - name: Commit repaired pipeline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi_today_public_sports.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Repair public sports sync syntax for EPG build'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

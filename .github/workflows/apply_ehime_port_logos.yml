name: Apply Ehime Port Logos

on:
  push:
    paths:
      - 'logo_packs/ehime_port_logos.zip'
      - '.github/workflows/apply_ehime_port_logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract approved port logos
        run: |
          mkdir -p logos/youtube
          unzip -o logo_packs/ehime_port_logos.zip -d logos/youtube
      - name: Update port logo references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('general_youtube_sources_ports.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          m={
            'youtube.ehime_mishima_kawanoe_port':'ehime_port_mishima_kawanoe.jpg',
            'youtube.ehime_niihama_port':'ehime_port_niihama.jpg',
            'youtube.ehime_toyo_port':'ehime_port_toyo.jpg',
            'youtube.ehime_yuge_port':'ehime_port_yuge.jpg',
            'youtube.ehime_imabari_port':'ehime_port_imabari.jpg',
            'youtube.ehime_hashihama_port':'ehime_port_hashihama.jpg',
            'youtube.ehime_horie_wake':'ehime_port_horie_wake.jpg',
            'youtube.ehime_matsuyama_port':'ehime_port_matsuyama.jpg',
            'youtube.ehime_masaki_port':'ehime_port_masaki.jpg',
            'youtube.ehime_iyo_port':'ehime_port_iyo.jpg',
            'youtube.ehime_nagahama_port':'ehime_port_nagahama.jpg',
            'youtube.ehime_ikata_port':'ehime_port_ikata.jpg',
            'youtube.ehime_mikame_port':'ehime_port_mikame.jpg',
            'youtube.ehime_misho_port':'ehime_port_misho.jpg',
            'youtube.ehime_mitsuhama_port':'ehime_port_mitsuhama.jpg',
          }
          base='https://raw.githubusercontent.com/ajiousama/himitsu/main/logos/youtube/'
          for x in data:
            if x.get('id') in m:
              x['logo']=base+m[x['id']]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit applied logos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logos/youtube/ehime_port_*.jpg general_youtube_sources_ports.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Apply approved Ehime port logos'
          git pull --rebase origin main
          git push origin main

name: Update KICK Replay Catalog
# post-live refresh trigger: 2026-10-08 22:58 JST
# replay-layer-v3 VOD5 integration
# recovery-touch: 2026-09-29 12:05 JST

on:
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"
  push:
    branches:
      - main
    paths:
      - "vod5/kick_channels.json"
      - "kick_replay.py"
      - "kick_gmcx_chapters.py"
      - "kick_replay_freewifi.py"
      - "gmcx_episode_titles.json"
      - "test_gmcx_star_soldier_insert.py"
      - "test_gmcx_404_trial_cuts.py"
      - "test_gmcx_417_review_cuts.py"
      - ".github/workflows/update_kick_replay.yml"

permissions:
  contents: write

# This workflow now writes VOD5, so share the same repository-wide mutex as
# the main VOD5/EPG writer. That prevents replay updates from overwriting a
# newer BOAT/public-sports/KICK LIVE state.
concurrency:
  # Emergency GMCX repair commits may run beside an obsolete analyser.
  # Normal scheduled/push runs still share the repository-wide writer mutex.
  group: ${{ contains(github.event.head_commit.message, '[gmcx-final]') && 'himitsu-gmcx-final' || contains(github.event.head_commit.message, '[gmcx-fast]') && 'himitsu-gmcx-fast' || contains(github.event.head_commit.message, '[gmcx-fix]') && 'himitsu-gmcx-fix' || 'himitsu-freewifi-state-writer' }}
  # Fast/fix GMCX pushes supersede older analyser runs. Scheduled/catalog
  # writers still finish normally.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[gmcx-fast]') || contains(github.event.head_commit.message, '[gmcx-fix]') || contains(github.event.head_commit.message, '[gmcx-final]') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure ffmpeg for GMCX title-card detection
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Prepare spectral GCCX title BGM matcher
        run: python -m pip install --quiet numpy

      - name: Verify GCCX 2024/2025 special programme layout
        run: python -m unittest -v test_gmcx_star_soldier_insert.py test_gmcx_397_sp52.py test_gmcx_404_trial_cuts.py test_gmcx_417_review_cuts.py

      - name: Build KICK replay catalog
        run: python -u kick_replay.py

      - name: Build GMCX episode chapters
        run: python -u kick_gmcx_chapters.py

      - name: Automatically align GCCX titles (three BGM sources, fail closed)
        shell: bash
        run: |
          # Only audio-verified candidates may change; confirmed cuts are locked.
          python -m unittest -q test_gmcx_cut_timing.py test_gmcx_bgm_autocut.py test_gmcx_bgm_autocut_apply.py
          cp kick_gmcx_chapters.json /tmp/kick_gmcx_chapters_before_bgm.json
          cp kick_gmcx_chapters.m3u /tmp/kick_gmcx_chapters_before_bgm.m3u
          # Cross-recording BGM offset calibration uses confirmed #378 as baseline.
          # #417+ keeps 58:00 fallback cuts. Only independently calibrated,
          # high-consensus title-BGM boundaries within the timing guard can
          # override them; unverified bonus/special footage stays separate.
          if ! python -u gmcx_bgm_autocut.py --ranges 377 387 397 404 417; then
            echo "::warning::GCCX audio detection failed; cached verified cuts are used"
          fi
          if ! python -u gmcx_bgm_autocut_apply.py; then
            cp /tmp/kick_gmcx_chapters_before_bgm.json kick_gmcx_chapters.json
            cp /tmp/kick_gmcx_chapters_before_bgm.m3u kick_gmcx_chapters.m3u
            echo "::warning::GCCX BGM publisher rejected edits; restored original catalogue"
          fi

      - name: Validate replay outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          UA = 'Mozilla/5.0 (KICK VOD validation)'
          def probe_m3u8(url, attempts=3):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={'User-Agent': UA, 'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
                      )
                      with urllib.request.urlopen(req, timeout=30) as r:
                          head = r.read(4096).decode('utf-8', 'replace')
                      if head.lstrip().startswith('#EXTM3U'):
                          return True
                      last = RuntimeError(f'not HLS: {url}')
                  except Exception as exc:
                      last = exc
                  if attempt < attempts:
                      time.sleep(attempt * 2)
              print(f'::warning::HLS probe failed after {attempts} attempts: {url} ({last})')
              return False

          j = json.loads(Path('kick_replay.json').read_text(encoding='utf-8'))
          g = json.loads(Path('kick_gmcx_chapters.json').read_text(encoding='utf-8'))
          m3u = Path('kick_replay.m3u').read_text(encoding='utf-8')
          gm3u = Path('kick_gmcx_chapters.m3u').read_text(encoding='utf-8')
          assert m3u.startswith('#EXTM3U')
          assert gm3u.startswith('#EXTM3U')
          assert isinstance(j.get('channels'), list)
          assert isinstance(j.get('vods'), list)
          assert isinstance(g.get('results'), list)

          # Mirumo is not a GCCX source. It must never return via a later
          # catalog refresh or an old cached configuration.
          assert all(x.get('tvg_id') != 'kick.gccx' for x in j['channels'])
          assert all(x.get('tvg_id') != 'kick.gccx' for x in j['vods'])

          publishable = [x for x in j['vods'] if x.get('ready_for_publish')]
          transient_bad = []
          for item in publishable:
              assert item.get('playable') is True
              assert item.get('source_url')
              if not probe_m3u8(item['source_url']):
                  transient_bad.append(item.get('source_url'))
          if transient_bad:
              print(f'::warning::{len(transient_bad)} publishable KICK source(s) failed the second-pass probe; keeping the catalog build alive because the source was already verified during generation')

          ready = [x for x in g['results'] if x.get('status') == 'ready']
          ai = [x for x in g['results'] if x.get('status') == 'ai_required']
          all_chapters = [c for x in ready for c in (x.get('chapters') or [])]
          # Probe representative chapter playlists end-to-end through
          # VOD5-media: first, middle and last. Render can transiently
          # return 502 during a cold/redeploy window, so do not freeze the
          # whole catalog because one representative clip hiccupped. At least
          # one representative must still pass after retries.
          if all_chapters:
              picks = [all_chapters[0], all_chapters[len(all_chapters)//2], all_chapters[-1]]
              seen = set()
              ok = 0
              checked = 0
              for chapter in picks:
                  url = chapter.get('replay_url')
                  if url and url not in seen:
                      seen.add(url)
                      checked += 1
                      ok += int(probe_m3u8(url, attempts=4))
              if checked and ok == 0:
                  print('::warning::all representative VOD5-media chapter probes failed transiently; continuing without freezing the whole replay catalog')
              print(f'GMCX Render chapter probes: {ok}/{checked} passed')

          chapters = len(all_chapters)
          print('KICK replay channels:', [(x.get('tvg_id'), x.get('vod_count')) for x in j['channels']])
          print('KICK replay VOD total:', len(j['vods']), 'publishable:', len(publishable))
          print('GMCX ready VODs:', len(ready), 'chapters:', chapters, 'AI required:', len(ai))
          PY

      - name: Publish replay metadata and merge vod5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot="$(mktemp -d)"
          cp kick_replay.json "$snapshot/kick_replay.json"
          cp kick_replay.m3u "$snapshot/kick_replay.m3u"
          cp kick_gmcx_chapters.json "$snapshot/kick_gmcx_chapters.json"
          cp kick_gmcx_chapters.m3u "$snapshot/kick_gmcx_chapters.m3u"
          cp gmcx_bgm_auto_starts.json "$snapshot/gmcx_bgm_auto_starts.json"

          for attempt in 1 2 3 4 5; do
            echo "KICK replay/VOD5 publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            cp "$snapshot/kick_replay.json" kick_replay.json
            cp "$snapshot/kick_replay.m3u" kick_replay.m3u
            cp "$snapshot/kick_gmcx_chapters.json" kick_gmcx_chapters.json
            cp "$snapshot/kick_gmcx_chapters.m3u" kick_gmcx_chapters.m3u
            cp "$snapshot/gmcx_bgm_auto_starts.json" gmcx_bgm_auto_starts.json

            # Rebuild vod5 from the newest replay metadata.
            # The helper also removes any legacy KICK replay block from FreeWiFi.
            python -u kick_replay_freewifi.py
            python -m unittest -q test_vod_source_groups.py

            python - <<'PY'
          from pathlib import Path
          text = Path('vod5/playlist.m3u').read_text(encoding='utf-8-sig', errors='replace')
          assert text.startswith('#EXTM3U')
          assert '# === KICK_REPLAY_START ===' not in text
          assert '# === KICK_REPLAY_END ===' not in text
          assert 'Mirumo' not in text
          assert 'tvg-id="kick.gccx"' not in text
          count = text.count('group-title="KICK系VOD"')
          assert count > 0
          assert 'group-title="VOD"' not in text
          assert 'group-title="blog系VOD"' not in text
          print('vod5 KICK VOD catalog validated:', count, 'entries')
          PY

            git add vod5/playlist.m3u vod5/freewifi_specials.m3u VOD5 freewifi kick_replay.json kick_replay.m3u kick_gmcx_chapters.json kick_gmcx_chapters.m3u gmcx_bgm_auto_starts.json
            if git diff --cached --quiet; then
              echo "KICK/GMCX replay and VOD5 already current"
              exit 0
            fi
            git commit -m "Update KICK replay in VOD5 [skip ci] [skip render]"
            if git push origin HEAD:main; then
              echo "KICK replay updated in VOD5"
              exit 0
            fi
            echo "::warning::main moved during replay publish; rebuilding on newest main"
            sleep 1
          done

          echo "::error::KICK replay/VOD5 publish failed after retries"
          exit 1

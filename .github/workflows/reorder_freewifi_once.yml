name: Reorder FreeWiFi Once

on:
  push:
    paths:
      - '.github/workflows/reorder_freewifi_once.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reorder freewifi safely
        shell: python
        run: |
          import re
          from pathlib import Path
          from collections import OrderedDict

          path = Path('freewifi')
          text = path.read_text(encoding='utf-8-sig', errors='replace').replace('\r\n', '\n')
          lines = text.split('\n')

          # preamble before first EXTINF
          first = next((i for i, s in enumerate(lines) if s.startswith('#EXTINF:')), len(lines))
          preamble = lines[:first]
          body = lines[first:]

          entries = []
          cur = []
          for line in body:
              if line.startswith('#EXTINF:'):
                  if cur:
                      entries.append(cur)
                  cur = [line]
              elif cur:
                  cur.append(line)
          if cur:
              entries.append(cur)

          def extinf(e):
              return e[0] if e else ''

          def attr(s, key):
              m = re.search(rf'{re.escape(key)}="([^"]*)"', s)
              return m.group(1).strip() if m else ''

          def name_of(e):
              s = extinf(e)
              return s.split(',', 1)[1].strip() if ',' in s else ''

          def category(e):
              s = extinf(e)
              name = name_of(e)
              group = attr(s, 'group-title')
              tvgid = attr(s, 'tvg-id')
              joined = f'{s} {name} {group} {tvgid}'

              if '予備' in joined:
                  return 'RESERVE'
              if '競馬' in group or 'グリーンチャンネル' in joined or 'GCH' in name.upper():
                  return 'KEIBA'
              # BS/CS are intentionally separate even when the same network exists terrestrially.
              if group.startswith('BS') or re.search(r'(^|[（( ])BS[0-9・\- ]', name, re.I) or tvgid.startswith('BS') or '_BS' in tvgid:
                  return 'BS'
              if group.startswith('CS'):
                  return 'CS'

              # Existing terrestrial / realtime groups are the reordering target.
              terrestrial_groups = ('関東', '関西', 'TVer', '地上波', '北海道', '東北', '中部', '中国', '四国', '九州', '沖縄')
              if any(group.startswith(x) for x in terrestrial_groups):
                  return 'TERRESTRIAL'
              return 'OTHER'

          TVER_MAP = {
              'tver_ntv': '日本テレビ_jp',
              'tver_tbs': 'TBS_jp',
              'tver_cx': 'フジテレビ_jp',
              'tver_ex': 'テレビ朝日_jp',
              'tver_tx': 'テレ東_jp',
          }

          provider_words = [
              'haruka','kaitekitv','kaiteki','primehomehd','primehome',
              '5002','netgenx','bonbon','tver'
          ]

          def station_key(e):
              s = extinf(e)
              tvgid = attr(s, 'tvg-id')
              if tvgid in TVER_MAP:
                  return TVER_MAP[tvgid]
              if tvgid:
                  return tvgid

              n = name_of(e).lower()
              for w in provider_words:
                  n = re.sub(rf'[（(]?{re.escape(w)}[）)]?', '', n, flags=re.I)
              n = re.sub(r'\s+', ' ', n).strip(' -_()（）')
              return n

          def grouped(cat_entries):
              buckets = OrderedDict()
              for e in cat_entries:
                  buckets.setdefault(station_key(e), []).append(e)
              out = []
              for _, es in buckets.items():
                  out.extend(es)
              return out

          cats = {k: [] for k in ['TERRESTRIAL','BS','CS','KEIBA','OTHER','RESERVE']}
          for e in entries:
              cats[category(e)].append(e)

          order = [
              ('TERRESTRIAL', '## 地上波'),
              ('BS', '## BS'),
              ('CS', '## CS'),
              ('KEIBA', '## 競馬'),
              ('OTHER', '## その他'),
              ('RESERVE', '## 予備（並べ替え対象外）'),
          ]

          out = []
          # Keep original M3U header/preamble intact, dropping trailing blank noise only.
          while preamble and preamble[-1] == '':
              preamble.pop()
          out.extend(preamble)
          out.append('')

          before = len(entries)
          for key, header in order:
              es = cats[key]
              if not es:
                  continue
              out.append(header)
              out.append('')
              arranged = es if key in ('OTHER','RESERVE') else grouped(es)
              for e in arranged:
                  block = list(e)
                  while block and block[-1] == '':
                      block.pop()
                  out.extend(block)
                  out.append('')

          result = '\n'.join(out).rstrip() + '\n'

          # Safety checks: never write if channel count or URLs changed.
          old_ext = len(re.findall(r'^#EXTINF:', text, flags=re.M))
          new_ext = len(re.findall(r'^#EXTINF:', result, flags=re.M))
          old_urls = sorted(re.findall(r'^https?://\S+', text, flags=re.M))
          new_urls = sorted(re.findall(r'^https?://\S+', result, flags=re.M))
          if old_ext != new_ext:
              raise SystemExit(f'ABORT: EXTINF count changed {old_ext} -> {new_ext}')
          if old_urls != new_urls:
              raise SystemExit('ABORT: stream URL set changed')

          path.write_text(result, encoding='utf-8')
          print('TOTAL entries:', before)
          for k in cats:
              print(k, len(cats[k]))
          print('Safety checks passed.')

      - name: Commit reordered freewifi
        shell: bash
        run: |
          if git diff --quiet -- freewifi; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          git commit -m "Organize FreeWiFi channels by station and category"
          git push

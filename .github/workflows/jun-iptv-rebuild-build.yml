name: Build Jun IPTV Rebuild APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: jun-iptv-rebuild

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build baseline debug APK
        working-directory: jun-iptv-rebuild
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload baseline APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JunIPTV-rebuild-alpha1
          path: jun-iptv-rebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

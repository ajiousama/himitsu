name: Build Jun IPTV Rebuild APK

on:
  workflow_dispatch:
  push:
    branches:
      - jun-iptv-rebuild
    paths:
      - '.jun-rebuild-build'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: jun-iptv-rebuild

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build baseline debug APK
        working-directory: jun-iptv-rebuild
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload baseline APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JunIPTV-rebuild-alpha1
          path: jun-iptv-rebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK as j.apk on main
        shell: bash
        run: |
          cp jun-iptv-rebuild/app/build/outputs/apk/debug/app-debug.apk /tmp/j.apk
          git fetch origin main
          git checkout main
          cp /tmp/j.apk j.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add j.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Jun IPTV rebuild alpha1 [skip ci]"
            git push origin HEAD:main
          fi

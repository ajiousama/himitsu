name: Build Jun IPTV TS401 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: jun-iptv
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload TS-401 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JunIPTV-TS401-debug-apk
          path: jun-iptv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK to build branch
        shell: bash
        run: |
          mkdir -p jun-iptv/releases
          cp jun-iptv/app/build/outputs/apk/debug/app-debug.apk jun-iptv/releases/JunIPTV_TS401_latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jun-iptv/releases/JunIPTV_TS401_latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Jun IPTV TS401 APK [skip ci]"
            git push origin HEAD:jun-iptv-build
          fi

name: Build Jun IPTV TS401 APK

on:
  workflow_dispatch:
  push:
    branches:
      - jun-iptv-build
    paths:
      - 'jun-iptv/**'
      - '.github/workflows/jun-iptv-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: jun-iptv
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload TS-401 APK
        uses: actions/upload-artifact@v4
        with:
          name: JunIPTV-TS401-debug-apk
          path: jun-iptv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

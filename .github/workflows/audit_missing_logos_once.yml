name: Audit missing logos once

on:
  push:
    paths:
      - '.github/workflows/audit_missing_logos_once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find channels without tvg-logo
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8').splitlines()
          missing = []
          empty = []
          total = 0
          for idx, line in enumerate(lines, start=1):
              if not line.lstrip().startswith('#EXTINF'):
                  continue
              total += 1
              name = line.rsplit(',', 1)[-1].strip() if ',' in line else '(name unknown)'
              gm = re.search(r'group-title="([^"]*)"', line)
              group = gm.group(1) if gm else ''
              lm = re.search(r'tvg-logo="([^"]*)"', line)
              if lm is None:
                  missing.append((idx, group, name))
              elif not lm.group(1).strip():
                  empty.append((idx, group, name))

          print(f'TOTAL_EXTINF={total}')
          print(f'MISSING_TVG_LOGO={len(missing)}')
          print(f'EMPTY_TVG_LOGO={len(empty)}')
          for idx, group, name in missing:
              print(f'MISSING|{idx}|{group}|{name}')
          for idx, group, name in empty:
              print(f'EMPTY|{idx}|{group}|{name}')

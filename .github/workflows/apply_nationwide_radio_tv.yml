name: Apply Nationwide RADIO TS
# canonical-radio-system-v3-ehime-community

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_nationwide.py'
      - 'radio_tv_community.py'
      - 'radio_tv_filemux.py'
      - 'test_radio_continuity.py'
      - 'radiko_cloud_start.py'
      - 'radiko_freewifi.py'
      - 'radio_tv_nationwide_freewifi.py'
      - 'radio/update_nhk.py'
      - 'radio/build_playlist.py'
      - 'radio/README.md'
      - 'logos/tools/logo_contrast_apply.py'
      - 'logos/contrast_sources.json'
      - '.github/workflows/apply_nationwide_radio_tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install image support
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify radio audio and video continuity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m unittest -v test_radio_continuity

      - name: Restore compact FreeWiFi image and audio radio section
        run: python radio_tv_nationwide_freewifi.py

      - name: Build contrast-safe station images
        run: python logos/tools/logo_contrast_apply.py

      - name: Build nationwide and NHK static-video radio playlists
        run: |
          python radiko_freewifi.py --playlist-only
          python radio/update_nhk.py
          python radio/build_playlist.py

      - name: Validate IPTV-compatible static-image radio routing
        shell: bash
        run: |
          set -euo pipefail
          direct='https://himitsu-six.vercel.app/api/radiko?station='
          vercel='https://himitsu-six.vercel.app/api/radio-tv?station='
          render='https://ajiousama-radiko.onrender.com/radio-tv/'
          base='https://raw.githubusercontent.com/ajiousama/himitsu/radio-ts-assets/'

          radio_start="$(grep -n '^## ラジオ$' freewifi | head -1 | cut -d: -f1)"
          catv_start="$(grep -n '^## 愛媛CATV$' freewifi | head -1 | cut -d: -f1)"
          test -n "$radio_start"
          test -n "$catv_start"
          test "$catv_start" -gt "$radio_start"
          sed -n "${radio_start},$((catv_start - 1))p" freewifi > /tmp/freewifi-radio.txt

          free_direct_count="$(grep -Fc "$direct" /tmp/freewifi-radio.txt || true)"
          free_vercel_count="$(grep -Fc "$vercel" /tmp/freewifi-radio.txt || true)"
          free_render_count="$(grep -Fc "$render" /tmp/freewifi-radio.txt || true)"
          free_ts_count="$(grep -Fc "$base" /tmp/freewifi-radio.txt || true)"
          nationwide_render_count="$(grep -Fc "$render" radio/nationwide.m3u || true)"
          nhk_render_count="$(grep -Fc "$render" radio/nhk.m3u || true)"
          combined_render_count="$(grep -Fc "$render" radio/playlist.m3u || true)"

          echo "FreeWiFi Vercel Radiko image+audio count=$free_vercel_count"
          echo "FreeWiFi Render community image+audio count=$free_render_count"
          echo "Nationwide Render static-video count=$nationwide_render_count"
          echo "NHK Render static-video count=$nhk_render_count"
          echo "Combined Render static-video count=$combined_render_count"

          test "$free_direct_count" -eq 0
          test "$free_vercel_count" -eq 16
          test "$free_render_count" -eq 12
          test "$free_ts_count" -eq 0
          test "$nationwide_render_count" -ge 100
          test "$nhk_render_count" -eq 16
          test "$combined_render_count" -ge 116

          test "$(grep -c '^#EXTINF:' /tmp/freewifi-radio.txt)" -eq 28
          test "$(grep -c 'group-title="ラジオ"' /tmp/freewifi-radio.txt)" -eq 28
          test "$(grep -c '^#EXTINF:' radio/nationwide.m3u)" -ge 100
          test "$(grep -c '^#EXTINF:' radio/nhk.m3u)" -eq 16
          test "$(grep -c '^#EXTINF:' radio/playlist.m3u)" -ge 116

          test "$(grep -c '/logos/contrast/radiko\.' /tmp/freewifi-radio.txt || true)" -eq 22
          ! grep -Fq "$base" radio/nationwide.m3u
          ! grep -Fq "$base" radio/nhk.m3u
          ! grep -Fq "$base" radio/playlist.m3u
          ! grep -Eq 'NHKラジオ|NHK-FM|nhk_(r1|fm)_' radio/nationwide.m3u

          grep -Fq "${render}nhk_r1_matsuyama" radio/nhk.m3u
          grep -Fq "${render}nhk_fm_matsuyama" radio/nhk.m3u
          grep -Fq "${vercel}JOEU-FM" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}RNB" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}LFR" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}QRR" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}TBS" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}FMT" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}OBC" /tmp/freewifi-radio.txt
          grep -Fq "${vercel}KBS" /tmp/freewifi-radio.txt
          grep -Fq "${render}FMOTOKUNI" /tmp/freewifi-radio.txt
          grep -Fq "${render}FM845" /tmp/freewifi-radio.txt
          grep -Fq "${render}HBC" /tmp/freewifi-radio.txt
          grep -Fq "${render}TBC" /tmp/freewifi-radio.txt
          grep -Fq "${render}CBC" /tmp/freewifi-radio.txt
          grep -Fq "${render}RCC" /tmp/freewifi-radio.txt
          grep -Fq "${render}RKB" /tmp/freewifi-radio.txt
          grep -Fq "${render}KBC" /tmp/freewifi-radio.txt
          grep -Fq "${render}nhk_r1_matsuyama" /tmp/freewifi-radio.txt
          grep -Fq "${render}BARIBARI" /tmp/freewifi-radio.txt
          grep -Fq "${render}NIIHAMA" /tmp/freewifi-radio.txt
          grep -Fq "${render}FMGAIYA" /tmp/freewifi-radio.txt

          ! grep -Eq '^## (愛媛|在阪|京都|滋賀|兵庫)（ラジオ）$' /tmp/freewifi-radio.txt

          test -f logos/contrast/radiko.LFR_*.png
          test -f logos/contrast/radiko.QRR_*.png
          test -f logos/contrast/radiko.TBS_*.png
          test -f logos/contrast/radiko.FMT_*.png

      - name: Commit separated radio playlists and station images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp radio/playlist.m3u radio.m3u
          git add freewifi radio/nationwide.m3u radio/nhk.m3u radio/nhk_stations.json radio/playlist.m3u radio/freewifi.m3u radio.m3u logos/contrast_sources.json logos/contrast
          if git diff --cached --quiet; then
            echo 'Radio playlists and station images already current'
            exit 0
          fi
          git commit -m 'Serve radio catalogs with static-image video [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply Nationwide RADIO TV

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_nationwide.py'
      - 'radiko_cloud_start.py'
      - 'radiko_freewifi.py'
      - 'radio_tv_nationwide_freewifi.py'
      - '.github/workflows/apply_nationwide_radio_tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Smoke test Vercel radio TV path
        shell: bash
        run: |
          set -euo pipefail
          base='https://himitsu-six.vercel.app/api/radio-tv'
          for sid in RNB OBC KBS; do
            echo "===== $sid master ====="
            master="$(curl -fsS --max-time 30 "$base?station=$sid")"
            printf '%s\n' "$master"
            printf '%s\n' "$master" | grep -q '^#EXTM3U'
            printf '%s\n' "$master" | grep -q 'stage=audio'
            printf '%s\n' "$master" | grep -q 'stage=video'

            echo "===== $sid audio ====="
            audio="$(curl -fsS --max-time 30 "$base?station=$sid&stage=audio")"
            printf '%s\n' "$audio" | head -20
            printf '%s\n' "$audio" | grep -q '^#EXTM3U'
            printf '%s\n' "$audio" | grep -q '/api/radiko?station='
          done

          for sid in nhk_r1_osaka nhk_r1_matsuyama; do
            curl -fsS --max-time 30 "$base?station=$sid" | grep -q '^#EXTM3U'
          done

      - name: Restore compact FreeWiFi radio section
        run: python radio_tv_nationwide_freewifi.py

      - name: Build standalone nationwide radio.m3u
        run: python radiko_freewifi.py --playlist-only

      - name: Validate separated radio layouts
        shell: bash
        run: |
          set -euo pipefail

          radio_start="$(grep -n '^## ラジオ$' freewifi | head -1 | cut -d: -f1)"
          catv_start="$(grep -n '^## 愛媛CATV$' freewifi | head -1 | cut -d: -f1)"
          test -n "$radio_start"
          test -n "$catv_start"
          test "$catv_start" -gt "$radio_start"
          sed -n "${radio_start},$((catv_start - 1))p" freewifi > /tmp/freewifi-radio.txt

          free_count="$(grep -Fc 'https://himitsu-six.vercel.app/api/radio-tv?station=' /tmp/freewifi-radio.txt || true)"
          nationwide_count="$(grep -c '^https://ajiousama-radiko.onrender.com/radio-tv/' radio.m3u || true)"
          echo "FreeWiFi compact Vercel image+audio radio count=$free_count"
          echo "Standalone nationwide image+audio radio count=$nationwide_count"

          test "$free_count" -ge 12
          test "$free_count" -le 20
          test "$nationwide_count" -ge 100

          ! grep -q '^### 北海道$' /tmp/freewifi-radio.txt
          ! grep -q 'ajiousama-radiko.onrender.com/radio-tv/' /tmp/freewifi-radio.txt
          grep -Fq 'https://himitsu-six.vercel.app/api/radio-tv?station=RNB' /tmp/freewifi-radio.txt
          grep -Fq 'https://himitsu-six.vercel.app/api/radio-tv?station=OBC' /tmp/freewifi-radio.txt
          grep -Fq 'https://himitsu-six.vercel.app/api/radio-tv?station=KBS' /tmp/freewifi-radio.txt
          grep -Fq 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_r1_matsuyama' /tmp/freewifi-radio.txt
          grep -q '^https://simul2.drdi.st.nhk/live/17/joined/master.m3u8$' /tmp/freewifi-radio.txt
          grep -q '^## Rakuten-JP$' freewifi

      - name: Commit separated radio playlists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi radio.m3u
          if git diff --cached --quiet; then
            echo 'Radio playlists already current'
            exit 0
          fi
          git commit -m 'Route FreeWiFi radio directly through Vercel'
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply Nationwide RADIO TS

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_nationwide.py'
      - 'radiko_cloud_start.py'
      - 'radiko_freewifi.py'
      - 'radio_tv_nationwide_freewifi.py'
      - '.github/workflows/apply_nationwide_radio_tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Restore compact FreeWiFi radio section
        run: python radio_tv_nationwide_freewifi.py

      - name: Build standalone nationwide radio.m3u
        run: python radiko_freewifi.py --playlist-only

      - name: Validate stable TS radio routing
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/ajiousama/himitsu/radio-ts-assets/'

          radio_start="$(grep -n '^## ラジオ$' freewifi | head -1 | cut -d: -f1)"
          catv_start="$(grep -n '^## 愛媛CATV$' freewifi | head -1 | cut -d: -f1)"
          test -n "$radio_start"
          test -n "$catv_start"
          test "$catv_start" -gt "$radio_start"
          sed -n "${radio_start},$((catv_start - 1))p" freewifi > /tmp/freewifi-radio.txt

          free_count="$(grep -Fc "$base" /tmp/freewifi-radio.txt || true)"
          nationwide_count="$(grep -Fc "$base" radio.m3u || true)"
          echo "FreeWiFi stable TS radio count=$free_count"
          echo "Standalone nationwide stable TS count=$nationwide_count"

          test "$free_count" -eq 12
          test "$nationwide_count" -ge 100
          test "$(grep -c '^#EXTINF:' /tmp/freewifi-radio.txt)" -eq 12
          test "$(grep -c 'group-title="ラジオ"' /tmp/freewifi-radio.txt)" -eq 12
          ! grep -q 'ajiousama-radiko.onrender.com/radio-tv/' radio.m3u
          ! grep -q 'ajiousama-radiko.onrender.com/radio-tv/' /tmp/freewifi-radio.txt
          ! grep -q 'himitsu-six.vercel.app/api/radio-tv' /tmp/freewifi-radio.txt
          ! grep -Eq 'NHKラジオ|NHK-FM|nhk_(r1|fm)_' /tmp/freewifi-radio.txt
          ! grep -Eq '^## (愛媛|在阪|京都|滋賀|兵庫)（ラジオ）$' /tmp/freewifi-radio.txt
          grep -Fq "${base}RNB/master.m3u8" /tmp/freewifi-radio.txt
          grep -Fq "${base}OBC/master.m3u8" /tmp/freewifi-radio.txt
          grep -Fq "${base}KBS/master.m3u8" /tmp/freewifi-radio.txt
          grep -q '^## Rakuten-JP$' freewifi

      - name: Commit separated radio playlists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi radio.m3u
          if git diff --cached --quiet; then
            echo 'Radio playlists already current'
            exit 0
          fi
          git commit -m 'Keep all radio playlists on stable TS visuals'
          git pull --rebase origin main
          git push origin HEAD:main

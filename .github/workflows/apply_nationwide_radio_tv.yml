name: Apply Nationwide RADIO TV

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_nationwide.py'
      - 'radiko_cloud_start.py'
      - 'radiko_freewifi.py'
      - 'radio_tv_nationwide_freewifi.py'
      - '.github/workflows/apply_nationwide_radio_tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Wait for nationwide Render build
        shell: bash
        run: |
          set -euo pipefail
          base='https://ajiousama-radiko.onrender.com'
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 75 "$base/health" 2>/dev/null || true)"
            echo "attempt=$i health=$body"
            if printf '%s' "$body" | grep -q 'build=20260901-radio-tv-nationwide-v1'; then
              exit 0
            fi
            sleep 20
          done
          echo '::error::Nationwide Render build did not become ready'
          exit 1

      - name: Check dynamic station art
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 75 -o /tmp/TBS.jpg 'https://ajiousama-radiko.onrender.com/radio-art/TBS.jpg'
          test "$(stat -c %s /tmp/TBS.jpg)" -gt 5000
          file /tmp/TBS.jpg

      - name: Smoke test nationwide image plus audio mux
        shell: bash
        run: |
          set -euo pipefail
          base='https://ajiousama-radiko.onrender.com/radio-debug'
          for sid in TBS HBC RBC JOZK; do
            echo "===== $sid ====="
            out="$(curl -fsS --max-time 90 "$base/$sid")"
            printf '%s\n' "$out"
            printf '%s\n' "$out" | grep -q '^ffmpeg_rc=0$'
            bytes="$(printf '%s\n' "$out" | sed -n 's/^output_bytes=//p' | tail -1)"
            test -n "$bytes"
            test "$bytes" -gt 10000
          done

      - name: Restore compact FreeWiFi radio section
        run: python radio_tv_nationwide_freewifi.py

      - name: Build standalone nationwide radio.m3u
        run: python radiko_freewifi.py --playlist-only

      - name: Validate separated radio layouts
        shell: bash
        run: |
          set -euo pipefail

          radio_start="$(grep -n '^## ラジオ$' freewifi | head -1 | cut -d: -f1)"
          catv_start="$(grep -n '^## 愛媛CATV$' freewifi | head -1 | cut -d: -f1)"
          test -n "$radio_start"
          test -n "$catv_start"
          test "$catv_start" -gt "$radio_start"
          sed -n "${radio_start},$((catv_start - 1))p" freewifi > /tmp/freewifi-radio.txt

          free_count="$(grep -c '^https://ajiousama-radiko.onrender.com/radio-tv/' /tmp/freewifi-radio.txt || true)"
          nationwide_count="$(grep -c '^https://ajiousama-radiko.onrender.com/radio-tv/' radio.m3u || true)"
          echo "FreeWiFi compact image+audio radio count=$free_count"
          echo "Standalone nationwide image+audio radio count=$nationwide_count"

          test "$free_count" -ge 12
          test "$free_count" -le 20
          test "$nationwide_count" -ge 100

          ! grep -q '^### 北海道$' /tmp/freewifi-radio.txt
          ! grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/TBS$' /tmp/freewifi-radio.txt
          grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/TBS$' radio.m3u
          grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/JOZK$' radio.m3u
          grep -q '^https://ajiousama-radiko.onrender.com/radio-tv/JOZK$' /tmp/freewifi-radio.txt
          grep -q '^https://simul2.drdi.st.nhk/live/17/joined/master.m3u8$' /tmp/freewifi-radio.txt
          grep -q '^https://simul2.drdi.st.nhk/live/17/joined/master.m3u8$' radio.m3u
          grep -q '^## Rakuten-JP$' freewifi

      - name: Commit separated radio playlists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi radio.m3u
          if git diff --cached --quiet; then
            echo 'Radio playlists already current'
            exit 0
          fi
          git commit -m 'Separate nationwide radio from FreeWiFi'
          git pull --rebase origin main
          git push origin HEAD:main

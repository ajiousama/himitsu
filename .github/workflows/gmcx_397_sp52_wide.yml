name: GCCX #400 BGM Wide Search After SP52

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gmcx_397_sp52_wide.yml"
      - "gmcx_397_sp52_wide_probe.py"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install FFmpeg and NumPy
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q numpy
      - name: Detect true #400 title by scanning extended SP52
        run: python -u gmcx_397_sp52_wide_probe.py
      - name: Preserve wide-range BGM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gccx-sp52-true-boundary-wide-review
          path: gmcx_397_sp52_wide_review/
          if-no-files-found: warn

name: Update GCH Free A-B

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'freewifi'
      - 'general_youtube.m3u'
      - 'today_jra_status.json'
      - 'jra_free_channels_update.py'
      - 'jra_freewifi_finalize.py'
      - '.github/workflows/update_jra_free_channels.yml'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install JRA/GCH clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          python -m pip install --upgrade curl_cffi

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Refresh GCH free A/B
        run: python jra_free_channels_update.py

      - name: Validate A/B separation
        shell: bash
        run: |
          test -s freewifi
          A=$(grep -c 'tvg-id="jra.official"' freewifi || true)
          B=$(grep -c 'tvg-id="jra.gch.free"' freewifi || true)
          echo "GCH free A count: $A"
          echo "GCH free B count: $B"
          test "$A" -le 1
          test "$B" -le 1
          test "$(grep -c 'GCH無料版A（YouTube）' freewifi || true)" -le 1
          test "$(grep -c 'GCH無料版B（グリーンチャンネルWeb）' freewifi || true)" -le 1

      - name: Commit GCH free A/B
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'No GCH free A/B changes'
            exit 0
          fi
          git commit -m 'Refresh GCH free A-B channels'
          git pull --rebase origin main
          git push origin main

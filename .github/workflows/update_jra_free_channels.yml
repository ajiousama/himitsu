name: Update GCH Free A-B

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'freewifi'
      - 'general_youtube.m3u'
      - 'today_jra_status.json'
      - 'jra_free_channels_update.py'
      - 'jra_freewifi_finalize.py'
      - 'vercel-radiko/api/gch-free.mjs'
      - 'vercel-radiko/vercel.json'
      - '.github/workflows/update_jra_free_channels.yml'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install JRA/GCH clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          python -m pip install --upgrade curl_cffi

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Refresh GCH free A/B
        run: python jra_free_channels_update.py

      - name: Validate A/B state
        shell: bash
        run: |
          test -s freewifi
          A=$(grep -c 'tvg-id="jra.official"' freewifi || true)
          B=$(grep -c 'tvg-id="jra.gch.free"' freewifi || true)
          ACTIVE=$(python - <<'PY'
          import json
          try:
              d=json.load(open('today_jra_status.json',encoding='utf-8-sig'))
              print(1 if int(d.get('active_count',0)) > 0 else 0)
          except Exception:
              print(0)
          PY
          )
          echo "JRA active: $ACTIVE / GCH free A: $A / B: $B"
          if [ "$ACTIVE" = "1" ]; then
            test "$A" -eq 1
            test "$B" -eq 1
            grep -q 'GCH無料版A（YouTube）' freewifi
            grep -q 'GCH無料版B（グリーンチャンネルWeb）' freewifi
            grep -q '^https://himitsu-six.vercel.app/api/gch-free$' freewifi
          else
            test "$A" -eq 0
            test "$B" -eq 0
          fi

      - name: Commit GCH free A/B
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'No GCH free A/B changes'
            exit 0
          fi
          git commit -m 'Refresh GCH free A-B channels'
          git pull --rebase origin main
          git push origin main

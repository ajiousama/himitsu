name: Update GCH Free A-B

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'freewifi'
      - 'general_youtube.m3u'
      - 'today_jra_status.json'
      - 'jra_free_channels_update.py'
      - 'jra_freewifi_finalize.py'
      - 'vercel-radiko/api/gch-free.mjs'
      - 'vercel-radiko/vercel.json'
      - '.github/workflows/update_jra_free_channels.yml'
  schedule:
    # 09:00 JST every day. jra_free_channels_update.py only publishes A/B on JRA active days.
    # This covers normal Sat/Sun meetings and exceptional weekday/holiday meetings.
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install JRA/GCH clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          python -m pip install --upgrade curl_cffi

      - name: Refresh, validate and commit GCH free A/B safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          validate_gch() {
            test -s freewifi
            A=$(grep -c 'tvg-id="jra.official"' freewifi || true)
            B=$(grep -c 'tvg-id="jra.gch.free"' freewifi || true)
            ACTIVE=$(python - <<'PY'
          import json
          try:
              d=json.load(open('today_jra_status.json',encoding='utf-8-sig'))
              print(1 if int(d.get('active_count',0)) > 0 else 0)
          except Exception:
              print(0)
          PY
            )
            echo "JRA active: $ACTIVE / GCH free A: $A / B: $B"
            if [ "$ACTIVE" = "1" ]; then
              test "$A" -eq 1
              test "$B" -eq 1
              grep -q 'GCH無料版A（YouTube）' freewifi
              grep -q 'GCH無料版B（グリーンチャンネルWeb）' freewifi
              grep -Eq '^https://manifest\.streaks\.jp/.+\.m3u8\?token=' freewifi
            else
              test "$A" -eq 0
              test "$B" -eq 0
            fi
          }

          for attempt in 1 2 3; do
            echo "GCH A/B publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            if ! python jra_free_channels_update.py; then
              echo "::warning::GCH A/B generation failed on attempt $attempt"
              if [ "$attempt" -lt 3 ]; then sleep 2; continue; fi
              exit 1
            fi

            if ! validate_gch; then
              echo "::warning::GCH A/B validation failed on attempt $attempt"
              if [ "$attempt" -lt 3 ]; then sleep 2; continue; fi
              exit 1
            fi

            git add freewifi
            if git diff --cached --quiet; then
              echo 'GCH A/B already current'
              exit 0
            fi

            git commit -m 'Refresh GCH free A-B channels'
            if git push origin HEAD:main; then
              echo 'GCH A/B published successfully'
              exit 0
            fi

            echo "::warning::main moved during GCH A/B publish; rebuilding from latest main"
            sleep 2
          done

          echo '::error::Failed to publish GCH A/B after 3 attempts'
          exit 1

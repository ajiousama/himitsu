name: GCCX Nine Candidate Video Frame Review

on:
  push:
    branches: [main]
    paths:
      - "gmcx_logo_candidate_frames.py"
      - ".github/workflows/gmcx_logo_candidate_frames.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmcx-nine-candidate-frame-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ensure video decoder
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Extract nine small contact sheets near the uncertain logos
        run: python -u gmcx_logo_candidate_frames.py
      - name: Keep contact sheets only for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmcx-nine-logo-candidate-frames
          path: gmcx_logo_candidate_frames/*
          if-no-files-found: warn

name: GCCX SP End Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_sp_end_probe.py"
      - ".github/workflows/gmcx_sp_end_probe.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Review end of three-hour special
        run: python -u gmcx_sp_end_probe.py
      - name: Store read-only visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmcx-special-end-candidate-video-sheets
          path: gmcx_sp_end_review/*
          if-no-files-found: warn

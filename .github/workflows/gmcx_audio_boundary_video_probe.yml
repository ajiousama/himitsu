name: GCCX Audio Boundary Visual Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_audio_boundary_video_probe.py"
      - ".github/workflows/gmcx_audio_boundary_video_probe.yml"

permissions:
  contents: read

concurrency:
  group: gmcx-audio-boundary-visual-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        target: [ep50_no_ode, ep55_ten_second_shift]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Inspect one-second frames around audio boundary discrepancies
        run: python -u gmcx_audio_boundary_video_probe.py --target ${{ matrix.target }}
      - name: Keep actual-video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmcx-audio-cut-${{ matrix.target }}
          path: gmcx_audio_boundary_video_frames/${{ matrix.target }}/*
          if-no-files-found: warn

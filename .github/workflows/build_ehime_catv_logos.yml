name: Build Ehime CATV Logos

on:
  push:
    branches: [main]
    paths:
      - 'generate_ehime_catv_logos.py'
      - '.github/workflows/build_ehime_catv_logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate logos and update M3U
        run: python generate_ehime_catv_logos.py

      - name: Commit generated logos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logos/ehime_catv freewifi
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update Ehime CATV logos'
          git pull --rebase origin main
          git push origin HEAD:main

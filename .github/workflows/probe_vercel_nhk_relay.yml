name: Probe existing Vercel relay for NHK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_vercel_nhk_relay.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe himitsu-six generic u relay with NHK HLS
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import urllib.parse
          import urllib.request

          base = 'https://himitsu-six.vercel.app/api/radiko'
          upstreams = [
              ('nhk_r1_osaka', 'https://simul2.drdi.st.nhk/live/12/joined/master.m3u8'),
              ('nhk_fm_osaka', 'https://simul2.drdi.st.nhk/live/13/joined/master.m3u8'),
              ('nhk_r1_matsuyama', 'https://simul2.drdi.st.nhk/live/16/joined/master.m3u8'),
              ('nhk_fm_matsuyama', 'https://simul2.drdi.st.nhk/live/17/joined/master.m3u8'),
          ]
          for name, upstream in upstreams:
              q = urllib.parse.urlencode({'station':'ABC','u':upstream})
              url = base + '?' + q
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              print('===', name, '===')
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      data = r.read(2000)
                      print('status=', getattr(r, 'status', 200))
                      print('content_type=', r.headers.get('Content-Type'))
                      print('bytes=', len(data))
                      print('sample=', data.decode('utf-8','replace').replace('\n',' | ')[:1200])
              except Exception as e:
                  print('error=', type(e).__name__, str(e))
          PY

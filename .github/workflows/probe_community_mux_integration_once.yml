name: Probe Community Radio Mux Integration Once

on:
  push:
    paths:
      - ".github/workflows/probe_community_mux_integration_once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Build and decode all three image plus audio muxes
        shell: python
        run: |
          import pathlib, subprocess, time
          import radio_tv_filemux as mux

          failed=[]
          for station in ("FMOTOKUNI", "FM845", "BARIBARI"):
              print(f"===== {station} =====", flush=True)
              sources=mux.impl._audio_sources(station)
              print("sources", ["jcba://..." if str(x).startswith("jcba://") else x for x in sources], flush=True)
              if not sources:
                  failed.append(station+":no source")
                  continue
              proc,path,detail=mux._start_file_mux(station,sources[0],15.0)
              if proc is None or path is None:
                  print("START_FAIL", detail, flush=True)
                  failed.append(station+":mux start")
                  continue
              try:
                  time.sleep(10)
                  size=path.stat().st_size if path.exists() else 0
                  print("TS_BYTES",size,flush=True)
                  if size < 100000:
                      failed.append(station+":small ts")
                      continue
                  cmd=[
                      mux.impl.base.ffmpeg_exe(),"-hide_banner","-loglevel","info",
                      "-i",str(path),"-map","0:a:0","-t","8","-af","volumedetect",
                      "-f","null","-"
                  ]
                  result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=30)
                  text=result.stdout.decode("utf-8","replace")
                  print(text[-9000:],flush=True)
                  if result.returncode != 0:
                      failed.append(station+":decode")
                  if "Video: h264" not in text:
                      failed.append(station+":no h264")
                  if "Audio: aac" not in text:
                      failed.append(station+":no aac")
                  if "mean_volume:" not in text or "max_volume:" not in text:
                      failed.append(station+":no audio level")
              finally:
                  mux._stop_mux(proc)
                  try: path.unlink(missing_ok=True)
                  except Exception: pass

          if failed:
              raise SystemExit("FAILED: "+", ".join(failed))
          print("ALL_3_FULL_MUX_PASS",flush=True)

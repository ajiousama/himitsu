name: TVer public schedule probe (one-shot)
on:
  push:
    branches: ['test/tver-official-epg-20261128']
    paths: ['.github/workflows/tver_schedule_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Capture only public schedule metadata
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
          mkdir -p diagnostics
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          hosts={'tver.jp','contents-api.tver.jp','platform-api.tver.jp','statics.tver.jp','service-api.tver.jp'}
          keywords=re.compile(r'(schedule|simul|realtime|timetable|program|episode|live|page|callhome)',re.I)
          fields=re.compile(r'^(id|title|name|network|station|channel|broadcaster|seriesTitle|episodeTitle|start|end|stop|.*(?:start|end|stop|broadcast|delivery|publish|schedule)(?:At|Time|Date|DateTime|_at|_time|_date|_date_time|_timestamp)?|(?:network|channel|station|broadcaster|series|episode)(?:Id|Name|Title|_id|_name|_title))$',re.I)
          report={'checked_at':datetime.now(timezone.utc).isoformat(),'pages':[],'responses':[],'errors':[]}
          def safe_rows(obj,path='$',depth=0):
              if depth>16: return []
              out=[]
              if isinstance(obj,dict):
                  row={k:v for k,v in obj.items() if fields.fullmatch(k) and isinstance(v,(str,int,float)) and not isinstance(v,bool) and not any(x in str(v).lower() for x in ('://','token','authorization','bearer','m3u8','mpd')) and len(str(v))<250}
                  if row: out.append({'path':path,'fields':row})
                  for k,v in obj.items():
                      if isinstance(v,(list,dict)) and re.fullmatch(r'[a-zA-Z0-9_-]{1,64}',k):
                          out.extend(safe_rows(v,path+'.'+k,depth+1))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj[:150]): out.extend(safe_rows(v,f'{path}[{i}]',depth+1))
              return out[:800]
          def response(r):
              u=urlsplit(r.url)
              if u.hostname not in hosts or r.request.method!='GET' or not keywords.search(u.path): return
              if 'json' not in r.headers.get('content-type','').lower(): return
              if re.search(r'(token|auth|login|account|personal|profile|playback|manifest)',u.path,re.I): return
              try:
                  rows=safe_rows(r.json())
                  report['responses'].append({'host':u.hostname,'path':u.path,'status':r.status,'rows':rows})
              except Exception as e: report['errors'].append(type(e).__name__)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(locale='ja-JP',timezone_id='Asia/Tokyo')
              def route(r):
                  if r.request.resource_type=='media' or re.search(r'\.(m3u8|mpd|m4s|ts)(?:\?|$)',r.request.url,re.I): r.abort()
                  else: r.continue_()
              page.route('**/*',route)
              page.on('response',response)
              for suffix in ('','/ntv','/ex','/tbs','/tx','/cx'):
                  try:
                      r=page.goto('https://tver.jp/live'+suffix,wait_until='domcontentloaded',timeout=25000)
                      page.wait_for_timeout(4000)
                      body=page.locator('body').inner_text(timeout=8000)
                      report['pages'].append({'page':suffix,'status':r.status if r else None,'text':body[:15000]})
                  except Exception as e: report['errors'].append({'page':suffix,'type':type(e).__name__})
              browser.close()
          Path('diagnostics/tver_schedule_probe_20261128.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('pages',len(report['pages']),'responses',len(report['responses']))
          PY
      - name: Save probe on test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/tver_schedule_probe_20261128.json
          git commit -m "Record public TVer schedule metadata probe [skip ci]"
          git push origin HEAD:test/tver-official-epg-20261128

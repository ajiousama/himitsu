name: Pause NAORI in FreeWiFi once

on:
  push:
    paths:
      - .github/workflows/pause_naori_freewifi_once.yml

permissions:
  contents: write

jobs:
  pause-naori:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove every NAORI entry from FreeWiFi
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          i = 0
          removed = 0
          in_managed = False

          while i < len(lines):
              line = lines[i]
              low = line.lower()

              if line.strip() == '# === NAORI_MANAGED_START ===':
                  in_managed = True
                  removed += 1
                  i += 1
                  continue

              if in_managed:
                  removed += 1
                  if line.strip() == '# === NAORI_MANAGED_END ===':
                      in_managed = False
                  i += 1
                  continue

              if line.startswith('#EXTINF') and 'naori' in low:
                  removed += 1
                  i += 1
                  while i < len(lines) and not lines[i].strip():
                      removed += 1
                      i += 1
                  if i < len(lines):
                      removed += 1
                      i += 1
                  continue

              if 'naori-test.netgenx.site' in low:
                  removed += 1
                  i += 1
                  continue

              out.append(line)
              i += 1

          text = '\n'.join(out).rstrip() + '\n'
          p.write_text(text, encoding='utf-8')
          print(f'Removed {removed} NAORI-related lines')
          if 'naori' in text.lower() or 'netgenx.site' in text.lower():
              raise SystemExit('NAORI reference still remains in freewifi')
          PY

      - name: Show any remaining NAORI source references
        shell: bash
        run: |
          grep -Rni --exclude='freewifi' --exclude='pause_naori_freewifi_once.yml' --exclude-dir='.git' 'naori\|netgenx.site' . || true

      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/pause_naori_freewifi_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A freewifi .github/workflows/pause_naori_freewifi_once.yml
          if git diff --cached --quiet; then
            echo 'No NAORI changes required'
            exit 0
          fi
          git commit -m 'Pause NAORI in FreeWiFi'
          git pull --rebase origin main
          git push origin HEAD:main

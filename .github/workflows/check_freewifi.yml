name: Check Free WiFi streams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check_freewifi.yml"
      - "check_freewifi.py"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Check all Free WiFi streams
        run: python check_freewifi.py

      - name: Commit refreshed markers and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi freewifi_check_result.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh Free WiFi stream markers"
            git push
          fi

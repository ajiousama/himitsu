name: Check Free WiFi streams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check_freewifi.yml"
      - "check_freewifi.py"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Check all Free WiFi streams
        run: python check_freewifi.py

      - name: Commit refreshed markers and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "FreeWiFi check publish attempt $attempt/3"
            git add freewifi freewifi_check_result.json
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m "Refresh Free WiFi stream markers"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::main moved during check; rerunning against newest FreeWiFi"
            git fetch origin main
            git reset --hard origin/main
            python check_freewifi.py
          done

          echo "::error::FreeWiFi checker could not publish after 3 attempts"
          exit 1

          new_urls = sorted(re.findall(r'^https?://\S+', result, flags=re.M))
          old_ext = len(re.findall(r'^#EXTINF:', text, flags=re.M))
          new_ext = len(re.findall(r'^#EXTINF:', result, flags=re.M))
          if old_urls != new_urls or old_ext != new_ext:
              raise SystemExit('ABORT: safety check failed')


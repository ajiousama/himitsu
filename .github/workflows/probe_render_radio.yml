name: Probe Render Radio

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_nationwide.py'
      - 'radio_tv_filemux.py'
      - 'radiko_cloud_start.py'
      - '.github/workflows/probe_render_radio.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render radio build
        shell: bash
        run: |
          set -euo pipefail
          base='https://ajiousama-radiko.onrender.com'
          for attempt in $(seq 1 30); do
            health="$(curl -fsS --max-time 15 "$base/health" || true)"
            echo "attempt=$attempt $health"
            if grep -Fq '20260903-radio-tv-preencoded-v15' <<<"$health"; then exit 0; fi
            sleep 10
          done
          echo 'v15 did not become ready' >&2
          exit 1

      - name: Install ffprobe
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Probe all 12 FreeWiFi radios with image and audio
        shell: bash
        run: |
          set -u
          root='https://ajiousama-radiko.onrender.com'
          stations=(JOEU-FM RNB ABC CCL 802 FMO MBS OBC KBS ALPHA-STATION E-RADIO CRK)
          : > /tmp/all-radio-probe.txt
          failed=0

          for sid in "${stations[@]}"; do
            echo "===== $sid =====" | tee -a /tmp/all-radio-probe.txt
            curl -fsSI --max-time 10 "$root/radio-tv/$sid" >/tmp/head.txt 2>&1 || true
            cat /tmp/head.txt >> /tmp/all-radio-probe.txt
            rm -f "/tmp/${sid}.ts" /tmp/ffprobe.txt /tmp/curl.err

            start=$(date +%s)
            curl --max-time 15 "$root/radio-tv/$sid" -o "/tmp/${sid}.ts" 2>/tmp/curl.err
            rc=$?
            end=$(date +%s)
            bytes=$(wc -c < "/tmp/${sid}.ts" 2>/dev/null || echo 0)
            echo "curl_rc=$rc elapsed=$((end-start))s bytes=$bytes" | tee -a /tmp/all-radio-probe.txt
            sed -n '1,60p' /tmp/curl.err >> /tmp/all-radio-probe.txt

            ffprobe -v error \
              -show_entries stream=codec_name,codec_type,width,height,sample_rate,channels \
              -show_entries format=duration,size,bit_rate \
              "/tmp/${sid}.ts" > /tmp/ffprobe.txt 2>&1
            probe_rc=$?
            cat /tmp/ffprobe.txt | tee -a /tmp/all-radio-probe.txt

            if [ "$probe_rc" -eq 0 ] \
              && grep -q 'codec_name=h264' /tmp/ffprobe.txt \
              && grep -q 'codec_type=video' /tmp/ffprobe.txt \
              && grep -q 'width=640' /tmp/ffprobe.txt \
              && grep -q 'height=360' /tmp/ffprobe.txt \
              && grep -q 'codec_name=aac' /tmp/ffprobe.txt \
              && grep -q 'codec_type=audio' /tmp/ffprobe.txt \
              && [ "$bytes" -ge 10000 ]; then
              echo "PASS $sid image+audio" | tee -a /tmp/all-radio-probe.txt
            else
              echo "FAIL $sid" | tee -a /tmp/all-radio-probe.txt
              echo "--- internal debug ---" | tee -a /tmp/all-radio-probe.txt
              curl -fsS --max-time 30 "$root/radio-file-debug/$sid" 2>&1 | tee -a /tmp/all-radio-probe.txt || true
              failed=1
            fi
            echo | tee -a /tmp/all-radio-probe.txt
          done

          echo '===== SUMMARY =====' | tee -a /tmp/all-radio-probe.txt
          grep -E '^(PASS|FAIL) ' /tmp/all-radio-probe.txt | tee -a /tmp/summary.txt
          test "$failed" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-radio-all-12-probe
          path: |
            /tmp/all-radio-probe.txt
            /tmp/summary.txt
          if-no-files-found: warn
          retention-days: 1

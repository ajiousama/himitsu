name: Probe Render Radio

on:
  push:
    branches: [main]
    paths:
      - 'radio_tv_nationwide.py'
      - 'radio_tv_filemux.py'
      - 'radiko_cloud_start.py'
      - '.github/workflows/probe_render_radio.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render radio build
        shell: bash
        run: |
          set -euo pipefail
          base='https://ajiousama-radiko.onrender.com'
          for attempt in $(seq 1 30); do
            health="$(curl -fsS --max-time 15 "$base/health" || true)"
            echo "attempt=$attempt $health"
            if grep -Fq '20260903-radio-tv-filemux-v13' <<<"$health"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Diagnose completed-segment FM Ehime mux
        shell: bash
        run: |
          set -euo pipefail
          root='https://ajiousama-radiko.onrender.com'
          curl -fsS --max-time 30 "$root/radio-file-debug/JOEU-FM" | tee /tmp/file-debug.txt
          grep -q '^live_start_index=-3$' /tmp/file-debug.txt
          grep -q '^avioflags=default$' /tmp/file-debug.txt
          grep -q '^started=True$' /tmp/file-debug.txt
          awk -F= '/^bytes=/{if ($2 >= 1316) ok=1} END{exit !ok}' /tmp/file-debug.txt

      - name: Cold-start probe FM Ehime MPEG-TS video and audio
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          set +e
          root='https://ajiousama-radiko.onrender.com'
          sid='JOEU-FM'
          probe_ok=0
          {
            time curl -fsSI --max-time 15 "$root/radio-tv/$sid"
            sleep 1
            start=$(date +%s)
            curl -v --max-time 20 "$root/radio-tv/$sid" -o /tmp/radio.ts 2>/tmp/curl.err
            rc=$?
            end=$(date +%s)
            echo "curl_rc=$rc elapsed=$((end-start))s"
            sed -n '1,120p' /tmp/curl.err
            ls -l /tmp/radio.ts || true
            timeout 20 ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,sample_rate,channels -show_entries format=duration,size,bit_rate /tmp/radio.ts > /tmp/ffprobe.txt 2>&1
            ffprobe_rc=$?
            cat /tmp/ffprobe.txt
            if [ "$ffprobe_rc" -eq 0 ] && grep -q 'codec_type=video' /tmp/ffprobe.txt && grep -q 'codec_type=audio' /tmp/ffprobe.txt; then
              probe_ok=1
            else
              curl -fsS --max-time 30 "$root/radio-file-debug/$sid" || true
            fi
          } > /tmp/probe.txt 2>&1
          cat /tmp/probe.txt
          test "$probe_ok" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: render-radio-probe
          path: |
            /tmp/file-debug.txt
            /tmp/probe.txt
            /tmp/radio.ts
          if-no-files-found: warn
          retention-days: 1

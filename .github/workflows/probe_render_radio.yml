name: Probe Render Radio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_render_radio.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RNB debug and stream
        shell: bash
        run: |
          set +e
          base='https://ajiousama-radiko.onrender.com'
          echo '=== debug ==='
          time curl -fsS --max-time 45 "$base/radio-debug/RNB" || true
          echo
          echo '=== headers and 20s capture ==='
          start=$(date +%s)
          curl -v --max-time 20 "$base/radio-tv/RNB" -o /tmp/rnb.ts 2>/tmp/curl.err
          rc=$?
          end=$(date +%s)
          echo "curl_rc=$rc elapsed=$((end-start))s"
          sed -n '1,120p' /tmp/curl.err
          ls -l /tmp/rnb.ts || true
          file /tmp/rnb.ts || true
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration,size,bit_rate -show_streams /tmp/rnb.ts || true
          fi

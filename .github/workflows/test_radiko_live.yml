name: Test radiko LIVE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - radiko_live_test.py
      - .github/workflows/test_radiko_live.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Connect to a VPN Gate Japan server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn

          python - <<'PY'
          import base64, csv, pathlib, urllib.request

          url = 'https://www.vpngate.net/api/iphone/'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')

          rows = []
          for line in text.splitlines():
              if not line or line.startswith('*') or line.startswith('#'):
                  continue
              try:
                  row = next(csv.reader([line]))
              except Exception:
                  continue
              if len(row) < 15 or not (row[5] == 'Japan' or row[6] == 'JP') or not row[14]:
                  continue
              try:
                  score = int(row[2] or 0)
                  speed = int(row[4] or 0)
              except ValueError:
                  score = speed = 0
              rows.append((score, speed, row[14]))

          if not rows:
              raise SystemExit('No VPN Gate Japan OpenVPN server found')

          rows.sort(reverse=True)
          out = pathlib.Path('/tmp/vpngate-jp')
          out.mkdir(exist_ok=True)

          # Keep several fallbacks. Each one is tried for 18 seconds by the shell below.
          for i, (_, _, encoded) in enumerate(rows[:10], 1):
              try:
                  raw = base64.b64decode(encoded).decode('utf-8', 'replace').replace('\r\n', '\n')
              except Exception:
                  continue
              raw += '\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 10\n'
              (out / f'{i:02d}.ovpn').write_text(raw)

          configs = sorted(out.glob('*.ovpn'))
          if not configs:
              raise SystemExit('No usable VPN Gate Japan OpenVPN config found')
          print(f'Prepared {len(configs)} VPN Gate Japan candidates')
          PY

          CONNECTED=0
          ATTEMPT=0
          for CFG in /tmp/vpngate-jp/*.ovpn; do
            ATTEMPT=$((ATTEMPT + 1))
            LOG="/tmp/openvpn-${ATTEMPT}.log"
            PID="/tmp/openvpn-${ATTEMPT}.pid"

            echo "Trying Japan VPN candidate #${ATTEMPT} (18s max)"
            sudo rm -f "$LOG" "$PID"
            sudo openvpn --config "$CFG" --daemon --writepid "$PID" --log "$LOG" || true

            for i in $(seq 1 18); do
              if sudo grep -q 'Initialization Sequence Completed' "$LOG" 2>/dev/null; then
                echo "VPN Gate connection: OK on candidate #${ATTEMPT}"
                CONNECTED=1
                break
              fi
              if [ -f "$PID" ]; then
                VPNPID=$(sudo cat "$PID" 2>/dev/null || true)
                if [ -n "$VPNPID" ] && ! sudo kill -0 "$VPNPID" 2>/dev/null; then
                  break
                fi
              fi
              sleep 1
            done

            if [ "$CONNECTED" -eq 1 ]; then
              break
            fi

            echo "Candidate #${ATTEMPT} timed out/failed; switching to next Japan server"
            if [ -f "$PID" ]; then
              VPNPID=$(sudo cat "$PID" 2>/dev/null || true)
              if [ -n "$VPNPID" ]; then
                sudo kill "$VPNPID" 2>/dev/null || true
                sleep 1
                sudo kill -9 "$VPNPID" 2>/dev/null || true
              fi
            fi
            sudo tail -8 "$LOG" 2>/dev/null || true
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo 'All prepared VPN Gate Japan candidates failed'
            exit 1
          fi

          echo -n 'radiko area after VPN: '
          curl -fsSL --max-time 15 https://radiko.jp/area || true
          echo

      - name: Test radiko Premium area-free LIVE
        env:
          RADIKO_MAIL: ${{ secrets.RADIKO_MAIL }}
          RADIKO_PASSWORD: ${{ secrets.RADIKO_PASSWORD }}
        run: python radiko_live_test.py

name: Kana HLS Instance Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kana_instance_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Probe full HLS chain
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import concurrent.futures as cf, json, re, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          text=Path("youtube/output/kana.m3u").read_text(encoding="utf-8")
          match=re.search(r'watch\?v=([A-Za-z0-9_-]{11})',text)
          if not match: raise SystemExit("Current Kana watch ID missing")
          VIDEO_ID=match.group(1)
          print("CURRENT_DAY_OR_MID_VIDEO",VIDEO_ID,flush=True)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          INV=[
            "https://inv.nadeko.net",
            "https://invidious.nerdvpn.de",
            "https://yt.chocolatemoo53.com",
            "https://invidious.tiekoetter.com",
          ]
          PIPED=[
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.leptons.xyz",
            "https://pipedapi.nosebs.ru",
            "https://pipedapi.adminforge.de",
            "https://api.piped.yt",
            "https://pipedapi.drgns.space",
            "https://api.piped.private.coffee",
          ]

          def req(url, limit=2_000_000, timeout=10):
              r=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*","Cache-Control":"no-cache"})
              with urllib.request.urlopen(r,timeout=timeout) as x:
                  b=x.read(limit)
                  return x.status,x.geturl(),dict(x.headers.items()),b

          def first_url(text, base):
              for line0 in text.splitlines():
                  line=line0.strip()
                  if not line: continue
                  if line.startswith("#"):
                      m=re.search(r'URI=["\']([^"\']+)["\']',line)
                      if m: return urllib.parse.urljoin(base,m.group(1))
                  else:
                      return urllib.parse.urljoin(base,line)
              return None

          def mapped(url, base):
              p=urllib.parse.urlparse(url)
              h=(p.hostname or "").lower()
              if h=="youtube.com" or h.endswith(".youtube.com"):
                  bp=urllib.parse.urlparse(base)
                  return bp.scheme+"://"+bp.netloc+p.path+(("?"+p.query) if p.query else "")
              return url

          def check_chain(kind,base,hls):
              out={"kind":kind,"base":base,"hls_host":urllib.parse.urlparse(hls).hostname}
              try:
                  ms,mf,mh,mb=req(hls)
                  mt=mb.decode("utf-8","replace")
                  out["master"]=[ms,len(mb),mh.get("Content-Type")]
                  child=first_url(mt,mf)
                  if not child:
                      out["error"]="no child"; return out
                  out["child_original_host"]=urllib.parse.urlparse(child).hostname
                  ctry=mapped(child,base)
                  out["child_fetch_host"]=urllib.parse.urlparse(ctry).hostname
                  cs,cf,ch,cb=req(ctry)
                  ct=cb.decode("utf-8","replace")
                  out["child"]=[cs,len(cb),ch.get("Content-Type"),urllib.parse.urlparse(cf).hostname]
                  if "#EXTM3U" not in ct[:8192]:
                      out["error"]="child not hls"; out["preview"]=ct[:160]; return out
                  seg=first_url(ct,cf)
                  if not seg:
                      out["error"]="no segment"; return out
                  out["segment_original_host"]=urllib.parse.urlparse(seg).hostname
                  stry=mapped(seg,base)
                  out["segment_fetch_host"]=urllib.parse.urlparse(stry).hostname
                  ss,sf,sh,sb=req(stry,limit=4_000_000)
                  ctype=sh.get("Content-Type") or ""
                  preview=""
                  if "text/" in ctype.lower() or len(sb)<1024:
                      preview=sb[:250].decode("utf-8","replace")
                  media_ok=ss in (200,206) and len(sb)>1024 and "text/" not in ctype.lower() and "html" not in ctype.lower()
                  out["segment"]=[ss,len(sb),ctype,urllib.parse.urlparse(sf).hostname]
                  out["media_ok"]=media_ok
                  if preview: out["preview"]=preview
                  return out
              except Exception as e:
                  out["error"]=type(e).__name__+": "+str(e)[:220]
                  return out

          def inv(base):
              try:
                  s,f,h,b=req(base+"/api/v1/videos/"+VIDEO_ID)
                  d=json.loads(b.decode())
                  hls=d.get("hlsUrl") or d.get("hls")
                  if not isinstance(hls,str) or not hls.startswith("http"):
                      return {"kind":"invidious","base":base,"error":"no hlsUrl"}
                  return check_chain("invidious",base,hls)
              except Exception as e:
                  return {"kind":"invidious","base":base,"error":type(e).__name__+": "+str(e)[:220]}

          def piped(base):
              try:
                  s,f,h,b=req(base+"/streams/"+VIDEO_ID)
                  d=json.loads(b.decode())
                  hls=d.get("hls")
                  if not isinstance(hls,str) or not hls.startswith("http"):
                      return {"kind":"piped","base":base,"error":"no hls"}
                  return check_chain("piped",base,hls)
              except Exception as e:
                  return {"kind":"piped","base":base,"error":type(e).__name__+": "+str(e)[:220]}

          jobs=[]
          with cf.ThreadPoolExecutor(max_workers=11) as ex:
              for b in INV: jobs.append(ex.submit(inv,b))
              for b in PIPED: jobs.append(ex.submit(piped,b))
              for fut in cf.as_completed(jobs):
                  print("RESULT "+json.dumps(fut.result(),ensure_ascii=False),flush=True)
          PY
          python3 /tmp/probe.py
          echo "Railway /status:"
          curl -L -sS --max-time 20 'https://kana-iptv-fresh-production.up.railway.app/status' | head -c 1600 || true
          echo
          echo "Railway dynamic relay response:"
          curl -L -sS --max-time 20 -o /tmp/kana_railway_probe.txt -w 'HTTP %{http_code} content-type=%{content_type} size=%{size_download}\\n' 'https://kana-iptv-fresh-production.up.railway.app/kana-9x.m3u8' || true
          head -c 120 /tmp/kana_railway_probe.txt 2>/dev/null || true
          echo
          echo "Railway LIVE media track segment probe:"
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json
          ROOT='https://kana-iptv-fresh-production.up.railway.app/kana-9x.m3u8'
          def fetch(url,limit=2_500_000):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as x:
                  return x.status,x.headers.get('Content-Type',''),x.read(limit),x.geturl()
          status,ctype,data,final=fetch(ROOT)
          master=data.decode('utf-8','replace')
          print('MASTER',status,ctype,len(data),flush=True)
          links=[]
          for line in master.splitlines():
              if line.startswith('#EXT-X-MEDIA:') and 'TYPE=AUDIO' in line:
                  m=re.search(r'URI="([^"]+)"',line)
                  if m: links.append(('audio',urllib.parse.urljoin(final,m.group(1))))
              if line and not line.startswith('#'):
                  links.append(('video',urllib.parse.urljoin(final,line)))
          print('TRACKS',[(kind,urllib.parse.urlparse(url).path) for kind,url in links],flush=True)
          for kind,url in links[:4]:
              try:
                  st,ct,body,child_final=fetch(url)
                  txt=body.decode('utf-8','replace')
                  segments=[line for line in txt.splitlines() if line and not line.startswith('#')]
                  tags=[line for line in txt.splitlines() if line.startswith(('#EXT-X-TARGETDURATION','#EXT-X-MEDIA-SEQUENCE','#EXT-X-MAP','#EXT-X-PLAYLIST-TYPE','#EXT-X-ENDLIST'))]
                  print('CHILD',kind,st,ct,'bytes',len(body),'segments',len(segments),'tags',[t[:150] for t in tags[:6]],flush=True)
                  if segments:
                      seg=urllib.parse.urljoin(child_final,segments[-1])
                      st2,ct2,content,_=fetch(seg,limit=300000)
                      print('SEGMENT_LAST',kind,st2,ct2,'bytes',len(content),'head',content[:20].hex(),flush=True)
              except Exception as e:
                  print('TRACK_ERROR',kind,type(e).__name__,str(e)[:180],flush=True)
          PY
          echo "Railway audio/video ffprobe:"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          timeout 55 ffprobe -hide_banner -v error -rw_timeout 12000000 -analyzeduration 6000000 -probesize 2500000 -show_entries stream=index,codec_name,codec_type,width,height -of json 'https://kana-iptv-fresh-production.up.railway.app/kana-9x.m3u8' > /tmp/kana_av.json || true
          cat /tmp/kana_av.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/kana_av.json'))
          types={s.get('codec_type') for s in d.get('streams',[])}
          print("RAILWAY_AV_TYPES",sorted(t for t in types if t),flush=True)
          if not {'audio','video'}<=types:
              raise SystemExit("RAILWAY_AV_NOT_VERIFIED")
          print("RAILWAY_AV_VERIFIED",flush=True)
          PY
          echo "Railway manifest preview:"
          head -c 800 /tmp/kana_railway_probe.txt 2>/dev/null || true
          echo

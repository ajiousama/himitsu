name: Update Radio

on:
  workflow_dispatch:
  push:
    paths:
      - 'radio/update_nhk.py'
      - 'radio/build_playlist.py'
      - 'preserve_radio_local_channels.py'
      - 'radiko_freewifi.py'
      - 'radiko_epg.py'
      - 'nhk_radio_epg.py'
      - '.github/workflows/update_nhk_radio.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-radio-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Refresh NHK static-image video playlist
        run: python radio/update_nhk.py

      - name: Refresh full Radiko static-image video catalog
        run: |
          python preserve_radio_local_channels.py
          python radio/build_playlist.py

      - name: Merge full Radiko EPG
        run: |
          python - <<'PY'
          from radiko_freewifi import merge_radiko_epg
          ch, pg = merge_radiko_epg()
          print(f'Radiko EPG merged: channels={ch} programmes={pg}')
          if ch < 100 or pg < 500:
              raise SystemExit(f'Radiko EPG too small: channels={ch} programmes={pg}')
          PY

      - name: Merge NHK radio EPG
        run: python nhk_radio_epg.py

      - name: Validate radio only
        shell: bash
        run: |
          test -s radio/nationwide.m3u
          test -s radio/nhk.m3u
          test -s radio/nhk_stations.json
          test -s radio/playlist.m3u
          grep -q 'NHKラジオ第1（松山）' radio/nhk.m3u
          grep -q 'NHK-FM（松山）' radio/nhk.m3u
          grep -q 'RNB南海放送（ラジオ）' radio/nationwide.m3u
          grep -q 'FM愛媛（ラジオ）' radio/nationwide.m3u
          grep -Fq 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_r1_matsuyama' radio/nhk.m3u
          grep -Fq 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_fm_matsuyama' radio/nhk.m3u
          grep -Fq 'NHK_Radio_1_2024.svg/500px-NHK_Radio_1_2024.svg.png' radio/nhk.m3u
          grep -Fq 'NHK_FM_2024.svg/500px-NHK_FM_2024.svg.png' radio/nhk.m3u
          ! grep -Fq 'NHK_logo_2020.svg' radio/nhk.m3u
          ! grep -Fq 'radio-ts-assets/' radio/nationwide.m3u
          ! grep -Fq 'radio-ts-assets/' radio/nhk.m3u
          RADIO_COUNT=$(grep -c 'tvg-id="radiko\.' radio/nationwide.m3u || true)
          NHK_COUNT=$(grep -E -c 'tvg-id="nhk_(r1|fm)_' radio/nhk.m3u || true)
          COMBINED_COUNT=$(grep -c '^#EXTINF:' radio/playlist.m3u || true)
          [ "$RADIO_COUNT" -ge 100 ]
          [ "$NHK_COUNT" -eq 16 ]
          [ "$COMBINED_COUNT" -ge 116 ]

      - name: Publish updated radio catalog safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # EPG merge steps above are validation-only here. guides.xml is owned by
          # the FreeWiFi EPG workflow, so never publish this job's local EPG copy.
          cp radio/playlist.m3u radio.m3u
          snapshot="$(mktemp -d)"
          cp radio/nationwide.m3u "$snapshot/nationwide.m3u"
          cp radio/nhk.m3u "$snapshot/nhk.m3u"
          cp radio/nhk_stations.json "$snapshot/nhk_stations.json"
          cp radio/playlist.m3u "$snapshot/playlist.m3u"
          cp radio.m3u "$snapshot/radio.m3u"

          for attempt in 1 2 3 4 5; do
            echo "Radio publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            cp "$snapshot/nationwide.m3u" radio/nationwide.m3u
            cp "$snapshot/nhk.m3u" radio/nhk.m3u
            cp "$snapshot/nhk_stations.json" radio/nhk_stations.json
            cp "$snapshot/playlist.m3u" radio/playlist.m3u
            cp "$snapshot/radio.m3u" radio.m3u

            git add radio/nationwide.m3u radio/nhk.m3u radio/nhk_stations.json radio/playlist.m3u radio.m3u
            if git diff --cached --quiet; then
              echo 'Radio catalog already current on latest main'
              exit 0
            fi

            git commit -m 'Update radio catalog [skip render]'
            if git push origin HEAD:main; then
              echo 'Radio catalog published successfully'
              exit 0
            fi

            echo "::warning::main moved during radio publish; retrying on newest main"
            sleep 1
          done

          echo "::error::Radio publish failed after 5 attempts"
          exit 1

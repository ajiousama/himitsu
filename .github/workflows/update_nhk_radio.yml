name: Update Radio

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_nhk_radio.py'
      - 'preserve_radio_local_channels.py'
      - 'radiko_freewifi.py'
      - '.github/workflows/update_nhk_radio.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Refresh NHK radio playlist
        run: python update_nhk_radio.py

      - name: Build full Radiko catalog and FreeWiFi selected copies
        run: python preserve_radio_local_channels.py

      - name: Validate
        shell: bash
        run: |
          test -s radio.m3u
          test -s freewifi
          grep -q '# === NHK_RADIO_MANAGED_START ===' freewifi
          grep -q '# === NHK_RADIO_MANAGED_END ===' freewifi
          grep -q '# === RADIKO_MANAGED_START ===' freewifi
          grep -q 'RNB南海放送（ラジオ）' freewifi
          grep -q 'FM愛媛（ラジオ）' freewifi
          grep -q 'ABCラジオ（ラジオ）' freewifi
          grep -q 'MBSラジオ（ラジオ）' freewifi
          grep -q 'KBS京都' freewifi
          grep -E -q 'α-STATION|ALPHA-STATION' freewifi
          grep -E -q 'e-radio|FM滋賀' freewifi
          grep -q 'ラジオ関西' freewifi
          ! grep -q '# === NETGEN_LOCAL_KEEP_START ===' freewifi
          FREE_COUNT=$(grep -c 'tvg-id="radiko\.' freewifi || true)
          RADIO_COUNT=$(grep -c 'tvg-id="radiko\.' radio.m3u || true)
          echo "FreeWiFi selected Radiko copies: $FREE_COUNT"
          echo "radio.m3u all Radiko stations: $RADIO_COUNT"
          [ "$FREE_COUNT" -ge 10 ]
          [ "$FREE_COUNT" -lt 30 ]
          [ "$RADIO_COUNT" -ge 100 ]
          grep -q 'NHKラジオ第1（松山）' radio.m3u
          grep -q 'NHK-FM（松山）' radio.m3u
          grep -q 'RNB南海放送（ラジオ）' radio.m3u
          grep -q 'FM愛媛（ラジオ）' radio.m3u
          grep -q 'KBS京都' radio.m3u
          grep -E -q 'α-STATION|ALPHA-STATION' radio.m3u
          grep -E -q 'e-radio|FM滋賀' radio.m3u
          grep -q 'ラジオ関西' radio.m3u

      - name: Commit updated radio catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio.m3u freewifi
          if git diff --cached --quiet; then
            echo 'No radio changes'
            exit 0
          fi
          git commit -m 'Update full radio catalog and FreeWiFi copies'
          git pull --rebase origin main
          git push origin main

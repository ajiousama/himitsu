name: Update Radio

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_nhk_radio.py'
      - 'preserve_radio_local_channels.py'
      - '.github/workflows/update_nhk_radio.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Refresh radio playlist
        run: python update_nhk_radio.py

      - name: Preserve local radio copies in FreeWiFi
        run: python preserve_radio_local_channels.py

      - name: Validate
        shell: bash
        run: |
          test -s radio.m3u
          test -s freewifi
          grep -q '# === NHK_RADIO_MANAGED_START ===' freewifi
          grep -q '# === NHK_RADIO_MANAGED_END ===' freewifi
          grep -q '# === LOCAL_RADIO_KEEP_START ===' freewifi
          grep -q 'RNB南海放送（ラジオ）' freewifi
          grep -q 'FM愛媛（ラジオ）' freewifi
          grep -q 'ABCラジオ（ラジオ）' freewifi
          grep -q 'MBSラジオ（ラジオ）' freewifi
          grep -q 'KBS京都ラジオ（ラジオ）' freewifi
          ! grep -q '# === NETGEN_LOCAL_KEEP_START ===' freewifi
          COUNT=$(grep -c '^#EXTINF:' radio.m3u || true)
          echo "Radio channels: $COUNT"
          [ "$COUNT" -ge 2 ]
          grep -q 'NHKラジオ第1（松山）' radio.m3u
          grep -q 'NHK-FM（松山）' radio.m3u

      - name: Commit updated radio playlist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio.m3u freewifi
          if git diff --cached --quiet; then
            echo 'No radio changes'
            exit 0
          fi
          git commit -m 'Update radio streams and preserve local radio copies'
          git pull --rebase origin main
          git push origin main

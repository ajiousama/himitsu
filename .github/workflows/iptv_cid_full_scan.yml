name: IPTV Full Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run full scan
        shell: bash
        run: |
          cat > scan_iptv_all.py <<'PY'
          import csv, json, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          TIMEOUT = 7
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36"

          LONG_TAIL = (
              "isp=5&bind=0&uin=159413&playseek=0&"
              "timestamp=1732380893&"
              "sign=ca849dc6608a1dc0afb2559343d13bf779f7a6542b2ec260d8e8887f8c2e03cf"
          )

          checks = []

          # bs01～bs99 / cs01～cs99 × 3系統
          cids = [f"bs{i:02d}" for i in range(1,100)] + [f"cs{i:02d}" for i in range(1,100)]
          for cid in cids:
              checks.extend([
                  (cid, "kaitekitv",
                   f"http://cdns.kaitekitv.com:8000/zhongying/live/playlist.m3u8?cid={cid}&isp=5-15"),
                  (cid, "primehome_short",
                   f"http://cdns.jp-primehome.com:8000/zhongying/live/playlist.m3u8?cid={cid}&isp=5"),
                  (cid, "primehome_long",
                   f"http://cdns.jp-primehome.com:8000/zhongying/live/playlist.m3u8?cid={cid}&{LONG_TAIL}"),
              ])

          # HARUKA stream/1.m3u8 ～ stream/200.m3u8
          for n in range(1,201):
              checks.append((
                  f"haruka{n:03d}",
                  "haruka",
                  f"http://ha-ip.f5.si:9394/stream/{n}.m3u8"
              ))

          def probe(key, source, url):
              t0 = time.time()
              try:
                  req = Request(url, headers={
                      "User-Agent": UA,
                      "Accept": "*/*",
                      "Connection": "close",
                  })
                  with urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(65536)
                      code = getattr(r, "status", 200)
                      final_url = r.geturl()
                      ctype = r.headers.get("Content-Type", "")
                  text = body.decode("utf-8", errors="replace")
                  is_m3u8 = "#EXTM3U" in text or "mpegurl" in ctype.lower()
                  media = [x.strip() for x in text.splitlines()
                           if x.strip() and not x.startswith("#")]
                  return {
                      "key": key, "source": source,
                      "ok": bool(code == 200 and is_m3u8),
                      "http": code,
                      "elapsed_sec": round(time.time()-t0,3),
                      "content_type": ctype,
                      "url": url,
                      "final_url": final_url,
                      "first_media": media[0] if media else "",
                      "error": "",
                  }
              except HTTPError as e:
                  err, code = f"HTTPError: {e}", e.code
              except URLError as e:
                  err, code = f"URLError: {e}", ""
              except Exception as e:
                  err, code = f"{type(e).__name__}: {e}", ""
              return {
                  "key": key, "source": source, "ok": False,
                  "http": code,
                  "elapsed_sec": round(time.time()-t0,3),
                  "content_type": "", "url": url, "final_url": "",
                  "first_media": "", "error": err,
              }

          rows, alive = [], []
          total = len(checks)

          for i, (key, source, url) in enumerate(checks, 1):
              print(f"[{i}/{total}] {source} {key}", flush=True)
              r = probe(key, source, url)
              rows.append(r)
              if r["ok"]:
                  alive.append(r)
                  print(f"  >>> ALIVE HTTP {r['http']}", flush=True)

          fields = ["key","source","ok","http","elapsed_sec","content_type",
                    "url","final_url","first_media","error"]

          with open("iptv_full_scan.csv","w",encoding="utf-8-sig",newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)

          Path("iptv_full_scan.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          txt = [f'{r["source"]:18} {r["key"]:12} HTTP={r["http"]} {r["url"]}'
                 for r in alive]
          Path("iptv_alive.txt").write_text(
              "\n".join(txt) + ("\n" if txt else ""), encoding="utf-8"
          )

          m3u = ["#EXTM3U", ""]
          for r in alive:
              m3u += [
                  f'#EXTINF:-1 group-title="SCAN {r["source"]}",{r["key"]} ({r["source"]})',
                  r["url"], ""
              ]
          Path("iptv_alive.m3u").write_text("\n".join(m3u), encoding="utf-8-sig")

          # HARUKAだけの生存番号
          haruka = [r for r in alive if r["source"] == "haruka"]
          Path("haruka_alive.txt").write_text(
              "\n".join(f'{r["key"]}: {r["url"]}' for r in haruka)
              + ("\n" if haruka else ""), encoding="utf-8"
          )

          print("\n===== SUMMARY =====")
          print(f"TOTAL CHECKS : {len(rows)}")
          print(f"TOTAL ALIVE  : {len(alive)}")
          print(f"HARUKA ALIVE : {len(haruka)}")
          print("===================")
          PY

          python scan_iptv_all.py

      - name: Show results
        if: always()
        run: |
          echo "===== HARUKA ALIVE ====="
          cat haruka_alive.txt || true
          echo
          echo "===== ALL ALIVE ====="
          cat iptv_alive.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-full-scan-results
          path: |
            iptv_full_scan.csv
            iptv_full_scan.json
            iptv_alive.txt
            iptv_alive.m3u
            haruka_alive.txt
          retention-days: 7
          if-no-files-found: warn

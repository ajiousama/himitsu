name: HARUKA 201-500 Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan HARUKA 201-500
        shell: bash
        run: |
          cat > scan_haruka_201_500.py <<'PY'
          import csv, json, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = "http://ha-ip.f5.si:9394/stream/{}.m3u8"
          TIMEOUT = 7
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36"

          def probe(n):
              url = BASE.format(n)
              t0 = time.time()
              try:
                  req = Request(url, headers={
                      "User-Agent": UA,
                      "Accept": "*/*",
                      "Connection": "close",
                  })
                  with urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(65536)
                      code = getattr(r, "status", 200)
                      final_url = r.geturl()
                      ctype = r.headers.get("Content-Type", "")

                  text = body.decode("utf-8", errors="replace")
                  is_m3u8 = "#EXTM3U" in text or "mpegurl" in ctype.lower()
                  media = [
                      x.strip() for x in text.splitlines()
                      if x.strip() and not x.startswith("#")
                  ]

                  return {
                      "number": n,
                      "ok": bool(code == 200 and is_m3u8),
                      "http": code,
                      "elapsed_sec": round(time.time() - t0, 3),
                      "content_type": ctype,
                      "url": url,
                      "final_url": final_url,
                      "first_media": media[0] if media else "",
                      "error": "",
                  }

              except HTTPError as e:
                  code, err = e.code, f"HTTPError: {e}"
              except URLError as e:
                  code, err = "", f"URLError: {e}"
              except Exception as e:
                  code, err = "", f"{type(e).__name__}: {e}"

              return {
                  "number": n,
                  "ok": False,
                  "http": code,
                  "elapsed_sec": round(time.time() - t0, 3),
                  "content_type": "",
                  "url": url,
                  "final_url": "",
                  "first_media": "",
                  "error": err,
              }

          rows = []
          alive = []

          for i, n in enumerate(range(201, 501), 1):
              print(f"[{i}/300] HARUKA stream/{n}.m3u8", flush=True)
              r = probe(n)
              rows.append(r)
              if r["ok"]:
                  alive.append(r)
                  print(f"  >>> ALIVE HTTP {r['http']}", flush=True)

          fields = [
              "number", "ok", "http", "elapsed_sec", "content_type",
              "url", "final_url", "first_media", "error"
          ]

          with open("haruka_201_500_scan.csv", "w",
                    encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)

          Path("haruka_201_500_scan.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          Path("haruka_201_500_alive.txt").write_text(
              "\n".join(
                  f'{r["number"]}: {r["url"]}'
                  for r in alive
              ) + ("\n" if alive else ""),
              encoding="utf-8"
          )

          m3u = ["#EXTM3U", ""]
          for r in alive:
              m3u += [
                  f'#EXTINF:-1 group-title="HARUKA SCAN",HARUKA {r["number"]}',
                  r["url"],
                  ""
              ]

          Path("haruka_201_500_alive.m3u").write_text(
              "\n".join(m3u),
              encoding="utf-8-sig"
          )

          print()
          print("===== SUMMARY =====")
          print("CHECKED :", len(rows))
          print("ALIVE   :", len(alive))
          print("===================")
          PY

          python scan_haruka_201_500.py

      - name: Show alive HARUKA
        if: always()
        run: |
          echo "===== HARUKA 201-500 ALIVE ====="
          cat haruka_201_500_alive.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haruka-201-500-scan-results
          path: |
            haruka_201_500_scan.csv
            haruka_201_500_scan.json
            haruka_201_500_alive.txt
            haruka_201_500_alive.m3u
          retention-days: 7
          if-no-files-found: warn

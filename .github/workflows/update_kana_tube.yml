name: Update Kana Tube LIVE and Schedule
# recovery-touch: 2026-09-09 day-night reliability v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'kana_tube_update.py'
      - 'test_sports_kana_reliability.py'
      - '.github/workflows/update_kana_tube.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

# Serialize with the general YouTube writer. Both workflows touch
# general_youtube.m3u and freewifi, so they must never publish concurrently.
concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          python -m pip install --upgrade curl_cffi
      - name: Reliability regression tests
        run: python -m unittest -v test_sports_kana_reliability
      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          rm -f youtube_cookies.txt
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
          fi
      - name: Refresh Kana tube reservation or LIVE
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main

          # First pass always discovers the newest official reservation/LIVE.
          python kana_tube_update.py

          # When a daytime or nighttime reservation is close to its scheduled
          # start, stay on it and re-check every 30 seconds. This closes the
          # gap between "is_upcoming" and the first usable LIVE HLS manifest.
          for transition_attempt in $(seq 1 16); do
            action="$(python - <<'PY'
          import json, time
          from pathlib import Path
          try:
              s = json.loads(Path('kana_tube_status.json').read_text(encoding='utf-8'))
          except Exception:
              print('stop')
              raise SystemExit
          state = s.get('state')
          direct = bool(s.get('direct_hls'))
          try:
              start = int(s.get('start_timestamp') or 0)
          except Exception:
              start = 0
          delta = start - int(time.time()) if start else None
          if state == 'is_live' and not direct:
              print('retry')
          elif state == 'is_upcoming' and delta is not None and -600 <= delta <= 360:
              print('retry')
          else:
              print('stop')
          PY
          )"
            if [ "$action" != "retry" ]; then
              break
            fi
            sleep 30
            python kana_tube_update.py
          done

          snapshot="$(mktemp -d)"
          cp kana_tube.m3u kana_tube_status.json "$snapshot/"

          # Rebase-and-overlay loop protects unrelated FreeWiFi updates that may
          # have landed while YouTube was being checked.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python -c 'import kana_tube_update as k; import sys; k.publish_snapshot(sys.argv[1])' "$snapshot"
            python freewifi_youtube_cleanup.py
            python - <<'PY'
          from pathlib import Path

          p = Path('freewifi')
          header = '#EXTM3U url-tvg="https://raw.githubusercontent.com/ajiousama/himitsu/main/guides.xml" tvg-shift=0 m3uautoload=1'
          lines = p.read_text(encoding='utf-8-sig', errors='replace').splitlines() if p.exists() else []
          body = []
          for line in lines:
              s = line.strip()
              if s.startswith('#EXTM3U'):
                  continue
              if s.startswith('url-tvg=') and 'guides.xml' in s:
                  continue
              body.append(line)
          while body and not body[0].strip():
              body.pop(0)
          text = header + '\n'
          if body:
              text += '\n' + '\n'.join(body).rstrip() + '\n'
          p.write_text(text, encoding='utf-8')
          PY
            test -s kana_tube.m3u
            test -s general_youtube.m3u
            test -s freewifi
            test -s kana_tube_status.json
            test "$(head -n 1 freewifi)" = '#EXTM3U url-tvg="https://raw.githubusercontent.com/ajiousama/himitsu/main/guides.xml" tvg-shift=0 m3uautoload=1'
            test "$(grep -c '^ *url-tvg=' freewifi || true)" -eq 0
            test "$(grep -c 'tvg-id=\"youtube.kana_tube\"' freewifi || true)" -le 1
            test "$(grep -c 'tvg-id=\"youtube.kana_tube\"' general_youtube.m3u || true)" -le 1
            python -c 'import kana_tube_update as k; k.validate_outputs()'
            git add kana_tube.m3u kana_tube_status.json general_youtube.m3u freewifi
            if git diff --cached --quiet; then
              echo 'Kana tube already current'
              python - <<'PY'
          import json, sys
          from pathlib import Path
          s=json.loads(Path('kana_tube_status.json').read_text(encoding='utf-8'))
          sys.exit(1 if s.get('state') == 'error' or (s.get('state') == 'is_live' and not s.get('direct_hls')) else 0)
          PY
              exit 0
            fi
            git commit -m 'Refresh Kana tube schedule/LIVE'
            if git push origin HEAD:main; then
              echo 'Kana tube published successfully'
              python - <<'PY'
          import json, sys
          from pathlib import Path
          s=json.loads(Path('kana_tube_status.json').read_text(encoding='utf-8'))
          if s.get('state') == 'error':
              print('::error::Kana YouTube check failed; preserved previous entry')
              sys.exit(1)
          if s.get('state') == 'is_live' and not s.get('direct_hls'):
              print('::error::Kana is LIVE but direct HLS is still unavailable; fallback published and next schedule will retry')
              sys.exit(1)
          PY
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Cleanup cookies
        if: always()
        run: rm -f youtube_cookies.txt

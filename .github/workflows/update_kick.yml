name: Update KICK LIVE

on:
  workflow_dispatch:
  push:
    paths:
      - 'kick_channels.json'
      - 'kick_update.py'
      - 'kick_ytdlp_update.py'
      - '.github/workflows/update_kick.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install KICK extractors
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp curl_cffi
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Refresh KICK live HLS via multi-path extractor
        run: |
          echo "KICK multi-path refresh started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python kick_ytdlp_update.py
      - name: Validate KICK block
        run: |
          test -s freewifi
          grep -q '# === KICK_MANAGED_START ===' freewifi
          grep -q '# === KICK_MANAGED_END ===' freewifi
          echo 'KICK managed block:'
          sed -n '/# === KICK_MANAGED_START ===/,/# === KICK_MANAGED_END ===/p' freewifi | sed -E 's/(token=)[^& ]+/\1[redacted]/g'
      - name: Commit KICK update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'No KICK changes'
            exit 0
          fi
          git commit -m 'Update KICK LIVE URLs'
          git pull --rebase origin main
          git push origin main

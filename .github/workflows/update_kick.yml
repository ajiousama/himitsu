name: Update KICK LIVE

on:
  workflow_dispatch:
  push:
    paths:
      - 'kick_channels.json'
      - 'kick_update.py'
      - 'kick_ytdlp_update.py'
      - '.github/workflows/update_kick.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install KICK extractors
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp curl_cffi
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Refresh KICK live HLS via fresh multi-path extractor
        run: |
          echo "KICK fresh multi-path refresh started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python kick_ytdlp_update.py
      - name: Validate KICK block and JWT freshness
        run: |
          test -s freewifi
          grep -q '# === KICK_MANAGED_START ===' freewifi
          grep -q '# === KICK_MANAGED_END ===' freewifi
          python - <<'PY'
          import base64, json, re, time
          from urllib.parse import urlparse, parse_qs
          text=open('freewifi',encoding='utf-8-sig').read()
          m=re.search(r'# === KICK_MANAGED_START ===(.*?)# === KICK_MANAGED_END ===', text, re.S)
          if not m:
              raise SystemExit('KICK managed block missing')
          block=m.group(1)
          urls=re.findall(r'https://[^\s]+\.m3u8\?[^\s]+', block)
          now=int(time.time())
          for url in urls:
              token=(parse_qs(urlparse(url).query).get('token') or [None])[0]
              if not token or token.count('.') < 2:
                  continue
              payload=token.split('.')[1] + '=' * (-len(token.split('.')[1]) % 4)
              exp=int(json.loads(base64.urlsafe_b64decode(payload.encode()).decode())['exp'])
              remain=exp-now
              print('KICK JWT remaining:', remain, 'seconds')
              if remain < 180:
                  raise SystemExit(f'stale KICK JWT: {remain}s remaining')
          print('KICK JWT freshness audit OK')
          PY
          echo 'KICK managed block:'
          sed -n '/# === KICK_MANAGED_START ===/,/# === KICK_MANAGED_END ===/p' freewifi | sed -E 's/(token=)[^& ]+/\1[redacted]/g'
      - name: Commit KICK update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'No KICK changes'
            exit 0
          fi
          git commit -m 'Update KICK LIVE URLs'
          git pull --rebase origin main
          git push origin main

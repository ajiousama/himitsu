name: Update KICK stable entry

on:
  workflow_dispatch:
  push:
    paths:
      - 'kick_channels.json'
      - 'kick_stable_update.py'
      - 'vercel-radiko/api/kick.mjs'
      - '.github/workflows/update_kick.yml'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Install stable KICK entry URLs
        run: python kick_stable_update.py
      - name: Validate KICK stable entries
        run: |
          test -s freewifi
          grep -q '# === KICK_MANAGED_START ===' freewifi
          grep -q 'https://himitsu-six.vercel.app/api/kick?ch=gccx' freewifi
          grep -q 'https://himitsu-six.vercel.app/api/kick?ch=nogizaka' freewifi
          echo 'KICK managed block:'
          sed -n '/# === KICK_MANAGED_START ===/,/# === KICK_MANAGED_END ===/p' freewifi
      - name: Commit KICK stable entries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'No KICK changes'
            exit 0
          fi
          git commit -m 'Switch KICK to stable resolver URLs'
          git pull --rebase origin main
          git push origin main

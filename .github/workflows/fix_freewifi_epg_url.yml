name: Fix FreeWiFi EPG URL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_freewifi_epg_url.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Change only first-line EPG URL
        shell: python
        run: |
          from pathlib import Path
          p = Path('freewifi')
          s = p.read_text(encoding='utf-8-sig')
          old = 'https://github.com/karenda-jp/etc/raw/refs/heads/main/guides.xml'
          new = 'https://raw.githubusercontent.com/ajiousama/himitsu/main/guides.xml'
          first, rest = s.split('\n', 1)
          if old not in first:
              raise SystemExit('Expected old EPG URL not found on first line')
          p.write_text(first.replace(old, new) + '\n' + rest, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add freewifi
          git diff --cached --quiet || git commit -m "Switch FreeWiFi to self-hosted EPG"
          git push

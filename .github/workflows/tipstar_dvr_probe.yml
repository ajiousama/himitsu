name: TIPSTAR DVR Probe

on:
  push:
    paths:
      - '.github/workflows/tipstar_dvr_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe active TIPSTAR HLS streams
        shell: python
        run: |
          import urllib.request, urllib.parse, re
          streams = {
            '松戸': 'https://d3um80ws33iv2t.cloudfront.net/out/v1/b573e645e5de40c999eecfe4e7221fe0/index.m3u8',
            '青森': 'https://d18cvifc0fh5r6.cloudfront.net/out/v1/e86a6fef2a4b4cefb7e767727ec3df4c/index.m3u8',
            '宇都宮': 'https://d1bbh9hna9i29a.cloudfront.net/out/v1/b7a1f334e53d4f6d8c0feb6bd08cfa02/index.m3u8',
            '熊本': 'https://d2m69fn251lhrf.cloudfront.net/out/v1/1fb24676fcbf458b964083925878052a/index.m3u8',
          }
          out=[]
          def log(s=''):
            print(s); out.append(str(s))
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=15) as r:
              return r.read().decode('utf-8','replace'),r.geturl(),r.status
          def best(master,base):
            lines=[x.strip() for x in master.splitlines() if x.strip()]
            c=[]
            for i,l in enumerate(lines):
              if l.startswith('#EXT-X-STREAM-INF') and i+1<len(lines) and not lines[i+1].startswith('#'):
                m=re.search(r'BANDWIDTH=(\d+)',l); bw=int(m.group(1)) if m else 0
                c.append((bw,urllib.parse.urljoin(base,lines[i+1])))
            return max(c)[1] if c else base
          for name,url in streams.items():
            log(f'===== {name} =====')
            try:
              text,final,status=get(url); mu=best(text,final)
              if mu!=final: text,final,status=get(mu)
              ds=[float(x) for x in re.findall(r'#EXTINF:([0-9.]+)',text)]
              seq=re.search(r'#EXT-X-MEDIA-SEQUENCE:(\d+)',text)
              pdt=re.findall(r'#EXT-X-PROGRAM-DATE-TIME:([^\r\n]+)',text)
              log('HTTP_STATUS='+str(status))
              log('MEDIA_URL='+final)
              log('SEGMENTS='+str(len(ds)))
              log('HOLD_SECONDS='+str(round(sum(ds),3)))
              log('MEDIA_SEQUENCE='+(seq.group(1) if seq else 'NONE'))
              log('PROGRAM_DATE_TIME_FIRST='+(pdt[0] if pdt else 'NONE'))
              log('PROGRAM_DATE_TIME_LAST='+(pdt[-1] if pdt else 'NONE'))
              log('PROGRAM_DATE_TIME_COUNT='+str(len(pdt)))
              log('ENDLIST='+str('#EXT-X-ENDLIST' in text))
              t=re.search(r'#EXT-X-TARGETDURATION:(\d+)',text)
              log('TARGET_DURATION='+(t.group(1) if t else 'NONE'))
            except Exception as e: log('ERROR='+repr(e))
          open('tipstar_dvr_probe_result.txt','w',encoding='utf-8').write('\n'.join(out)+'\n')
      - name: Commit probe result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tipstar_dvr_probe_result.txt
          git diff --cached --quiet || git commit -m "Update TIPSTAR DVR probe result"
          git push

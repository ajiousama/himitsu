name: Sync GameCenter CX2 KICK to Free Wi-Fi

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync_gccx2_live.yml'

permissions:
  contents: write

concurrency:
  group: sync-gccx2-live
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check joshua-hkd LIVE state and sync Free Wi-Fi
        shell: python
        run: |
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path

          SLUG = 'joshua-hkd'
          API = f'https://kick.com/api/v2/channels/{SLUG}'
          FREEWIFI = Path('freewifi')
          LOGO = 'https://raw.githubusercontent.com/ajiousama/himitsu/main/logos/kick_gccx2.svg'
          PLAY_URL = 'https://himitsu-six.vercel.app/api/kick2'

          def fetch_json(url):
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                  'Accept': 'application/json, text/plain, */*',
                  'Referer': 'https://kick.com/'
              }
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      print(f'KICK lookup attempt {attempt + 1} failed: {e}')
                      if attempt < 2:
                          time.sleep(3 * (attempt + 1))
              return None

          def find_playback(value):
              if isinstance(value, str):
                  return value if '.m3u8' in value and value.startswith(('http://', 'https://')) else None
              if isinstance(value, list):
                  for item in value:
                      hit = find_playback(item)
                      if hit:
                          return hit
              if isinstance(value, dict):
                  for key in ('playback_url', 'playbackUrl', 'hls_url', 'hlsUrl', 'stream_url', 'streamUrl'):
                      v = value.get(key)
                      if isinstance(v, str) and '.m3u8' in v:
                          return v
                  for item in value.values():
                      hit = find_playback(item)
                      if hit:
                          return hit
              return None

          data = fetch_json(API)
          if data is None:
              raise SystemExit('KICK lookup failed; keep current Free Wi-Fi state unchanged')

          playback = find_playback(data)
          is_live = bool(playback)
          print(f'CX2 LIVE={is_live}')

          text = FREEWIFI.read_text(encoding='utf-8')

          # Remove every existing CX2 EXTINF + following URL first, preventing duplicates.
          lines = text.splitlines(keepends=True)
          cleaned = []
          i = 0
          while i < len(lines):
              if 'tvg-id="kick.gccx2"' in lines[i]:
                  i += 1
                  if i < len(lines) and not lines[i].lstrip().startswith('#') and lines[i].strip():
                      i += 1
                  while i < len(lines) and not lines[i].strip():
                      i += 1
                  continue
              cleaned.append(lines[i])
              i += 1
          text = ''.join(cleaned)

          if is_live:
              block = (
                  f'#EXTINF:-1 group-title="その他" tvg-id="kick.gccx2" tvg-logo="{LOGO}",ゲームセンターＣＸ2(KICK)\n'
                  f'{PLAY_URL}\n'
              )
              marker = '#EXTINF:-1 group-title="その他" tvg-id="kick.nogizaka"'
              pos = text.find(marker)
              if pos >= 0:
                  text = text[:pos] + block + text[pos:]
              else:
                  end = '# === KICK_MANAGED_END ==='
                  pos = text.find(end)
                  if pos >= 0:
                      text = text[:pos] + block + text[pos:]
                  else:
                      text += '\n' + block

          FREEWIFI.write_text(text, encoding='utf-8')
          Path('gccx2_live_state.json').write_text(
              json.dumps({
                  'slug': SLUG,
                  'live': is_live,
                  'checked_by': 'GitHub Actions',
                  'playback_detected': bool(playback)
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

      - name: Commit only when state changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi gccx2_live_state.json
          if git diff --cached --quiet; then
            echo "No CX2 state change"
            exit 0
          fi
          git pull --rebase origin main
          git add freewifi gccx2_live_state.json
          git commit -m "Sync GameCenter CX2 KICK live state [skip ci]"
          git push

name: One-time Haruka Akariko cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_haruka_akariko_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update freewifi
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('freewifi')
          text = path.read_text(encoding='utf-8')
          original = text

          # Akariko: APTV-compatible HTTPS.
          text = text.replace('http://haru.charandom.blog/', 'https://haru.charandom.blog/')

          # Treat paragraphs separated by blank lines as units. EXTINF + URL is one unit.
          blocks = re.split(r'\n\s*\n', text.strip())

          # Remove Haruka1 / Haruka3 entries completely; keep Haruka2 as the sole Haruka.
          kept = []
          for block in blocks:
              if block.startswith('#EXTINF') and (
                  'group-title="haruka1 ' in block
                  or 'group-title="haruka3 ' in block
                  or 'ハルカ1' in block
                  or 'ハルカ3' in block
              ):
                  continue
              kept.append(block)
          blocks = kept

          # Rename Haruka2 -> haruka in group/title labels.
          blocks = [
              b.replace('group-title="haruka2 ', 'group-title="haruka ')
               .replace('ハルカ2', 'haruka')
              for b in blocks
          ]

          def tvg_id(block):
              m = re.search(r'tvg-id="([^"]+)"', block)
              return m.group(1) if m else None

          def is_haruka(block):
              return block.startswith('#EXTINF') and 'group-title="haruka ' in block

          def is_akariko(block):
              return block.startswith('#EXTINF') and 'haru.charandom.blog/' in block

          # Move each Akariko entry immediately after the matching remaining Haruka entry.
          # Matching is by tvg-id so other fallback sources stay in their existing order.
          akariko_by_id = {}
          akariko_no_id = []
          non_akariko = []
          for block in blocks:
              if is_akariko(block):
                  tid = tvg_id(block)
                  if tid:
                      akariko_by_id.setdefault(tid, []).append(block)
                  else:
                      akariko_no_id.append(block)
              else:
                  non_akariko.append(block)

          out = []
          for block in non_akariko:
              out.append(block)
              if is_haruka(block):
                  tid = tvg_id(block)
                  if tid in akariko_by_id:
                      out.extend(akariko_by_id.pop(tid))

          # Keep unmatched Akariko entries rather than dropping anything.
          for remaining in akariko_by_id.values():
              out.extend(remaining)
          out.extend(akariko_no_id)

          text = '\n\n'.join(out).rstrip() + '\n'

          # Safety checks.
          forbidden = ['group-title="haruka1 ', 'group-title="haruka2 ', 'group-title="haruka3 ',
                       'ハルカ1', 'ハルカ2', 'ハルカ3', 'http://haru.charandom.blog/']
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit(f'cleanup validation failed; still present: {bad}')

          path.write_text(text, encoding='utf-8')
          print('updated:', path)
          print('bytes before:', len(original.encode('utf-8')))
          print('bytes after :', len(text.encode('utf-8')))

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one_time_haruka_akariko_cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi .github/workflows/one_time_haruka_akariko_cleanup.yml
          git diff --cached --check
          git commit -m "Update Haruka and Akariko entries for APTV"
          git push

name: Probe BOAT JLC Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "boat_jlc_inspect.py"
      - ".github/workflows/probe_boat_jlc_once.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect JLC live player
        run: python -u boat_jlc_inspect.py
      - name: Publish probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boat_jlc_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update one-shot BOAT JLC probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

name: Auto Generate Keirin EPG

on:
  schedule:
    # 1日5回実行 (JST: 09:00, 12:00, 17:00, 20:00, 24:00)
    # ※UTC時間で指定するため、JSTから9時間引いた時間を設定しています
    - cron: '0 0,3,8,11,15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG Script
        run: python generate_epg.py

      - name: Commit and Push epg.xml
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 毎回必ずタイムスタンプを更新してコミットさせる
          echo "<!-- Updated at $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S') -->" >> epg.xml
          git add epg.xml
          git commit -m "Auto update EPG [skip ci]"
          git push

name: Auto Generate Keirin EPG

on:
  schedule:
    - cron: '0 * * * *'  # 1時間おき
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG Script
        run: python generate_epg.py

      - name: Commit and Push epg.xml
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add epg.xml
          git commit -m "Auto update EPG [skip ci]" || echo "No changes to commit"
          git push

name: GCCX Actual Video Title Contact Sheets
# priority-round: 3, 2026-11-16

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_unknown_title_contact_sheets.py"
      - "gmcx_frame_priority_targets.json"
      - ".github/workflows/gmcx_unknown_title_contact_sheets.yml"

permissions:
  contents: read

concurrency:
  group: gmcx-unknown-actual-frame-review
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frame dependencies
        shell: bash
        run: |
          python -m pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Inspect actual frames across unknown GCCX recordings
        run: python -u gmcx_unknown_title_contact_sheets.py --focus-priorities --max-chunks 12 --budget-seconds 620
      - name: Keep frames for actual visual title identification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmcx-unknown-actual-title-frames
          path: gmcx_unknown_title_contact_frames/*
          if-no-files-found: warn

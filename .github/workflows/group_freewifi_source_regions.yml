name: Normalize FreeWiFi per-channel source order

on:
  push:
    paths:
      - group_freewifi_sources.py
      - .github/workflows/group_freewifi_source_regions.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize terrestrial, BS and CS per-channel source order
        run: |
          python group_freewifi_sources.py
          python tv/sync_freewifi.py

      - name: Sync canonical Rakuten Rch block
        run: python rakuten/sync_freewifi.py

      - name: Validate playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('freewifi').read_text(encoding='utf-8')
          assert s.startswith('#EXTM3U')
          assert '## 地上波' in s
          assert '## BS' in s
          assert '## その他' in s
          assert 'NHK東京・総合 (haruka(9394))' in s
          assert 'NHK東京・総合 (primehome)' in s
          assert '## Rch' in s
          assert 'Pigoo (haruka(9394))' in s
          assert 'haru.charandom.blog' not in s
          for cid in ('rch_30','rch_35','rch_37','rch_46','rch_86','rch_113','rch_122','rch_123','rch_124','rch_125','rch_41'):
              assert cid in s
          assert '## Rakuten-JP' not in s
          PY
          git diff --check

      - name: Commit normalized FreeWiFi playlist
        run: |
          if git diff --quiet -- tv/playlist.m3u freewifi; then
            echo "No freewifi changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/playlist.m3u freewifi
          git commit -m "Normalize FreeWiFi per-channel source order and Rch block [skip render]"
          git pull --rebase origin main
          git push

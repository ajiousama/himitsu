name: Normalize FreeWiFi terrestrial order

on:
  push:
    paths:
      - group_freewifi_sources.py
      - .github/workflows/group_freewifi_source_regions.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-freewifi-terrestrial
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize terrestrial channels and TVer specials
        run: python group_freewifi_sources.py

      - name: Validate playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('freewifi').read_text(encoding='utf-8')
          assert s.startswith('#EXTM3U')
          assert '## 地上波' in s
          assert '## BS' in s
          assert '## その他' in s
          assert 'NHK東京・総合 (haruka(9394))' in s
          assert 'NHK東京・総合 (blog)' in s
          assert 'NHK東京・総合 (primehome)' in s
          assert 'NHK東京・総合 (naori)' in s
          assert '### TVerﾘｱﾙﾀｲﾑ' in s
          PY
          git diff --check

      - name: Commit normalized FreeWiFi playlist
        run: |
          if git diff --quiet -- freewifi; then
            echo "No freewifi changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          git commit -m "Normalize FreeWiFi terrestrial channels"
          git push

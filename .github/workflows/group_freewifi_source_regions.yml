name: Normalize FreeWiFi per-channel source order

on:
  push:
    branches: [main]
    paths:
      - group_freewifi_sources.py
      - .github/workflows/group_freewifi_source_regions.yml
  workflow_dispatch:

permissions:
  contents: write

# Run the one-time source retirement independently of the slower full EPG builder.
concurrency:
  group: himitsu-haruka-source-retirement
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Retire HARUKA and Arva, normalize sources, and publish without racing other writers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "FreeWiFi source cleanup attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            python group_freewifi_sources.py
            python tv/sync_freewifi.py
            python rakuten/sync_freewifi.py

            python - <<'PY'
          from pathlib import Path
          s = Path('freewifi').read_text(encoding='utf-8')
          tv = Path('tv/playlist.m3u').read_text(encoding='utf-8')
          rch = Path('rakuten/playlist.m3u').read_text(encoding='utf-8')
          for filename, body in (('freewifi',s),('tv/playlist.m3u',tv),('rakuten/playlist.m3u',rch)):
              assert 'haruka' not in body.casefold(), f'HARUKA returned in {filename}'
              assert ':9394/stream/' not in body, f'old 9394 URL returned in {filename}'
          assert s.startswith('#EXTM3U')
          for section in ('## 地上波','## BS','## その他','## Rch'):
              assert section in s
          assert '（newblog系）' not in s
          assert 'newblog.vod.' not in s
          assert 'haru.charandom.blog' not in s
          yovi = Path('yovi').read_text(encoding='utf-8')
          assert 'haru.charandom.blog/stream/jp/' not in yovi, 'Retired HARU returned to yovi'
          assert '0i4neux01.charandom.blog/stream/jp/' not in yovi, 'Retired newblog returned to yovi'
          assert 'naori' not in s.casefold()
          assert 'arva' not in s.casefold()
          assert 'arva' not in tv.casefold()
          # Keep approved YoiTV terrestrial/BS backups alongside 5002 and Sinori.
          assert s.count('group-title="地上波 YoiTV"') == 14, 'Terrestrial YoiTV sources lost'
          assert s.count('group-title="BS YoiTV"') == 18, 'BS YoiTV sources lost'
          assert s.count('group-title="CS YoiTV"') == 17, 'Approved CS YoiTV sources changed'
          assert 'サンテレビ (5002直)' in s, 'Required PrimeHome/5002 station missing'
          for cid in ('rch_30','rch_35','rch_37','rch_46','rch_86','rch_113','rch_122','rch_123','rch_124','rch_125','rch_41'):
              assert cid in s
          assert '## Rakuten-JP' not in s
          print('HARUKA and Arva removed from published/canonical lists; source ordering validated')
          PY
            git diff --check
            git add freewifi yovi tv/playlist.m3u rakuten/playlist.m3u
            if git diff --cached --quiet; then
              echo "FreeWiFi sources already cleaned"
              exit 0
            fi
            git commit -m "Retire HARUKA and Arva from FreeWiFi sources [skip ci] [skip render]"
            if git push origin HEAD:main; then
              echo "FreeWiFi source cleanup published"
              exit 0
            fi
            echo "Main moved; refreshing before retry"
            sleep 3
          done
          echo "Unable to publish FreeWiFi source cleanup" >&2
          exit 1

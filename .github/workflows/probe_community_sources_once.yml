name: Probe Community Radio Sources Once

on:
  push:
    paths:
      - ".github/workflows/probe_community_sources_once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q websocket-client

      - name: Probe ListenRadio and JCBA current sources
        shell: python
        run: |
          import json, os, subprocess, time, urllib.parse, urllib.request
          import websocket

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          def http_json(url, referer=None):
              h={'User-Agent':UA,'Accept':'application/json,*/*'}
              if referer: h['Referer']=referer
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode('utf-8','replace'))

          def run_ffmpeg(label, args):
              print(f'===== {label} =====')
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=45)
              print(p.stdout[-12000:])
              print('RETURN',p.returncode)
              return p.returncode==0

          # ListenRadio: obtain the current advertised HLS then try browser-like headers.
          lr=http_json('https://listenradio.jp/service/toppage.aspx?channelid=30063&devtype=ios','https://listenradio.jp/?ch=lr038')
          hls=(lr.get('Channel') or {}).get('ChannelHls')
          print('LISTENRADIO_HLS',hls)
          if hls:
              hls=hls.replace('http://','https://',1)
              run_ffmpeg('FMOTOKUNI',[
                  'ffmpeg','-hide_banner','-loglevel','info',
                  '-user_agent',UA,
                  '-headers','Referer: https://listenradio.jp/?ch=lr038\r\nOrigin: https://listenradio.jp\r\n',
                  '-i',hls,'-map','0:a:0','-t','8','-af','volumedetect','-f','null','-'
              ])

          # JCBA: official player asks select_stream for token/location, then opens
          # the returned WebSocket with listener.fmplapla.com subprotocol and sends token.
          for station in ('kyotoribingufm','fmradiobaribari'):
              print(f'===== JCBA {station} =====')
              q=urllib.parse.urlencode({'station':station,'channel':'0','quality':'high','burst':'5'})
              data=http_json('https://www.jcbasimul.com/api/select_stream?'+q,'https://www.jcbasimul.com/'+station+'/rawplayer')
              safe={k:v for k,v in data.items() if k not in ('token',)}
              print('SELECT_STREAM',safe,'TOKEN_LEN',len(str(data.get('token') or '')))
              if data.get('code')!=200:
                  continue
              location=data.get('location'); token=data.get('token')
              if not location or not token:
                  print('MISSING location/token'); continue
              try:
                  ws=websocket.create_connection(
                      location,
                      subprotocols=['listener.fmplapla.com'],
                      origin='https://www.jcbasimul.com',
                      cookie=None,
                      header=['User-Agent: '+UA],
                      timeout=12,
                  )
                  ws.send(token)
                  buf=bytearray(); deadline=time.time()+12
                  frames=0
                  while time.time()<deadline and len(buf)<2_000_000:
                      msg=ws.recv()
                      if isinstance(msg,bytes):
                          buf.extend(msg); frames+=1
                  ws.close()
                  fn=station+'.bin'
                  open(fn,'wb').write(buf)
                  print('WS_BYTES',len(buf),'FRAMES',frames,'HEAD',bytes(buf[:24]).hex())
                  run_ffmpeg('DECODE '+station,[
                      'ffmpeg','-hide_banner','-loglevel','info','-i',fn,
                      '-map','0:a:0','-t','8','-af','volumedetect','-f','null','-'
                  ])
              except Exception as e:
                  print('WS_ERROR',type(e).__name__,repr(e))

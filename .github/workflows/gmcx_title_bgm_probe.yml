name: GCCX Title BGM Comparison 357 367 377
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gmcx_title_bgm_probe.yml"

permissions:
  contents: read

jobs:
  compare-title-music:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure ffmpeg and numpy
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --quiet numpy
      - name: Compare actual GCCX #357 #367 #377 opening BGM
        run: python -u gmcx_title_bgm_probe.py
      - name: Upload read-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gccx-title-bgm-comparison-357-367-377
          path: gmcx_title_bgm_review.json
          if-no-files-found: warn

name: Update BOAT Auto v4

on:
  workflow_dispatch:
  schedule:
    # Recovery only. The active worker itself polls every minute and queues its successor.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "boat_auto_system.py"
      - "boat_playback.py"
      - "boat_publish.py"
      - "boat_worker.py"
      - "test_boat_auto_system.py"
      - "test_boat_reliability.py"
      - ".github/workflows/update_boat_auto.yml"

permissions:
  contents: write
  actions: write

# Cron/watchdog/dispatch overlaps never kill acquisition. A deliberate source
# change does restart the worker so fixes take effect immediately.
concurrency:
  group: himitsu-boat-auto-v3
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure playback decoder is installed
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Test acquisition, retention, race EPG and recovery
        run: python -m unittest -v test_boat_auto_system test_boat_reliability
      - name: Run BOAT acquisition continuously and hand over automatically
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python -u boat_worker.py

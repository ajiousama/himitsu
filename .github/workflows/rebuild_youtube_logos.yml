name: Rebuild unified YouTube logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "youtube_logo_rebuild.py"
      - "general_youtube_sources.json"
      - "general_youtube_sources_airports.json"
      - "general_youtube_sources_ports.json"
      - ".github/workflows/rebuild_youtube_logos.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Japanese fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10.0'

      - name: Rebuild every general YouTube logo from one design system
        run: python youtube_logo_rebuild.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -d logos/youtube/unified
          count=$(find logos/youtube/unified -maxdepth 1 -name 'yt_*.png' | wc -l)
          expected=$(python - <<'PY'
          import json
          from pathlib import Path
          ids=set()
          for name in ['general_youtube_sources.json','general_youtube_sources_airports.json','general_youtube_sources_ports.json']:
              p=Path(name)
              if not p.exists():
                  continue
              for item in json.loads(p.read_text(encoding='utf-8')):
                  cid=str(item.get('id',''))
                  if cid.startswith('youtube.'):
                      ids.add(cid)
          print(len(ids))
          PY
          )
          echo "generated=$count expected=$expected"
          test "$expected" -gt 0
          test "$count" -eq "$expected"
          grep -F '/logos/youtube/unified/' general_youtube.m3u >/dev/null
          grep -F '/logos/youtube/unified/' freewifi >/dev/null
          ! grep -F 'tvg-logo="tvg-logo=' general_youtube.m3u
          ! grep -F 'tvg-logo="tvg-logo=' freewifi
          python - <<'PY'
          import json
          from pathlib import Path
          files=['general_youtube_sources.json','general_youtube_sources_airports.json','general_youtube_sources_ports.json']
          found=False
          for name in files:
              p=Path(name)
              if not p.exists(): continue
              for item in json.loads(p.read_text(encoding='utf-8')):
                  if item.get('id')=='youtube.ehime_ainan_ebc':
                      assert '/logos/youtube/unified/' in item.get('logo','')
                      found=True
          assert found, 'Ainan source missing'
          PY

      - name: Publish without overwriting newer FreeWiFi state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python youtube_logo_rebuild.py
            git add logos/youtube/unified general_youtube_sources.json general_youtube_sources_airports.json general_youtube_sources_ports.json general_youtube.m3u freewifi kana_tube_update.py
            if git diff --cached --quiet; then
              echo "YouTube logos already current"
              exit 0
            fi
            git commit -m "Rebuild all YouTube logos with unified dark-safe design [skip ci]"
            if git push origin HEAD:main; then
              echo "Published unified YouTube logos"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Failed to publish unified YouTube logos"
          exit 1

name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test Vercel BOAT resolver as cloud seed source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://himitsu-six.vercel.app/api/boat?debug=1&venue='
          hits=0
          for jcd in ('01','03','04','07','09','11','13','16','22','24'):
              try:
                  req=urllib.request.Request(base+jcd, headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data=json.loads(r.read().decode('utf-8','replace'))
                  hit=data.get('hit') or {}
                  print(jcd, 'ok=', data.get('ok'), 'source=', hit.get('source'), 'date=', hit.get('date'), 'url=', str(hit.get('url') or '')[:160])
                  if data.get('ok') and hit.get('url'):
                      hits += 1
              except Exception as e:
                  print(jcd, type(e).__name__, e)
          print('VERCEL_BOAT_HITS=', hits)
          if hits == 0:
              raise SystemExit(1)
          PY

name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect official BOATCAST live app for Streaks access path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, re, urllib.error, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          PAGE='https://race.boatcast.jp/?jo=01'
          code='01kiryu'
          ymd=datetime.datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y%m%d')
          playback=f'https://playback.api.streaks.jp/v1/projects/cp-boatrace-prod/medias/ref:lm-br-{code}-tokyo-{ymd}?audio_only=false'

          def get(url, extra=None, timeout=12):
              h={'User-Agent':UA,'Accept':'*/*','Referer':PAGE}
              if extra: h.update(extra)
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status, r.headers.get('content-type',''), r.read(), r.geturl()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get('content-type',''), e.read(), url

          s,ct,b,final=get(PAGE)
          print('BOATCAST_PAGE',s,ct,'BYTES',len(b),'HOST',urllib.parse.urlsplit(final).hostname)
          text=b.decode('utf-8','replace') if s==200 else ''
          blobs=[(final,text)] if text else []
          assets=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
              u=urllib.parse.urljoin(final,m.group(1))
              if u not in assets: assets.append(u)
          for m in re.finditer(r'<iframe[^>]+src=["\']([^"\']+)',text,re.I):
              print('IFRAME_HOST',urllib.parse.urlsplit(urllib.parse.urljoin(final,m.group(1))).hostname)
          print('SCRIPT_ASSETS',len(assets))
          for u in assets[:30]:
              s,ct,b,_=get(u,timeout=15)
              print('ASSET',urllib.parse.urlsplit(u).hostname,urllib.parse.urlsplit(u).path[-90:],'STATUS',s,'BYTES',len(b))
              if s==200 and len(b)<8_000_000:
                  blobs.append((u,b.decode('utf-8','replace')))

          candidates=[]
          project_hits=set()
          for url,src in blobs:
              low=src.lower()
              if 'streaks' in low or 'cp-boatrace-prod' in low:
                  print('STREAKS_REFERENCE_IN',urllib.parse.urlsplit(url).path or '/')
              for m in re.finditer(r'https://players\.streaks\.jp/([\w-]+)/([A-Za-z0-9_-]{16,128})/index\.html',src,re.I):
                  project_hits.add(m.group(1)); candidates.append(m.group(2))
              for m in re.finditer(r'(?i)(?:api[_-]?key|x-streaks-api-key)[^A-Za-z0-9]{0,30}["\']?([A-Za-z0-9_-]{16,128})',src):
                  candidates.append(m.group(1))
              if 'streaks' in low:
                  for v in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{24,64}(?![0-9a-fA-F])',src):
                      candidates.append(v)
          candidates=list(dict.fromkeys(candidates))
          print('PROJECT_HINTS',sorted(project_hits))
          print('KEY_CANDIDATES',len(candidates))

          base_headers={'User-Agent':UA,'Origin':'https://front.player.boatrace-cdn.jp','Referer':'https://front.player.boatrace-cdn.jp/','Accept':'application/json'}
          s,ct,b,_=get(playback,base_headers)
          print('PLAYBACK_NO_KEY',s,'BYTES',len(b))
          for i,key in enumerate(candidates[:100],1):
              s,ct,b,_=get(playback,{**base_headers,'X-Streaks-Api-Key':key},timeout=8)
              if s!=403:
                  found=False
                  try:
                      d=json.loads(b.decode('utf-8','replace'))
                      found=any(isinstance(x,dict) and str(x.get('src','')).startswith('https://manifest.streaks.jp/') for x in (d.get('sources') or []))
                  except Exception: pass
                  print('KEY_TEST_NON403',i,'STATUS',s,'HLS',found,'BYTES',len(b))
                  if found:
                      print('CLOUD_SEED_WITH_BOATCAST_KEY=YES')
                      raise SystemExit(0)
          print('CLOUD_SEED_WITH_BOATCAST_KEY=NO')
          PY

name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Discover BOAT player API-key path without logging credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, re, urllib.error, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          BASE='https://front.player.boatrace-cdn.jp/'
          code='01kiryu'
          ymd=datetime.datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y%m%d')
          playback=f'https://playback.api.streaks.jp/v1/projects/cp-boatrace-prod/medias/ref:lm-br-{code}-tokyo-{ymd}?audio_only=false'
          base_headers={'User-Agent':UA,'Origin':BASE.rstrip('/'),'Referer':BASE,'Accept':'*/*'}

          def get(url, extra=None, timeout=10):
              h=dict(base_headers)
              if extra: h.update(extra)
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status, r.headers.get('content-type',''), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get('content-type',''), e.read()

          assets=[]
          blobs=[]
          for path in ('','index.html'):
              url=urllib.parse.urljoin(BASE,path)
              s,ct,b=get(url)
              print('FRONT',url,'STATUS',s,'TYPE',ct,'BYTES',len(b))
              if s==200:
                  text=b.decode('utf-8','replace')
                  blobs.append((url,text))
                  for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
                      u=urllib.parse.urljoin(url,m.group(1))
                      if urllib.parse.urlsplit(u).hostname=='front.player.boatrace-cdn.jp' and u not in assets:
                          assets.append(u)
          print('SCRIPT_ASSETS',len(assets))
          for u in assets[:15]:
              s,ct,b=get(u,timeout=12)
              print('ASSET',urllib.parse.urlsplit(u).path,'STATUS',s,'BYTES',len(b))
              if s==200 and len(b)<5_000_000:
                  blobs.append((u,b.decode('utf-8','replace')))

          # Search public player code for credential-looking literals, but never print them.
          candidates=[]
          for url,text in blobs:
              if 'streaks' in text.lower() or 'api-key' in text.lower() or 'apikey' in text.lower():
                  print('STREAKS_REFERENCE_IN',urllib.parse.urlsplit(url).path or '/')
              for m in re.finditer(r'(?i)(?:api[_-]?key|x-streaks-api-key)[^A-Za-z0-9]{0,20}["\']?([A-Za-z0-9_-]{16,128})',text):
                  v=m.group(1)
                  if v not in candidates: candidates.append(v)
              # Also consider long hex literals only if the surrounding file mentions streaks.
              if 'streaks' in text.lower():
                  for v in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{24,64}(?![0-9a-fA-F])',text):
                      if v not in candidates: candidates.append(v)
          print('KEY_CANDIDATES',len(candidates))

          s,ct,b=get(playback)
          print('PLAYBACK_NO_KEY',s,'BYTES',len(b))
          for i,key in enumerate(candidates[:80],1):
              s,ct,b=get(playback,{'X-Streaks-Api-Key':key},timeout=8)
              if s!=403:
                  found=False
                  try:
                      d=json.loads(b.decode('utf-8','replace'))
                      found=any(isinstance(x,dict) and str(x.get('src','')).startswith('https://manifest.streaks.jp/') for x in (d.get('sources') or []))
                  except Exception: pass
                  print('KEY_TEST_NON403',i,'STATUS',s,'HLS',found,'BYTES',len(b))
                  if found:
                      print('CLOUD_SEED_WITH_PUBLIC_PLAYER_KEY=YES')
                      raise SystemExit(0)
          print('CLOUD_SEED_WITH_PUBLIC_PLAYER_KEY=NO')
          PY

name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Extract BOATCAST live API endpoint candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          base='https://race.boatcast.jp/'
          url=base+'assets/js/main.js'
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':base+'?jo=01','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=15) as r:
              js=r.read().decode('utf-8','replace')
          print('MAIN_JS_BYTES',len(js))

          # Print URL/path literals and nearby call sites, while redacting long token-like material.
          def safe(s):
              s=re.sub(r'(?i)(token|secret|api[_-]?key)(.{0,15})[A-Za-z0-9_-]{16,}',r'\1\2<redacted>',s)
              s=re.sub(r'(?<![A-Za-z0-9])[A-Fa-f0-9]{32,}(?![A-Za-z0-9])','<hex-redacted>',s)
              return s.replace('\n',' ')[:500]

          hosts=set()
          for m in re.finditer(r'https?://[^"\'`\\\s]+',js):
              u=m.group(0)
              try: hosts.add(urllib.parse.urlsplit(u).hostname or '')
              except: pass
          print('HOSTS',sorted(x for x in hosts if x))

          strings=[]
          for m in re.finditer(r'(["\'`])(.{1,240}?)\1',js):
              s=m.group(2)
              low=s.lower()
              if any(k in low for k in ('/api','api/','live','stream','movie','video','player','manifest','m3u8','race','jo=')):
                  if s not in strings: strings.append(s)
          print('INTERESTING_STRING_COUNT',len(strings))
          for s in strings[:160]:
              print('STR',safe(s))

          for term in ('fetch(', 'axios', 'XMLHttpRequest', '.ajax', '/api/', 'live', 'stream', 'movie', 'player'):
              pos=0; n=0
              while n<20:
                  i=js.lower().find(term.lower(),pos)
                  if i<0: break
                  print('CTX',term,safe(js[max(0,i-180):i+320]))
                  pos=i+len(term); n+=1
          PY

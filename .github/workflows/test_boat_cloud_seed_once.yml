name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test all official BOAT live media refs from cloud
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.error, urllib.request
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          setting='https://front.player.boatrace-cdn.jp/setting/live/01kiryu/setting.json'
          player='https://front.player.boatrace-cdn.jp/player/live?service=boatcast&stadium=01kiryu&sourceType=mix&dvr=1&audioMode=0&autoplay=1&bitrate=low'
          headers={'User-Agent':UA,'Origin':'https://front.player.boatrace-cdn.jp','Referer':player,'Accept':'application/json,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return r.status,r.read()
              except urllib.error.HTTPError as e: return e.code,e.read()
          s,b=get(setting)
          print('SETTING',s,'BYTES',len(b))
          data=json.loads(b.decode('utf-8','replace')) if s==200 else {}
          refs=[]
          def walk(x,path='root'):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}'
                      if k=='ref_id' and isinstance(v,str): refs.append((p,v))
                      else: walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(data)
          print('REF_COUNT',len(refs))
          ok=0
          for path,ref in refs:
              url='https://playback.api.streaks.jp/v1/projects/cp-boatrace-prod/medias/ref:'+ref+'?audio_only=false'
              ss,bb=get(url)
              hls=False
              try:
                  d=json.loads(bb.decode('utf-8','replace'))
                  hls=any(isinstance(x,dict) and '.m3u8' in str(x.get('src','')) for x in (d.get('sources') or []))
              except Exception: pass
              print('REF',path,ref,'STATUS',ss,'HLS',hls,'BYTES',len(bb))
              if ss==200 and hls: ok+=1
          print('CLOUD_REF_HITS',ok)
          PY

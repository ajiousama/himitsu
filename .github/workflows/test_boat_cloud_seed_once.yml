name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Trace BOAT bundled Streaks default key expression safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, re, urllib.request
          u='https://front.player.boatrace-cdn.jp/lib/streaks/2.5.8/streaksplayer.min.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://front.player.boatrace-cdn.jp/player/live?service=boatcast&stadium=01kiryu'})
          js=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')

          def scrub(s):
              def q(m):
                  v=m.group(2)
                  if len(v)<=10 and not re.search(r'[A-Za-z0-9]{8,}',v):
                      return m.group(1)+v+m.group(1)
                  return f'<q:{len(v)}:{hashlib.sha256(v.encode()).hexdigest()[:8]}>'
              s=re.sub(r'(["\'])(.*?)(?<!\\)\1',q,s)
              return s.replace('\n',' ')[:1400]

          hits=[m.start() for m in re.finditer(r'\bWa\b',js)]
          print('WA_OCCURRENCES',len(hits))
          for i,p in enumerate(hits[:30],1):
              print('WA_CTX',i,scrub(js[max(0,p-700):p+700]))
          site=js.find('e.apiKey=e.apiKey||Wa')
          print('DEFAULT_SITE',site)
          if site>=0:
              # Walk backward to the nearest declaration separator and show syntax only.
              print('DEFAULT_PRECEDING',scrub(js[max(0,site-5000):site+250]))
          PY

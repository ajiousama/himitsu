name: Test BOAT cloud seed once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_boat_cloud_seed_once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe BOAT HLS through media segments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          PLAYER = 'https://front.player.boatrace-cdn.jp/player/live?service=boatcast&stadium=07gamagori&sourceType=mix&dvr=1&audioMode=0&autoplay=1&bitrate=low'
          HEADERS = {'User-Agent': UA, 'Accept': '*/*', 'Origin': 'https://front.player.boatrace-cdn.jp', 'Referer': PLAYER}

          def get(url, limit=400000, extra=None):
              headers = dict(HEADERS)
              if extra:
                  headers.update(extra)
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return int(getattr(r, 'status', 200)), r.read(limit), r.geturl(), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return int(e.code), e.read(limit), e.geturl(), dict(e.headers)
              except Exception as e:
                  return 0, (type(e).__name__ + ':' + str(e)).encode(), url, {}

          def safe(url):
              p = urllib.parse.urlsplit(url)
              return p.scheme + '://' + (p.hostname or '') + p.path

          status, body, _final, _headers = get('https://himitsu-six.vercel.app/api/boat-seed?venue=07')
          data = json.loads(body.decode('utf-8', 'replace')) if status == 200 else {}
          master_url = str(data.get('url') or '')
          print('SEED status=', status, 'ok=', data.get('ok'), 'region=', data.get('region'), 'has_url=', bool(master_url))
          if not master_url:
              raise SystemExit(1)

          status, body, final, headers = get(master_url)
          master = body.decode('utf-8', 'replace')
          print('MASTER status=', status, 'playlist=', master.startswith('#EXTM3U'), 'bytes=', len(body),
                'ctype=', headers.get('Content-Type', ''), 'final=', safe(final))
          print('MASTER_TAGS', ' | '.join(line for line in master.splitlines() if line.startswith('#EXT-X-'))[:1800])

          uris = []
          for line in master.splitlines():
              line = line.strip()
              if line and not line.startswith('#'):
                  uris.append(urllib.parse.urljoin(final, line))
              for value in re.findall(r'URI="([^"]+)"', line):
                  uris.append(urllib.parse.urljoin(final, value))
          unique = []
          for url in uris:
              if url not in unique:
                  unique.append(url)
          print('MASTER_CHILDREN', len(unique))

          segment_ok = 0
          for idx, child in enumerate(unique[:10], 1):
              cs, cb, cf, ch = get(child)
              is_playlist = cb.lstrip().startswith(b'#EXTM3U')
              print('CHILD', idx, 'status=', cs, 'playlist=', is_playlist, 'bytes=', len(cb),
                    'ctype=', ch.get('Content-Type', ''), 'url=', safe(child))
              if not is_playlist:
                  if cs in (200, 206) and len(cb):
                      segment_ok += 1
                  continue
              playlist = cb.decode('utf-8', 'replace')
              nested = []
              for line in playlist.splitlines():
                  line = line.strip()
                  if line and not line.startswith('#'):
                      nested.append(urllib.parse.urljoin(cf, line))
                  for value in re.findall(r'URI="([^"]+)"', line):
                      nested.append(urllib.parse.urljoin(cf, value))
              print('CHILD_TAGS', idx, ' | '.join(line for line in playlist.splitlines() if line.startswith('#EXT-X-'))[:1200])
              for nested_url in nested[:3]:
                  ns, nb, _nf, nh = get(nested_url, limit=120000, extra={'Range': 'bytes=0-119999'})
                  print('MEDIA', idx, 'status=', ns, 'bytes=', len(nb), 'ctype=', nh.get('Content-Type', ''),
                        'url=', safe(nested_url))
                  if ns in (200, 206) and len(nb):
                      segment_ok += 1
          print('SEGMENT_OK', segment_ok)
          if status != 200 or not master.startswith('#EXTM3U') or segment_ok == 0:
              raise SystemExit(1)
          PY

name: Check yovi streams
# trigger 2026-10-01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check_yovi.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Check all yovi streams
        run: python check_yovi.py

      - name: Commit refreshed markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yovi yovi_check_result.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh yovi live stream markers"
            git push
          fi

name: Test KICK VOD Direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test_kick_vod_direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe known GCCX VOD directly
        shell: bash
        run: |
          set -euo pipefail
          VOD='a41d4c7e-4cde-4dd7-8e83-7852d817ad1e'
          API="https://kick.com/api/v1/video/$VOD"
          curl -fL --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Referer: https://kick.com/' \
            "$API" -o /tmp/vod.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/vod.json'))
          def find(v):
              if isinstance(v,str) and v.startswith(('http://','https://')) and '.m3u8' in v:
                  return v
              if isinstance(v,dict):
                  for k in ('source','playback_url','playbackUrl','hls_url','hlsUrl','stream_url','streamUrl'):
                      if k in v:
                          x=find(v[k])
                          if x:return x
                  for x0 in v.values():
                      x=find(x0)
                      if x:return x
              if isinstance(v,list):
                  for x0 in v:
                      x=find(x0)
                      if x:return x
              return None
          src=find(data)
          if not src: raise SystemExit('NO_M3U8')
          open('/tmp/source.txt','w').write(src)
          print('SOURCE_FOUND=1')
          print('SOURCE_HOST='+src.split('/')[2])
          PY
          SRC=$(cat /tmp/source.txt)
          curl -fL --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0' -H 'Referer: https://kick.com/' \
            "$SRC" -o /tmp/source.m3u8
          grep -q '^#EXTM3U' /tmp/source.m3u8
          echo "HLS_OK=1"
          echo '--- HLS HEAD ---'
          head -n 20 /tmp/source.m3u8

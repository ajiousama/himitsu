name: Update GCH Free EPG（ajiousama単独）

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jra_epg_merge.py'
      - 'public_sports_epg_local.xml'
      - '.github/workflows/update_gch_free_epg.yml'
  schedule:
    - cron: '10,25,40,55 * * * *'

permissions:
  contents: write

concurrency:
  group: himitsu-gch-epg-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Merge persisted local JRA EPG safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "GCH local EPG publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -s public_sports_epg_local.xml ]; then
              echo 'Local public sports EPG has not been generated yet; main FreeWiFi workflow will create it.'
              exit 0
            fi

            python jra_epg_merge.py

            python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in ('public_sports_epg_local.xml', 'guides.xml'):
              if not Path(path).is_file() or Path(path).stat().st_size == 0:
                  raise SystemExit(f'{path} missing or empty')
              ET.parse(path)

          guides = ET.parse('guides.xml').getroot()
          for cid in ('jra.east', 'jra.west', 'jra.hokkaido'):
              src = [p for p in ET.parse('public_sports_epg_local.xml').getroot().findall('programme') if p.get('channel') == cid]
              dst = [p for p in guides.findall('programme') if p.get('channel') == cid]
              if src and not dst:
                  raise SystemExit(f'{cid}: local EPG exists but guides merge is empty')

          a = [p for p in guides.findall('programme') if p.get('channel') == 'jra.official']
          b = [p for p in guides.findall('programme') if p.get('channel') == 'jra.gch.free']
          print(f'GCH local merge: A={len(a)} B={len(b)}')
          if len(b) > 3:
              raise SystemExit(f'B programme count must be 0..3, got {len(b)}')
          PY

            git add guides.xml
            if git diff --cached --quiet; then
              echo 'GCH EPG already current'
              exit 0
            fi

            git commit -m 'Update GCH from ajiousama local EPG [skip ci]'
            if git push origin HEAD:main; then
              echo 'GCH local EPG published successfully'
              exit 0
            fi

            echo '::warning::main moved during GCH publish; rebuilding from latest main'
            sleep 2
          done

          echo '::error::Failed to publish GCH local EPG after 3 attempts'
          exit 1

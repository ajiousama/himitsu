name: Probe official race VOD player
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_race_vod.yml'
      - 'ganble/race_vod/probe_public_player.py'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check public player without changing playlists
        run: |
          python3 ganble/race_vod/probe_public_player.py | tee ganble/race_vod/probe_result.json
      - name: Save diagnostic result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ganble/race_vod/probe_result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record isolated race VOD probe result'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

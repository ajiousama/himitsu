name: Validate FreeWiFi YouTube logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'general_youtube_sources.json'
      - 'logos/youtube/**'
      - '.github/workflows/update_livecamera_logos.yml'

permissions:
  contents: read

concurrency:
  group: himitsu-livecamera-logo-validator
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate adopted 01-74 artwork
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          src=json.loads(Path('general_youtube_sources.json').read_text(encoding='utf-8'))
          numbered=[]
          kana=[]
          for item in src:
              cid=str(item.get('id') or '')
              if not cid.startswith('youtube.'):
                  continue
              logo=str(item.get('logo') or '')
              if cid == 'youtube.kana_tube':
                  kana.append((cid,logo))
                  continue
              m=re.search(r'/logos/youtube/(yt_(\d{2})_[^/]+\.png)$',logo)
              if not m:
                  raise SystemExit(f'bad numbered logo mapping: {cid} -> {logo}')
              numbered.append((int(m.group(2)),cid,m.group(1)))

          if len(numbered) != 74:
              raise SystemExit(f'expected 74 numbered YouTube logos, got {len(numbered)}')
          nums=sorted(n for n,_,_ in numbered)
          if nums != list(range(1,75)):
              raise SystemExit(f'numbering mismatch: {nums}')
          if kana != [('youtube.kana_tube','https://raw.githubusercontent.com/ajiousama/himitsu/main/logos/youtube/kana_tube.png')]:
              raise SystemExit(f'Kana must stay unnumbered: {kana}')

          for _,cid,name in numbered:
              p=Path('logos/youtube')/name
              if not p.exists() or p.stat().st_size < 1000:
                  raise SystemExit(f'missing/small logo: {cid} -> {p}')

          for p in map(Path,['general_youtube_sources.json','general_youtube.m3u','freewifi','kana_tube.m3u']):
              if p.exists() and 'yt43_' in p.read_text(encoding='utf-8-sig',errors='replace'):
                  raise SystemExit(f'legacy yt43 reference remains: {p}')

          print('YouTube artwork OK: 01-74 + unnumbered Kana; no regeneration performed')
          PY

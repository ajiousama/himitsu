name: Build unified YouTube and Ehime CATV logos

on:
  workflow_dispatch:
  push:
    paths:
      - 'youtube_logo_rebuild.py'
      - 'generate_ehime_catv_logos.py'
      - 'generate_livecamera_logos.py'
      - 'general_youtube_sources.json'
      - 'general_youtube_sources_ports.json'
      - 'general_youtube_sources_airports.json'
      - 'logos/ehime_catv/**'
      - '.github/workflows/update_livecamera_logos.yml'

permissions:
  contents: write

concurrency:
  group: himitsu-livecamera-logo-writer
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install logo dependencies
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Rebuild illustrated unified YouTube logos
        run: python youtube_logo_rebuild.py

      - name: Rebuild Ehime CATV Ainan logo
        run: python generate_ehime_catv_logos.py

      - name: Validate unified assets
        shell: bash
        run: |
          set -euo pipefail
          count=$(find logos/youtube/unified -maxdepth 1 -type f -name 'yt_*.png' | wc -l)
          test "$count" -gt 0
          test -s logos/ehime_catv/14_ainan_livecam.png
          test -s logos/ehime_catv/14_ainan_livecam_v2.png
          grep -F '/logos/youtube/unified/' general_youtube.m3u >/dev/null
          grep -F '/logos/youtube/unified/' freewifi >/dev/null
          ! grep -Eq 'tvg-logo="[^"]*/logos/youtube/yt43_' general_youtube.m3u
          ! grep -Eq 'tvg-logo="[^"]*/logos/youtube/yt43_' freewifi

      - name: Commit unified logos and mappings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A logos/youtube/unified logos/ehime_catv general_youtube_sources.json general_youtube_sources_ports.json general_youtube_sources_airports.json general_youtube.m3u freewifi kana_tube_update.py
          if git diff --cached --quiet; then
            echo 'Unified YouTube / Ehime CATV logos already current'
            exit 0
          fi
          git commit -m 'Keep YouTube illustrated unified logos and Ehime CATV logos'
          git pull --rebase origin main
          git push origin main

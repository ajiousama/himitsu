name: Build FreeWiFi Live-Camera Logos

on:
  workflow_dispatch:
  push:
    paths:
      - 'generate_livecamera_logos.py'
      - 'apply_livecamera_logos.py'
      - 'general_youtube_sources.json'
      - 'general_youtube_sources_ports.json'
      - 'general_youtube_sources_airports.json'
      - '.github/workflows/update_livecamera_logos.yml'

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install logo dependencies
        run: |
          python -m pip install --upgrade pillow yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Generate canonical yt43 logos
        run: python generate_livecamera_logos.py

      - name: Apply canonical logos to current playlists
        run: python apply_livecamera_logos.py

      - name: Validate canonical yt43 series
        shell: bash
        run: |
          set -e
          for n in $(seq 44 70); do
            f=$(find logos/youtube -maxdepth 1 -type f -name "yt43_${n}_*.png" | head -1)
            test -n "$f"
            test -s "$f"
            python - "$f" <<'PY'
          from PIL import Image
          import sys
          with Image.open(sys.argv[1]) as im:
              assert im.size == (418, 418), (sys.argv[1], im.size)
          PY
          done
          ! grep -Eq 'yt54_(44|45|46)_' general_youtube_sources.json
          ! grep -Eq 'logos/youtube/airport_[^\"]+\.png' general_youtube_sources_airports.json
          ! grep -Eq 'logos/youtube/ehime_[^\"]+\.png' general_youtube_sources_ports.json
          grep -q '## Rakuten-JP' freewifi

      - name: Remove superseded add-on logo files
        shell: bash
        run: |
          rm -f logos/youtube/yt54_44_maiko_villa_akashi.png
          rm -f logos/youtube/yt54_45_tokyo_dome_city.png
          rm -f logos/youtube/yt54_46_shinhotaka_ropeway.png
          rm -f logos/youtube/airport_*.png
          rm -f logos/youtube/ehime_port_*.png
          rm -f logos/youtube/ehime_kuma_skiland.png
          rm -f logos/youtube/ehime_saragamine.png
          rm -f logos/youtube/ehime_omogo_ishizuchi.png
          rm -f logos/youtube/ehime_ainan_ebc.png
          rm -f logos/youtube/ehime_dogo_honkan.png

      - name: Commit canonical logos and mappings
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A logos/youtube general_youtube_sources.json general_youtube_sources_ports.json general_youtube_sources_airports.json general_youtube.m3u freewifi
          if git diff --cached --quiet; then
            echo 'No logo changes'
            exit 0
          fi
          git commit -m 'Unify FreeWiFi YouTube logos as yt43 series'
          git pull --rebase origin main
          git push origin main

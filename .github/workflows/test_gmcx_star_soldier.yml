name: GCCX Star Soldier and Year-End SP49 Cut Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_gmcx_star_soldier.yml"
      - "test_gmcx_star_soldier_insert.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify both inserted GCCX specials and #392-396 timings
        run: python -m unittest -v test_gmcx_star_soldier_insert.py

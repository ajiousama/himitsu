name: GCCX Star Soldier Cut Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_gmcx_star_soldier.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify DVD-BOX21 special and consecutive chapter timings
        run: python -m unittest -v test_gmcx_star_soldier_insert.py

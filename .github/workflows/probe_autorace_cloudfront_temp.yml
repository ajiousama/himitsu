name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Wayback exact manifest patterns
        shell: bash
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          hosts={'川口':'d1liritc3ayfk5.cloudfront.net','伊勢崎':'d1y1a3qyv8xfur.cloudfront.net','山陽':'d24g41mr42kxdj.cloudfront.net'}
          for venue,host in hosts.items():
              params={'url':host+'/out/v1/*/index.m3u8','output':'json','fl':'original,timestamp,statuscode','filter':'statuscode:200','collapse':'urlkey','limit':'100'}
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              print('\n===',venue,url,'===')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=35) as r: txt=r.read().decode('utf-8','replace')
                  print(txt[:20000])
                  pat=re.compile(r'https?://'+re.escape(host)+r'/out/v1/[0-9a-f]{32}/index\.m3u8',re.I)
                  print('MATCHES',sorted(set(pat.findall(txt))))
              except Exception as e: print('ERR',repr(e))
          PY

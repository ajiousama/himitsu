name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search public URL archives
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request

          HOSTS = {
              '川口': 'd1liritc3ayfk5.cloudfront.net',
              '伊勢崎': 'd1y1a3qyv8xfur.cloudfront.net',
              '山陽': 'd24g41mr42kxdj.cloudfront.net',
          }
          UA={'User-Agent':'Mozilla/5.0'}

          def get(url, timeout=30):
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode('utf-8','replace')

          for venue, host in HOSTS.items():
              print('\n===', venue, host, '===')
              found=[]
              pat=re.compile(r'https?://'+re.escape(host)+r'/out/v1/[0-9a-f]{32}/index\.m3u8(?:\?[^\"\'\s<>]*)?',re.I)

              # URLScan search API and result JSONs.
              try:
                  q=urllib.parse.quote('domain:'+host)
                  data=json.loads(get(f'https://urlscan.io/api/v1/search/?q={q}&size=100'))
                  blob=json.dumps(data, ensure_ascii=False).replace('\\/','/')
                  for u in pat.findall(blob):
                      if u not in found: found.append(u)
                  for item in data.get('results',[])[:50]:
                      api=item.get('_links',{}).get('self') or ('https://urlscan.io/api/v1/result/'+item.get('_id','')+'/')
                      if not api: continue
                      try:
                          b=get(api,20).replace('\\/','/')
                          for u in pat.findall(b):
                              if u not in found: found.append(u)
                      except Exception: pass
              except Exception as e:
                  print('urlscan error:',repr(e))

              # Wayback CDX.
              try:
                  u='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({
                      'url':host+'/out/v1/*','output':'json','fl':'original','filter':'statuscode:200','collapse':'urlkey','limit':'5000'
                  })
                  b=get(u,40).replace('\\/','/')
                  for x in pat.findall(b):
                      if x not in found: found.append(x)
              except Exception as e:
                  print('wayback error:',repr(e))

              # Common Crawl newest indexes.
              try:
                  cols=json.loads(get('https://index.commoncrawl.org/collinfo.json',30))[:8]
                  for col in cols:
                      api=col.get('cdx-api')
                      if not api: continue
                      try:
                          u=api+'?'+urllib.parse.urlencode({'url':host+'/out/v1/*','output':'json','filter':'status:200'})
                          b=get(u,40).replace('\\/','/')
                          for x in pat.findall(b):
                              if x not in found: found.append(x)
                      except Exception as e:
                          print('cc index error',col.get('id'),repr(e))
              except Exception as e:
                  print('commoncrawl error:',repr(e))

              print('FOUND',venue,len(found))
              for u in found:
                  print(u)

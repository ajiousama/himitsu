name: Apply verified Kawaguchi AutoRace CloudFront

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace Kawaguchi Akamai URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('freewifi')
          s=p.read_text(encoding='utf-8')
          old='https://autorace-live.akamaized.net/hls/live/2036917/id2/streaming/media.m3u8'
          new='https://d1liritc3ayfk5.cloudfront.net/out/v1/03398b6ae2364881930ef1c84291695b/index.m3u8'
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one Kawaguchi Akamai URL, found {n}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit FreeWiFi update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git diff --cached --quiet && exit 0
          git commit -m 'Switch Kawaguchi AutoRace to CloudFront [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

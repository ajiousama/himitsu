name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect AutoRace TV HTML and scripts
        shell: python
        run: |
          import re, urllib.parse, urllib.request
          BASE='https://sp.atrc.jp'
          PAGES=['/tv/','/tv/index/date/20261007/p1/2','/tv/index/date/20261007/p1/3','/tv/index/date/20261007/p1/6']
          UA={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'}
          def get(url,t=15):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=t) as r:
                  return r.geturl(),r.read().decode('utf-8','replace')
          seen=set(); texts=[]
          for p in PAGES:
              u=urllib.parse.urljoin(BASE,p)
              try:
                  final,html=get(u); print('\nPAGE',u,'=>',final,'LEN',len(html)); texts.append((final,html))
                  for line in html.splitlines():
                      low=line.lower()
                      if any(k in low for k in ['cloudfront','m3u8','video','movie','stream','iframe','live']): print('HTML',line[:1800])
                  for attr in re.findall(r'(?:src|href)=[\"\']([^\"\']+)',html,re.I):
                      x=urllib.parse.urljoin(final,attr)
                      if x not in seen and (x.endswith('.js') or '/js/' in x or 'movie' in x or 'video' in x or 'tv' in x):
                          seen.add(x)
              except Exception as e: print('PAGEERR',u,repr(e))
          print('\nASSETS',len(seen))
          for u in sorted(seen):
              print('ASSET',u)
              if not (u.endswith('.js') or '/js/' in u): continue
              try:
                  _,txt=get(u,10)
                  if any(k in txt.lower() for k in ['cloudfront','m3u8','stream','video']):
                      print('JSLEN',len(txt))
                      for m in re.findall(r'https?://[^\"\'\\\s<>]+',txt.replace('\\/','/')):
                          if 'cloudfront' in m or 'm3u8' in m: print('URL',m[:1200])
                      for line in txt.splitlines():
                          if any(k in line.lower() for k in ['cloudfront','m3u8','streamurl','video_url','movie_url']): print('JS',line[:1800])
              except Exception as e: print('ASSETERR',repr(e))

name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Kawaguchi urlscan records
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u,t=12):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=t) as r: return r.read().decode('utf-8','replace')
          host='d1liritc3ayfk5.cloudfront.net'
          q=urllib.parse.quote('domain:'+host)
          data=json.loads(get('https://urlscan.io/api/v1/search/?q='+q+'&size=100'))
          print('RESULTS',len(data.get('results',[])))
          allurls=[]
          for i,item in enumerate(data.get('results',[])[:30]):
              rid=item.get('_id'); print('\nSCAN',i,rid,'page=',item.get('page',{}).get('url'),'title=',item.get('page',{}).get('title'))
              if not rid: continue
              try: txt=get('https://urlscan.io/api/v1/result/'+rid+'/',12).replace('\\/','/')
              except Exception as e: print('ERR',repr(e)); continue
              urls=sorted(set(re.findall(r'https?://[^\"\'\\\s<>]+',txt)))
              for u in urls:
                  if 'cloudfront.net' in u and ('.m3u8' in u or '/out/v1/' in u):
                      print('CF',u[:1800])
                      if u not in allurls: allurls.append(u)
          print('\n=== ALL UNIQUE CLOUDFRONT STREAM URLS ===')
          for u in allurls: print(u)
          PY

name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Recover endpoint IDs from Wayback objects
        shell: bash
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          hosts={'川口':'d1liritc3ayfk5.cloudfront.net','伊勢崎':'d1y1a3qyv8xfur.cloudfront.net','山陽':'d24g41mr42kxdj.cloudfront.net'}
          UA={'User-Agent':'Mozilla/5.0'}
          for venue,host in hosts.items():
              params={'url':host+'/out/v1/*','output':'json','fl':'original','limit':'5'}
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              print('\n===',venue,url,'===')
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=25) as r: txt=r.read().decode('utf-8','replace')
                  print('CDX',txt[:12000])
                  ids=[]
                  for x in re.findall(r'/out/v1/([0-9a-f]{32})/',txt,re.I):
                      if x not in ids: ids.append(x)
                  print('IDS',ids)
                  for eid in ids:
                      m3u=f'https://{host}/out/v1/{eid}/index.m3u8'
                      print('CANDIDATE',m3u)
                      try:
                          rq=urllib.request.Request(m3u,headers=UA)
                          with urllib.request.urlopen(rq,timeout=12) as rr:
                              body=rr.read(1024).decode('utf-8','replace')
                              print('VERIFY',rr.status,rr.headers.get('content-type'),body[:300].replace('\n',' | '))
                      except Exception as e: print('VERIFYERR',repr(e))
              except Exception as e: print('CDXERR',repr(e))
          PY

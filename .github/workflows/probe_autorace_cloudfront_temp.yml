name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Search public URL intelligence index
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.request
          hosts={'川口':'d1liritc3ayfk5.cloudfront.net','伊勢崎':'d1y1a3qyv8xfur.cloudfront.net','山陽':'d24g41mr42kxdj.cloudfront.net'}
          UA={'User-Agent':'Mozilla/5.0'}
          for venue,host in hosts.items():
              print('\n===',venue,host,'===')
              url=f'https://otx.alienvault.com/api/v1/indicators/hostname/{host}/url_list?limit=500&page=1'
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=20) as r: txt=r.read().decode('utf-8','replace')
                  print('LEN',len(txt))
                  ids=sorted(set(re.findall(r'/out/v1/([0-9a-f]{32})/',txt,re.I)))
                  print('IDS',ids)
                  for eid in ids:
                      u=f'https://{host}/out/v1/{eid}/index.m3u8'
                      print('CANDIDATE',u)
                      try:
                          rq=urllib.request.Request(u,headers=UA)
                          with urllib.request.urlopen(rq,timeout=12) as rr:
                              body=rr.read(700).decode('utf-8','replace')
                              print('VERIFY',rr.status,rr.headers.get('content-type'),body[:220].replace('\n',' | '))
                      except Exception as e: print('VERIFYERR',repr(e))
              except Exception as e: print('OTXERR',repr(e))
          PY

name: Probe AutoRace CloudFront temp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_autorace_cloudfront_temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Search URL archives fast
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request
          HOSTS={'川口':'d1liritc3ayfk5.cloudfront.net','伊勢崎':'d1y1a3qyv8xfur.cloudfront.net','山陽':'d24g41mr42kxdj.cloudfront.net'}
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url, timeout=8):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read().decode('utf-8','replace')
          try:
              cols=json.loads(get('https://index.commoncrawl.org/collinfo.json',8))
              ccapi=cols[0].get('cdx-api') if cols else None
          except Exception as e:
              print('collinfo',repr(e)); ccapi=None
          for venue,host in HOSTS.items():
              print('\n===',venue,host,'===')
              pat=re.compile(r'https?://'+re.escape(host)+r'/out/v1/[0-9a-f]{32}/index\.m3u8(?:\?[^\"\'\s<>]*)?',re.I)
              found=[]
              def scan(text):
                  for u in pat.findall(text.replace('\\/','/')):
                      if u not in found: found.append(u)
              try:
                  q=urllib.parse.quote('domain:'+host)
                  data=json.loads(get('https://urlscan.io/api/v1/search/?q='+q+'&size=100',8))
                  scan(json.dumps(data,ensure_ascii=False))
                  for item in data.get('results',[])[:10]:
                      rid=item.get('_id')
                      if rid:
                          try: scan(get('https://urlscan.io/api/v1/result/'+rid+'/',5))
                          except Exception: pass
              except Exception as e: print('urlscan',repr(e))
              try:
                  q=urllib.parse.urlencode({'url':host+'/out/v1/*','output':'json','fl':'original','filter':'statuscode:200','collapse':'urlkey','limit':'1000'})
                  scan(get('https://web.archive.org/cdx/search/cdx?'+q,8))
              except Exception as e: print('wayback',repr(e))
              if ccapi:
                  try:
                      q=urllib.parse.urlencode({'url':host+'/out/v1/*','output':'json','filter':'status:200'})
                      scan(get(ccapi+'?'+q,8))
                  except Exception as e: print('cc',repr(e))
              print('FOUND',venue,len(found))
              for u in found: print(u)

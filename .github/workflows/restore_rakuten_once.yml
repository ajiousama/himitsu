name: Fix Rakuten preservation once

on:
  push:
    paths:
      - ".github/workflows/restore_rakuten_once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply permanent fix and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python repair_rakuten_once.py
          rm -f repair_rakuten_once.py
          rm -f .github/workflows/restore_rakuten_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve manual FreeWiFi entries and restore Rakuten"
          git pull --rebase origin main
          git push origin HEAD:main

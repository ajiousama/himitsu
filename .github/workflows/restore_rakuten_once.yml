name: Restore selected Rakuten channels once

on:
  push:
    paths:
      - '.github/workflows/restore_rakuten_once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore the two manually selected Rakuten entries
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('freewifi')
          s=p.read_text(encoding='utf-8-sig')
          if 'tvg-id="rch_30"' not in s:
              raise SystemExit('Rakuten railway anchor missing')
          add='''#EXTINF:-1 tvg-id="rch_98" tvg-name="セクシーエンタメチャンネル" tvg-logo="https://channel.rakuten.co.jp/service/img/logo/chlogo-with-number/239_sexyenterme.png",セクシーエンタメチャンネル
https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg01287-rakutentvjapan-rvariety-cmaf-rakutenjp/playlist.m3u8

#EXTINF:-1 tvg-id="rch_40" tvg-name="刺激ストロング" tvg-logo="https://channel.rakuten.co.jp/service/img/logo/chlogo-with-number/242_shigekistrong.png",刺激ストロング
https://cdn-apne1.tsv2.amagi.tv/linear/amg01287-rakutentvjapan-shigekicmaf-rakutenjp/playlist.m3u8
'''
          if 'tvg-id="rch_98"' not in s and 'tvg-id="rch_40"' not in s:
              marker='https://cdn-apne1.tsv2.amagi.tv/linear/amg01287-rakutentvjapan-tandtcmaf-rakutenjp/playlist.m3u8\n'
              if marker not in s:
                  raise SystemExit('Rakuten railway URL anchor missing')
              s=s.replace(marker, marker+'\n'+add, 1)
          elif 'tvg-id="rch_98"' not in s or 'tvg-id="rch_40"' not in s:
              raise SystemExit('Partial Rakuten state; refusing duplicate-prone repair')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'tvg-id="rch_30"' freewifi
          grep -q 'tvg-id="rch_98"' freewifi
          grep -q 'tvg-id="rch_40"' freewifi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore manually selected Rakuten channels'
          git pull --rebase origin main
          git push origin main

name: Discover Community Radio Streams Once

on:
  push:
    paths:
      - ".github/workflows/discover_community_streams_once.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deep inspect current player bundles
        shell: python
        run: |
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          def get(url, referer=None):
              h={'User-Agent':UA,'Accept':'*/*'}
              if referer: h['Referer']=referer
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.geturl(),r.read(3_000_000).decode('utf-8','replace')
          def contexts(label,text,pats):
              print('=====',label,'BYTES',len(text.encode()),'=====')
              for pat in pats:
                  start=0; n=0
                  while n<12:
                      p=text.lower().find(pat.lower(),start)
                      if p<0: break
                      print('CTX',pat,text[max(0,p-700):p+1800].replace('\n',' ')[:2500])
                      start=p+len(pat); n+=1
          # JCBA player bundles
          for url in [
              'https://www.jcbasimul.com/_next/static/chunks/pages/%5Bid%5D/rawplayer-bc624ad3af19187b.js',
              'https://www.jcbasimul.com/_next/static/chunks/177-f7d6e57a3011a9bd.js',
          ]:
              try:
                  final,text=get(url,'https://www.jcbasimul.com/kyotoribingufm/rawplayer')
                  contexts('JCBA '+final,text,['jcba-player','fetch(','axios','api/','stream','m3u8','station','channel','radimo','playlist'])
              except Exception as e: print('JCBA_ERR',url,type(e).__name__,repr(e))
          # ListenRadio main app bundle
          try:
              final,text=get('https://listenradio.jp/_astro/BaseLayoutSp.astro_astro_type_script_index_0_lang.js','https://listenradio.jp/?ch=lr038')
              contexts('LISTENRADIO '+final,text,['lr038','30063','loadSource','audio.src','fetch(','axios','api/','streamUrl','stream_url','playlist','m3u8','channel_id'])
          except Exception as e: print('LR_ERR',type(e).__name__,repr(e))

name: Discover Community Radio Streams Once

on:
  push:
    paths:
      - ".github/workflows/discover_community_streams_once.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current stream endpoints
        shell: python
        run: |
          import re, json, urllib.request
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          def get(url, referer=None):
              h={'User-Agent':UA,'Accept':'*/*'}
              if referer: h['Referer']=referer
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read(3_000_000)
                  return r.geturl(),r.headers.get('content-type',''),data.decode('utf-8','replace')
          print('===== LISTENRADIO 30063 =====')
          try:
              u,ct,t=get('https://listenradio.jp/service/toppage.aspx?channelid=30063&devtype=ios','https://listenradio.jp/?ch=lr038')
              print('FINAL',u,'CT',ct,'BODY',t[:12000])
          except Exception as e: print('LR_ERR',type(e).__name__,repr(e))

          print('===== JCBA PLAYER JS =====')
          try:
              u,ct,t=get('https://www.jcbasimul.com/player/player-ui.min.js','https://www.jcbasimul.com/kyotoribingufm/rawplayer')
              print('FINAL',u,'CT',ct,'BYTES',len(t.encode()))
              for pat in ['fetch(','XMLHttpRequest','api/','stream','m3u8','station','channel','playlist','audio','URL(','endpoint','token']:
                  start=0;n=0
                  while n<20:
                      p=t.lower().find(pat.lower(),start)
                      if p<0: break
                      print('CTX',pat,t[max(0,p-800):p+2200].replace('\n',' ')[:3000])
                      start=p+len(pat);n+=1
              for x in sorted(set(re.findall(r'https?://[^\s"\'<>)}]+',t))):
                  print('URL',x[:1000])
          except Exception as e: print('JCBA_ERR',type(e).__name__,repr(e))

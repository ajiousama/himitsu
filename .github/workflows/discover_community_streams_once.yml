name: Discover Community Radio Streams Once

on:
  push:
    paths:
      - ".github/workflows/discover_community_streams_once.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover current player sources
        shell: python
        run: |
          import re, urllib.request, urllib.parse

          UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'

          def get(url, referer=None):
              headers = {'User-Agent': UA, 'Accept': '*/*'}
              if referer:
                  headers['Referer'] = referer
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.geturl(), r.read(2_000_000).decode('utf-8', 'replace')

          def dump(name, url, referer=None):
              print(f'===== {name} =====')
              try:
                  final, text = get(url, referer)
              except Exception as e:
                  print('FETCH_ERROR', type(e).__name__, repr(e))
                  return ''
              print('FINAL', final, 'BYTES', len(text.encode()))
              urls = re.findall(r'https?://[^\s"\'<>]+', text)
              for u in urls:
                  if re.search(r'm3u8|stream|audio|player|api|listen|hls|radimo|musicbird', u, re.I):
                      print('URL', u[:500])
              for m in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
                  print('SCRIPT', urllib.parse.urljoin(final, m))
              for i, line in enumerate(text.splitlines(), 1):
                  if re.search(r'm3u8|stream|audio|source|player|hls|listen|channel', line, re.I):
                      print(f'LINE{i}', line[:1200])
              return text

          dump('fm845_raw', 'https://www.jcbasimul.com/kyotoribingufm/rawplayer', 'https://www.jcbasimul.com/kyotoribingufm')
          dump('baribari_raw', 'https://www.jcbasimul.com/fmradiobaribari/rawplayer', 'https://www.jcbasimul.com/fmradiobaribari')
          dump('fm845_page', 'https://www.jcbasimul.com/kyotoribingufm')
          dump('baribari_page', 'https://www.jcbasimul.com/fmradiobaribari')
          lr = dump('listenradio', 'https://listenradio.jp/')

          print('===== LISTENRADIO JS =====')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', lr, re.I):
              js = urllib.parse.urljoin('https://listenradio.jp/', src)
              try:
                  final, text = get(js, 'https://listenradio.jp/')
              except Exception as e:
                  print('JS_ERROR', js, type(e).__name__, repr(e))
                  continue
              hits = []
              for u in re.findall(r'https?://[^\s"\'<>)}]+', text):
                  if re.search(r'm3u8|stream|api|channel|audio|listen', u, re.I):
                      hits.append(u)
              if hits or re.search(r'FM.?おとくに|otokuni|30063|m3u8|stream', text, re.I):
                  print('JS', final, 'BYTES', len(text.encode()))
                  for u in hits[:80]:
                      print('JSURL', u[:500])
                  for pat in ('FMおとくに','otokuni','30063','m3u8','stream'):
                      p = text.lower().find(pat.lower())
                      if p >= 0:
                          print('CONTEXT', pat, text[max(0,p-500):p+1000].replace('\n',' ')[:1500])

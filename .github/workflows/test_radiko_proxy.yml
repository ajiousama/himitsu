name: Test radiko IPTV proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - radiko_proxy.py
      - radiko_proxy_core.py
      - radiko_epg.py
      - radiko_proxy_start.bat
      - radiko_public_gateway.py
      - radiko_public_start.bat
      - radiko_selftest.py
      - .github/workflows/test_radiko_proxy.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile radiko_proxy.py radiko_proxy_core.py radiko_epg.py radiko_public_gateway.py radiko_selftest.py

      - name: Connect to a VPN Gate Japan server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          python - <<'PY'
          import base64, csv, pathlib, urllib.request
          req = urllib.request.Request('https://www.vpngate.net/api/iphone/', headers={'User-Agent':'Mozilla/5.0'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          rows=[]
          for line in text.splitlines():
              if not line or line.startswith(('*','#')): continue
              try: row=next(csv.reader([line]))
              except Exception: continue
              if len(row)<15 or not (row[5]=='Japan' or row[6]=='JP') or not row[14]: continue
              try: rows.append((int(row[2] or 0), int(row[4] or 0), row[14]))
              except ValueError: pass
          rows.sort(reverse=True)
          out=pathlib.Path('/tmp/vpngate-jp'); out.mkdir(exist_ok=True)
          for i,(_,_,enc) in enumerate(rows[:10],1):
              try: raw=base64.b64decode(enc).decode('utf-8','replace').replace('\r\n','\n')
              except Exception: continue
              raw+='\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 10\n'
              (out/f'{i:02d}.ovpn').write_text(raw)
          PY
          CONNECTED=0
          for CFG in /tmp/vpngate-jp/*.ovpn; do
            LOG=/tmp/openvpn.log; PID=/tmp/openvpn.pid
            sudo rm -f "$LOG" "$PID"
            sudo openvpn --config "$CFG" --daemon --writepid "$PID" --log "$LOG" || true
            for i in $(seq 1 18); do
              if sudo grep -q 'Initialization Sequence Completed' "$LOG" 2>/dev/null; then CONNECTED=1; break; fi
              sleep 1
            done
            [ "$CONNECTED" -eq 1 ] && break
            if [ -f "$PID" ]; then sudo kill "$(sudo cat "$PID")" 2>/dev/null || true; fi
          done
          [ "$CONNECTED" -eq 1 ] || exit 1
          echo -n 'radiko area: '; curl -fsSL --max-time 12 https://radiko.jp/area || true; echo

      - name: Start proxy and test playlist
        env:
          RADIKO_MAIL: ${{ secrets.RADIKO_MAIL }}
          RADIKO_PASSWORD: ${{ secrets.RADIKO_PASSWORD }}
          RADIKO_PROXY_HOST: 127.0.0.1
          RADIKO_PROXY_PORT: 9395
        shell: bash
        run: |
          set -euo pipefail
          python radiko_proxy.py >/tmp/radiko_proxy.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; [ -n "${GPID:-}" ] && kill "$GPID" 2>/dev/null || true; cat /tmp/radiko_proxy.log || true; cat /tmp/radiko_gateway.log 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:9395/health; then break; fi
            sleep 2
          done
          curl -fsS --max-time 10 http://127.0.0.1:9395/health
          curl -fsS --max-time 30 http://127.0.0.1:9395/playlist.m3u -o /tmp/radiko.m3u
          python - <<'PY'
          import re
          text=open('/tmp/radiko.m3u',encoding='utf-8').read()
          lines=text.splitlines()
          extinf=[x for x in lines if x.startswith('#EXTINF:')]
          groups=sorted(set(re.findall(r'group-title="([^"]+)"', text)))
          logos=re.findall(r'tvg-logo="([^"]*)"', text)
          print('playlist station count:', len(extinf))
          print('groups:', ', '.join(groups))
          print('logo entries:', sum(bool(x) for x in logos), '/', len(logos))
          print('header:', lines[0] if lines else '')
          assert len(extinf) > 100
          assert lines and 'url-tvg="http://127.0.0.1:9395/epg.xml"' in lines[0]
          required={'北海道','東北','関東','甲信越','東海','近畿','四国','中国','九州沖縄'}
          missing=required-set(groups)
          assert not missing, f'missing groups: {sorted(missing)}'
          assert sum(bool(x) for x in logos) > 90
          assert 'tvg-id="radiko.RNB"' in text
          assert 'tvg-id="radiko.JOEU-FM"' in text
          PY
          curl -fsS --max-time 90 http://127.0.0.1:9395/epg.xml -o /tmp/radiko_epg.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/radiko_epg.xml').getroot(); channels={x.get('id') for x in root.findall('channel')}; programmes=root.findall('programme')
          print('epg channels:',len(channels)); print('epg programmes:',len(programmes))
          assert 'radiko.RNB' in channels and 'radiko.TBS' in channels and len(channels)>80 and len(programmes)>500
          PY
          python - <<'PY'
          from radiko_proxy import rewrite_m3u
          out=rewrite_m3u('#EXTM3U\nchild.m3u8\n','https://example.radiko.jp/a/master.m3u8','https://gateway.example')
          assert '#EXTM3U' in out and 'https://gateway.example/proxy?u=' in out
          print('HLS rewrite unit check OK')
          PY
          RADIKO_PUBLIC_NO_KEY=1 RADIKO_GATEWAY_SIGNING_SECRET=test-signing-secret python - <<'PY'
          import urllib.parse, radiko_public_gateway as g
          raw='https://gateway.example/proxy?u='+urllib.parse.quote('https://cdn.example.net/audio/chunk.m3u8',safe='')
          signed=g.signed_proxy_url(raw)
          assert ('&s=' in signed or '?s=' in signed) and g.valid_signed_proxy(urllib.parse.urlsplit(signed)) and not g.valid_signed_proxy(urllib.parse.urlsplit(raw))
          text=g.rewrite_text('#EXTM3U\n'+raw+'\n','https://gateway.example',''); line=[x for x in text.splitlines() if x and not x.startswith('#')][0]
          assert g.valid_signed_proxy(urllib.parse.urlsplit(line)); print('signed public proxy URL check OK')
          PY
          LIVE_OK=0
          for SID in RNB JOEU-FM FMT; do
            if curl -fsS --max-time 20 "http://127.0.0.1:9395/live/$SID" -o "/tmp/live-$SID.m3u" && grep -q '^#EXTM3U' "/tmp/live-$SID.m3u"; then echo "live OK: $SID"; LIVE_OK=1; break; fi
          done
          if [ "$LIVE_OK" -eq 0 ]; then echo 'WARNING: VPN Gate exit is currently rejected by radiko; live fetch is non-fatal in CI.'; fi
          RADIKO_PUBLIC_NO_KEY=1 RADIKO_GATEWAY_SIGNING_SECRET=test-signing-secret RADIKO_GATEWAY_HOST=127.0.0.1 RADIKO_GATEWAY_PORT=9396 python radiko_public_gateway.py >/tmp/radiko_gateway.log 2>&1 &
          GPID=$!
          for i in $(seq 1 20); do curl -fsS --max-time 2 http://127.0.0.1:9396/health >/dev/null && break; sleep 1; done
          curl -fsS --max-time 30 http://127.0.0.1:9396/playlist.m3u -o /tmp/public_radiko.m3u
          python - <<'PY'
          text=open('/tmp/public_radiko.m3u',encoding='utf-8').read()
          assert 'https://127.0.0.1:9396/live/RNB' in text and 'url-tvg="https://127.0.0.1:9396/epg.xml"' in text and '?k=' not in text
          print('public gateway playlist rewrite OK')
          PY
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9396/freewifi.m3u)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:9396/proxy?u=https%3A%2F%2Fexample.com%2Fevil.m3u8')" = 403

name: Refresh all radio TS visuals

on:
  push:
    paths:
      - 'build_all_radio_ts.py'
      - '.github/workflows/refresh_radio_ts_180p.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-all-radio-ts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Reuse existing TS asset branch
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="${RUNNER_TEMP}/radio-ts-assets"
          rm -rf "$ASSETS"
          git fetch origin radio-ts-assets:refs/remotes/origin/radio-ts-assets || true
          if git show-ref --verify --quiet refs/remotes/origin/radio-ts-assets; then
            git worktree add --detach "$ASSETS" origin/radio-ts-assets
          else
            git worktree add --detach "$ASSETS" HEAD
            git -C "$ASSETS" switch --orphan radio-ts-assets-bootstrap
            git -C "$ASSETS" rm -rf . || true
          fi
          echo "RADIO_TS_ASSETS=$ASSETS" >> "$GITHUB_ENV"

      - name: Invalidate stale TS encodes once
        shell: bash
        run: |
          set -euo pipefail
          REV='radio-ts-320x180-1fps-baseline-v2'
          MARKER="$RADIO_TS_ASSETS/.radio_ts_build_rev"
          OLD=''
          test -f "$MARKER" && OLD="$(cat "$MARKER")"
          if [ "$OLD" != "$REV" ]; then
            echo "TS build revision changed: ${OLD:-none} -> $REV"
            find "$RADIO_TS_ASSETS" -type f \( -name 'segments.json' -o -name 'video.m3u8' -o -name 'master.m3u8' -o -name 'seg_*.ts' \) -delete
            printf '%s\n' "$REV" > "$MARKER"
          else
            echo "TS build revision already current: $REV"
          fi

      - name: Build or reuse every nationwide radio visual
        shell: bash
        run: |
          set -euo pipefail
          python build_all_radio_ts.py --assets-root "$RADIO_TS_ASSETS" --workers 3

      - name: Probe every generated TS video
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path(__import__('os').environ['RADIO_TS_ASSETS'])
          masters = sorted(root.glob('*/master.m3u8'))
          if len(masters) < 116:
              raise SystemExit(f'too few radio masters: {len(masters)}')

          bad = []
          checked = 0
          for master in masters:
              station = master.parent.name
              video = master.parent / 'video.m3u8'
              if not video.is_file():
                  bad.append((station, 'missing video.m3u8'))
                  continue
              segs = [x.strip() for x in video.read_text(encoding='utf-8').splitlines() if x.strip().endswith('.ts')]
              if not segs:
                  bad.append((station, 'no TS segments'))
                  continue
              seg = master.parent / segs[0]
              if not seg.is_file() or seg.stat().st_size <= 0:
                  bad.append((station, 'missing/empty first TS'))
                  continue
              p = subprocess.run([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,width,height,pix_fmt,avg_frame_rate,profile',
                  '-of','json',str(seg)
              ], text=True, capture_output=True)
              if p.returncode != 0:
                  bad.append((station, 'ffprobe failed: ' + p.stderr.strip()[-300:]))
                  continue
              try:
                  streams = json.loads(p.stdout).get('streams') or []
                  s = streams[0]
              except Exception:
                  bad.append((station, 'no decodable video stream'))
                  continue
              problems = []
              if s.get('codec_name') != 'h264': problems.append('codec=' + str(s.get('codec_name')))
              if (s.get('width'), s.get('height')) != (320, 180): problems.append(f"size={s.get('width')}x{s.get('height')}")
              if s.get('pix_fmt') != 'yuv420p': problems.append('pix_fmt=' + str(s.get('pix_fmt')))
              if s.get('avg_frame_rate') not in ('1/1', '1'): problems.append('fps=' + str(s.get('avg_frame_rate')))
              if problems:
                  bad.append((station, ', '.join(problems)))
              else:
                  checked += 1

          print(f'ffprobe OK: {checked}/{len(masters)}')
          if bad:
              print('BAD RADIO TS:')
              for station, why in bad:
                  print(f'  {station}: {why}')
              raise SystemExit(f'{len(bad)} radio TS visuals failed validation')
          PY

      - name: Publish TS assets
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RADIO_TS_ASSETS" config user.name 'github-actions[bot]'
          git -C "$RADIO_TS_ASSETS" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RADIO_TS_ASSETS" add -A
          if git -C "$RADIO_TS_ASSETS" diff --cached --quiet; then
            echo 'TS assets already current'
          else
            git -C "$RADIO_TS_ASSETS" commit -m 'Refresh nationwide stable radio TS assets'
            git -C "$RADIO_TS_ASSETS" push origin HEAD:radio-ts-assets
          fi

      - name: Commit radio playlist routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio.m3u freewifi
          if git diff --cached --quiet; then
            echo 'Radio playlists already use stable TS visuals'
            exit 0
          fi
          git commit -m 'Use stable TS visuals for all radio stations'
          git pull --rebase origin main
          git push origin HEAD:main

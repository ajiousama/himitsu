name: Update FreeWiFi ALL（ajiousama単独 / 自動EPG）

on:
  workflow_dispatch:
  schedule:
    # 09:00 / 12:00 / 17:00 / 21:00 JST
    - cron: "0 0,3,8,12 * * *"
  push:
    branches:
      - main
    paths:
      - "ganble"
      - "normalize_ganble_local.py"
      - "other_live.m3u"
      - "epg_build.py"
      - "epg_build_safe.py"
      - "radiko_epg.py"
      - "radiko_epg_merge.py"
      - "radio_tv_nationwide.py"
      - "radio_tv_nationwide_freewifi.py"
      - "kick_channels.json"
      - "kick_epg.py"
      - "public_sports_epg_local.py"
      - "public_sports_epg_local_fast.py"
      - "repair_boat_local_epg_openapi.py"
      - "public_sports_epg_merge.py"
      - "keiba_epg_direct.py"
      - "keirin_epg_direct.py"
      - "autorace_epg_direct.py"
      - "jra_epg_merge.py"
      - "jra_freewifi_finalize.py"
      - "freewifi_today_public_sports.py"
      - "freewifi_strip_public_boat.py"
      - "freewifi_today_jra.py"
      - "finalize_today_public_sports.py"
      - "public_sports_youtube_fallback.py"
      - "public_sports_youtube_fallback.m3u"
      - "build_today_event_counts.py"
      - ".github/workflows/update_freewifi_epg.yml"

permissions:
  contents: write

# One repository-wide writer mutex for freewifi/guides.xml state.
concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js for manual YouTube refresh
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yt-dlp for manual YouTube refresh
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'

      - name: Restore YouTube cookies for manual refresh
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
          fi

      - name: Refresh public sports YouTube fallbacks (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: python public_sports_youtube_fallback.py

      - name: Refresh general YouTube LIVE (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python general_youtube_update.py
          python jra_freewifi_finalize.py

      - name: Normalize public sports master to ajiousama-only references
        run: python normalize_ganble_local.py

      - name: Generate public sports EPG and verified status locally
        run: python -u public_sports_epg_local_fast.py

      - name: Validate local-only public sports source
        shell: bash
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('public_sports_epg_local.xml'); print('LOCAL PUBLIC SPORTS XML OK')"
          test -s verified_daily_status.json
          ! grep -E 'earphone1981/public-sports-iptv' ganble public_sports_epg_local.py public_sports_epg_local_fast.py freewifi_today_public_sports.py public_sports_epg_merge.py freewifi_today_jra.py jra_epg_merge.py verified_daily_override.py

      - name: Sync today's non-BOAT public sports venues into FreeWiFi
        run: |
          python freewifi_today_public_sports.py
          python freewifi_strip_public_boat.py

      - name: Sync today's JRA channels into FreeWiFi
        run: python freewifi_today_jra.py

      - name: Finalize ended venues and time order
        run: python finalize_today_public_sports.py

      - name: Build compact current event counts
        run: python build_today_event_counts.py

      - name: Commit local venue state before EPG work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ganble freewifi today_public_sports_status.json today_jra_status.json today_event_counts.json verified_daily_status.json public_sports_epg_local.xml
          [ ! -f public_sports_youtube_fallback.m3u ] || git add public_sports_youtube_fallback.m3u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -f general_youtube.m3u ]; then
            git add general_youtube.m3u
          fi
          if git diff --cached --quiet; then
            echo "Local venue state already current"
          else
            git commit -m "Update ajiousama public sports state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Sync latest main before EPG build
        run: git pull --ff-only origin main

      - name: Build merged EPG safely without external public-sports source
        run: python epg_build_safe.py

      - name: Merge selected Radiko EPG
        run: python radiko_epg_merge.py

      - name: Merge local public sports EPG for today's venues
        run: python public_sports_epg_merge.py

      - name: Repair today's local horse racing EPG directly from NAR
        run: python keiba_epg_direct.py

      - name: Repair today's KEIRIN EPG from current race cards
        run: python keirin_epg_direct.py

      - name: Repair today's AutoRace EPG from official race cards
        run: python autorace_epg_direct.py

      - name: Merge local JRA race EPG
        run: python jra_epg_merge.py

      - name: Add persistent KICK receiver EPG
        run: python kick_epg.py

      - name: Validate XML and reject empty/sparse guides
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('guides.xml')
          if not p.is_file() or p.stat().st_size < 100000:
              raise SystemExit(f'guides.xml missing or suspiciously small: {p.stat().st_size if p.exists() else 0} bytes')
          root = ET.parse(p).getroot()
          channels = len(root.findall('channel'))
          programmes = len(root.findall('programme'))
          print(f'XML OK bytes={p.stat().st_size} channels={channels} programmes={programmes}')
          if channels < 50 or programmes < 100:
              raise SystemExit(f'guides.xml suspiciously sparse: channels={channels} programmes={programmes}')
          PY
          test "$(grep -c '<channel id=\"radiko\.' guides.xml || true)" -gt 0
          test "$(grep -c '<programme .*channel=\"radiko\.' guides.xml || true)" -gt 0

      - name: Publish generated EPG onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot="$(mktemp -d)"
          cp guides.xml "$snapshot/guides.xml"
          cp epg_coverage.txt "$snapshot/epg_coverage.txt"
          cp public_sports_epg_local.xml "$snapshot/public_sports_epg_local.xml"
          cp verified_daily_status.json "$snapshot/verified_daily_status.json"

          for attempt in 1 2 3 4 5; do
            echo "EPG overlay publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/guides.xml" guides.xml
            cp "$snapshot/epg_coverage.txt" epg_coverage.txt
            cp "$snapshot/public_sports_epg_local.xml" public_sports_epg_local.xml
            cp "$snapshot/verified_daily_status.json" verified_daily_status.json

            python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          g = Path('guides.xml')
          p = Path('public_sports_epg_local.xml')
          if g.stat().st_size < 100000:
              raise SystemExit(f'publish blocked: guides.xml only {g.stat().st_size} bytes')
          gr = ET.parse(g).getroot()
          ET.parse(p)
          if len(gr.findall('channel')) < 50 or len(gr.findall('programme')) < 100:
              raise SystemExit('publish blocked: guides.xml is too sparse')
          print('PUBLISH XML OK')
          PY
            git add guides.xml epg_coverage.txt public_sports_epg_local.xml verified_daily_status.json
            if git diff --cached --quiet; then
              echo "EPG already current on latest main"
              exit 0
            fi
            git commit -m "Update FreeWiFi local EPG [skip ci]"
            if git push origin HEAD:main; then
              echo "EPG overlay published successfully"
              exit 0
            fi
            echo "::warning::main moved during EPG push; retrying on newest main"
            sleep 1
          done

          echo "::error::EPG overlay publish failed after 5 attempts"
          exit 1

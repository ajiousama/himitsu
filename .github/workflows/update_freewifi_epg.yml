name: Update FreeWiFi ALL（手動一発 / 自動EPG）

on:
  workflow_dispatch:
  schedule:
    # 09:00 / 12:00 / 17:00 / 21:00 JST
    - cron: "0 0,3,8,12 * * *"
  push:
    branches:
      - main
    paths:
      - "freewifi"
      - "other_live.m3u"
      - "epg_build.py"
      - "radiko_epg.py"
      - "radiko_epg_merge.py"
      - "radio_tv_nationwide.py"
      - "radio_tv_nationwide_freewifi.py"
      - "kick_channels.json"
      - "kick_epg.py"
      - "public_sports_epg_merge.py"
      - "jra_epg_merge.py"
      - "jra_freewifi_finalize.py"
      - "freewifi_today_public_sports.py"
      - "finalize_today_public_sports.py"
      - "prune_expired_boat_freewifi.py"
      - "public_sports_youtube_fallback.py"
      - "public_sports_youtube_fallback.m3u"
      - "freewifi_today_jra.py"
      - "verified_daily_status.json"
      - "verified_daily_override.py"
      - "apply_verified_status.py"
      - "build_today_event_counts.py"
      - ".github/workflows/update_freewifi_epg.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js for manual YouTube refresh
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yt-dlp for manual YouTube refresh
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'

      - name: Restore YouTube cookies for manual refresh
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
          fi

      - name: Refresh public sports YouTube fallbacks (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: python public_sports_youtube_fallback.py

      - name: Refresh general YouTube LIVE (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python general_youtube_update.py
          python jra_freewifi_finalize.py

      - name: Sync today's public sports venues into FreeWiFi
        run: python freewifi_today_public_sports.py

      - name: Drop expired BOAT stream URLs
        run: python prune_expired_boat_freewifi.py

      - name: Sync today's JRA channels into FreeWiFi
        run: python freewifi_today_jra.py

      - name: Apply verified sports/JRA status
        run: |
          python verified_daily_override.py
          python apply_verified_status.py

      - name: Finalize ended venues and time order
        run: python finalize_today_public_sports.py

      - name: Build compact current event counts
        run: python build_today_event_counts.py

      - name: Commit venue state before EPG work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add freewifi today_public_sports_status.json today_jra_status.json today_event_counts.json
          [ ! -f public_sports_youtube_fallback.m3u ] || git add public_sports_youtube_fallback.m3u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -f general_youtube.m3u ]; then
            git add general_youtube.m3u
          fi

          if git diff --cached --quiet; then
            echo "Venue state already current"
          else
            git commit -m "Update FreeWiFi current venues"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Sync latest main before EPG build
        run: git pull --ff-only origin main

      - name: Build merged EPG
        run: python epg_build.py

      - name: Merge selected Radiko EPG
        run: python radiko_epg_merge.py

      - name: Merge public sports EPG for today's venues
        run: python public_sports_epg_merge.py

      - name: Merge JRA race EPG for official YouTube
        run: python jra_epg_merge.py

      - name: Add persistent KICK receiver EPG
        run: python kick_epg.py

      - name: Validate XML
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('guides.xml'); print('XML OK')"
          test "$(grep -c '<channel id=\"radiko\.' guides.xml || true)" -gt 0
          test "$(grep -c '<programme .*channel=\"radiko\.' guides.xml || true)" -gt 0

      - name: Publish generated EPG with rebuild retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_epg() {
            git add guides.xml epg_coverage.txt
            if git diff --cached --quiet; then
              echo "EPG already current"
              return 0
            fi
            git commit -m "Update FreeWiFi EPG"
            git push origin HEAD:main
          }

          if publish_epg; then
            exit 0
          fi

          for attempt in 2 3; do
            echo "EPG push moved; rebuild attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            python epg_build.py
            python radiko_epg_merge.py
            python public_sports_epg_merge.py
            python jra_epg_merge.py
            python kick_epg.py
            python -c "import xml.etree.ElementTree as ET; ET.parse('guides.xml'); print('XML OK')"
            test "$(grep -c '<channel id=\"radiko\.' guides.xml || true)" -gt 0
            test "$(grep -c '<programme .*channel=\"radiko\.' guides.xml || true)" -gt 0
            if publish_epg; then
              exit 0
            fi
          done

          echo "::error::EPG publish failed after rebuild retries"
          exit 1

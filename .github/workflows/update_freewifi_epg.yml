name: Update FreeWiFi ALL（手動一発 / 自動EPG）

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,3,8,12 * * *"
  push:
    branches:
      - main
    paths:
      - "freewifi"
      - "other_live.m3u"
      - "epg_build.py"
      - "public_sports_epg_merge.py"
      - "jra_epg_merge.py"
      - "jra_freewifi_finalize.py"
      - "freewifi_today_public_sports.py"
      - "public_sports_youtube_fallback.py"
      - "freewifi_today_jra.py"
      - "verified_daily_status.json"
      - "verified_daily_override.py"
      - "apply_verified_status.py"
      - "build_today_event_counts.py"
      - ".github/workflows/update_freewifi_epg.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js for manual YouTube refresh
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install latest yt-dlp for manual YouTube refresh
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          yt-dlp --version

      - name: Restore YouTube cookies for manual refresh
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
            echo "Cookie restored: $(wc -c < youtube_cookies.txt) bytes"
          else
            echo 'YOUTUBE_COOKIES is not set; continuing without cookies'
          fi

      - name: Refresh public sports YouTube fallbacks (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: python public_sports_youtube_fallback.py

      - name: Refresh all general YouTube LIVE (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python general_youtube_update.py
          python jra_freewifi_finalize.py

      - name: Show YouTube group summary (manual only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -s general_youtube.m3u
          echo "General YouTube LIVE total: $(grep -c '^#EXTINF:' general_youtube.m3u || true)"
          for G in '愛媛県内ライブカメラ' '空港' '交通' '動物' 'その他LIVE'; do
            C=$(grep -F 'group-title="'"$G"'"' general_youtube.m3u | wc -l || true)
            echo "$G: $C"
          done
          grep -q '# === GENERAL_YOUTUBE_MANAGED_START ===' freewifi
          grep -q '# === GENERAL_YOUTUBE_MANAGED_END ===' freewifi

      - name: Sync today's public sports venues into FreeWiFi
        run: python freewifi_today_public_sports.py

      - name: Sync today's JRA channels into FreeWiFi
        run: python freewifi_today_jra.py

      - name: Apply verified daily safety override
        run: |
          python verified_daily_override.py
          python apply_verified_status.py

      - name: Build compact current event counts
        run: python build_today_event_counts.py

      - name: Show current event counts
        run: cat today_event_counts.json

      - name: Build merged EPG
        run: python epg_build.py

      - name: Merge public sports EPG for today's venues
        run: python public_sports_epg_merge.py

      - name: Merge JRA race EPG for official YouTube
        run: python jra_epg_merge.py

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('guides.xml'); print('XML OK')"

      - name: Show coverage summary
        run: |
          head -n 12 epg_coverage.txt || true
          grep -c '^OK' epg_coverage.txt || true
          grep -c '^FALLBACK' epg_coverage.txt || true
          echo "JRA official EPG programmes: $(grep -c 'channel=\"jra.official\"' guides.xml || true)"
          echo "Public sports EPG programmes: $(grep -E -c 'channel=\"(keirin|chihou|boat|auto)\.' guides.xml || true)"

      - name: Validate verified counts when override is active
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          JST=timezone(timedelta(hours=9))
          p=Path('verified_daily_status.json')
          if not p.exists(): raise SystemExit(0)
          cfg=json.loads(p.read_text(encoding='utf-8-sig'))
          if cfg.get('date') != datetime.now(JST).date().isoformat(): raise SystemExit(0)
          counts=json.loads(Path('today_event_counts.json').read_text(encoding='utf-8-sig'))['counts']
          expected={
            'keirin':len(cfg['public_sports'].get('競輪',[])),
            'local_horse':len(cfg['public_sports'].get('地方競馬',[])),
            'boat':len(cfg['public_sports'].get('ボートレース',[])),
            'autorace':len(cfg['public_sports'].get('オートレース',[])),
            'jra':len(cfg.get('jra_active_ids',[])),
          }
          if any(int(counts.get(k,-1)) != v for k,v in expected.items()):
              raise SystemExit(f'Verified count mismatch: got={counts} expected={expected}')
          print('Verified counts OK:',expected)
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides.xml epg_coverage.txt freewifi today_public_sports_status.json today_jra_status.json today_event_counts.json
          [ ! -f public_sports_youtube_fallback.m3u ] || git add public_sports_youtube_fallback.m3u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add general_youtube.m3u
          fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "Update FreeWiFi YouTube and EPG"
          else
            git commit -m "Update FreeWiFi EPG and today's public sports"
          fi
          git pull --rebase origin main
          git push origin main

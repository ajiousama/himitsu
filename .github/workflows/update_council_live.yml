name: Update Council Live Channels

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 0-10 * * *"

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Update council live visibility
        run: python freewifi_council_live.py

      - name: Publish council visibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          if git diff --cached --quiet; then
            echo "Council visibility already current"
          else
            git commit -m "Update council live visibility [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

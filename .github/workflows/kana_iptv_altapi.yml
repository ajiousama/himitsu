name: Kana IPTV Alt API Rescue
# manual-trigger: 2026-11-21T20:41JST

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kana_iptv_altapi.yml'
  schedule:
    # Every 15 minutes JST 09:00-23:45: covers DAY and MIDNIGHT.
    # A verified live stream can change video ID between broadcasts.
    - cron: '*/15 0-14 * * *'

permissions:
  contents: write

concurrency:
  group: kana-iptv-altapi
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN_LOCAL: ${{ github.token }}
      KANA_CHANNEL_ID: UCmHdGDdZGf4cMWRBmEw4Xww

    steps:
      - name: Resolve through independent Piped and Invidious APIs
        shell: bash
        run: |
          cat > /tmp/kana_altapi.py <<'PY'
          import base64, concurrent.futures as cf, datetime as dt, json, os, re, urllib.parse, urllib.request, subprocess, time, threading

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          CHANNEL_ID=os.environ["KANA_CHANNEL_ID"]
          TOKEN=os.environ["GH_TOKEN_LOCAL"]
          REPO=os.environ["GITHUB_REPOSITORY"]

          PIPED=[
            "https://pipedapi.kavin.rocks","https://pipedapi.leptons.xyz",
            "https://pipedapi.nosebs.ru","https://pipedapi-libre.kavin.rocks",
            "https://piped-api.privacy.com.de","https://pipedapi.adminforge.de",
            "https://api.piped.yt","https://pipedapi.drgns.space",
            "https://pipedapi.owo.si","https://pipedapi.ducks.party",
            "https://piped-api.codespace.cz","https://pipedapi.reallyaweso.me",
            "https://api.piped.private.coffee","https://pipedapi.darkness.services",
            "https://pipedapi.orangenet.cc",
          ]
          INVIDIOUS=[
            "https://inv.nadeko.net","https://invidious.nerdvpn.de",
            "https://yt.chocolatemoo53.com","https://invidious.tiekoetter.com",
          ]

          logs=[]
          AV_SEM=threading.BoundedSemaphore(2)
          def note(*parts):
              msg=" ".join(str(x) for x in parts)
              print(msg,flush=True); logs.append(msg[-800:])

          def get(url,limit=1_000_000,timeout=7):
              req=urllib.request.Request(url,headers={
                "User-Agent":UA,
                "Accept":"application/json,text/plain,application/vnd.apple.mpegurl,*/*",
                "Accept-Language":"en-US,en;q=0.9",
              })
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.geturl(),r.read(limit).decode("utf-8","replace")

          def get_json(url):
              s,f,t=get(url)
              return s,f,json.loads(t)

          def vid_from_url(v):
              if not isinstance(v,str): return None
              m=re.search(r"(?:[?&]v=|/watch/|/live/)([A-Za-z0-9_-]{11})",v)
              return m.group(1) if m else None

          def probe(url):
              try:
                  s,final,body=get(url,limit=600_000,timeout=8)
                  return s==200 and "#EXTM3U" in body[:8192],final,body
              except Exception as e:
                  return False,url,""

          def has_video(body,url):
              low=body.lower()
              if any(f"/itag/{i}/" in url for i in ("96","95","94","93")): return True
              return "#ext-x-stream-inf" in low and (
                "resolution=" in low or "avc1" in low or "vp09" in low or "av01" in low or "h264" in low
              )

          def has_audio(body,url):
              low=body.lower()
              if any(f"/itag/{i}/" in url for i in ("96","95","94","93")): return True
              return (
                "#ext-x-media:type=audio" in low or "mp4a" in low or "opus" in low or 'audio="' in low
                or ("#ext-x-stream-inf" in low and "codecs=" in low and
                    ("avc1" in low or "vp09" in low or "av01" in low))
              )

          def is_live_metadata(data):
              return (data.get("liveNow") is True or data.get("isLive") is True
                      or data.get("livestream") is True or data.get("duration")==-1)

          def fresh_live_hls(url):
              decoded=urllib.parse.unquote(url).lower()
              if "/force_finished/1" in decoded or "/playlist_type/clean" in decoded:
                  return False
              expires=re.search(r"/expire/(\d+)",decoded)
              if expires and int(expires.group(1)) < time.time()+1800:
                  return False
              return True

          def actual_audio_video(url):
              # Manifest metadata is not enough: attempt to decode probe samples.
              try:
                  with AV_SEM:
                      p=subprocess.run([
                          "ffprobe","-v","error","-rw_timeout","12000000",
                          "-analyzeduration","2000000","-probesize","1200000",
                          "-show_entries","stream=codec_type","-of","json",url,
                      ],capture_output=True,text=True,timeout=22)
                  types={s.get("codec_type") for s in json.loads(p.stdout or "{}").get("streams",[])}
                  if p.returncode==0 and {"video","audio"}<=types:
                      return True
                  note("AV_PROBE_REJECT",p.returncode,",".join(sorted(t for t in types if t)),(p.stderr or "")[-130:])
              except Exception as e:
                  note("AV_PROBE_ERROR",type(e).__name__)
              return False

          def direct_muxed(master,body):
              children=[]
              for line in body.splitlines():
                  line=line.strip()
                  if line and not line.startswith("#"):
                      children.append(urllib.parse.urljoin(master,line))
              for itag in ("96","95","94","93"):
                  for u in children:
                      if f"/itag/{itag}/" in u:
                          ok,final,_=probe(u)
                          if ok: return final,"itag-"+itag
              return None,None

          def piped_stream(args):
              base,vid=args
              try:
                  _,_,d=get_json(base+"/streams/"+vid)
                  if not is_live_metadata(d): return None
                  h=d.get("hls")
                  if not isinstance(h,str) or not h.startswith("http"): return None
                  ok,final,body=probe(h)
                  if not ok or not has_video(body,final) or not has_audio(body,final): return None
                  direct,kind=direct_muxed(final,body)
                  resolved=direct or final
                  if not fresh_live_hls(resolved) or not actual_audio_video(resolved): return None
                  return {"url":resolved,"instance":base,"mode":"piped-direct-"+kind if direct else "piped-master"}
              except Exception as e:
                  return None

          def inv_stream(args):
              base,vid=args
              try:
                  _,_,d=get_json(base+"/api/v1/videos/"+vid)
                  if not is_live_metadata(d): return None
                  h=d.get("hlsUrl") or d.get("hls")
                  if not isinstance(h,str) or not h.startswith("http"): return None
                  ok,final,body=probe(h)
                  if not ok or not has_video(body,final) or not has_audio(body,final): return None
                  direct,kind=direct_muxed(final,body)
                  resolved=direct or final
                  if not fresh_live_hls(resolved) or not actual_audio_video(resolved): return None
                  return {"url":resolved,"instance":base,"mode":"invidious-direct-"+kind if direct else "invidious-master"}
              except Exception:
                  return None

          def try_video(vid):
              note("TRY_VIDEO",vid)
              tasks=[]
              with cf.ThreadPoolExecutor(max_workers=19) as ex:
                  for base in PIPED: tasks.append(ex.submit(piped_stream,(base,vid)))
                  for base in INVIDIOUS: tasks.append(ex.submit(inv_stream,(base,vid)))
                  for fut in cf.as_completed(tasks):
                      try: r=fut.result()
                      except Exception: r=None
                      if r:
                          note("VERIFIED_LIVE_AV_HLS",vid,r["mode"],r["instance"],r["url"][:150])
                          for other in tasks: other.cancel()
                          return r
              return None

          def vertical_title(title):
              title=(title or "").lower()
              return any(t in title for t in ("縦型","縦配信","vertical","shorts"))

          def discover_inv(base):
              out=[]
              try:
                  _,_,d=get_json(base+"/api/v1/channels/"+CHANNEL_ID)
                  for key in ("latestVideos","videos"):
                      for x in d.get(key) or []:
                          if isinstance(x,dict) and (x.get("liveNow") is True or x.get("isLive") is True):
                              vid=x.get("videoId") or vid_from_url(x.get("url"))
                              if vid: out.append((vid,base+":live",x.get("title") or ""))
              except Exception: pass
              return out

          def discover_piped(base):
              out=[]
              try:
                  _,_,d=get_json(base+"/channel/"+CHANNEL_ID)
                  for key in ("relatedStreams","streams","videos"):
                      for x in d.get(key) or []:
                          if not isinstance(x,dict): continue
                          typ=str(x.get("type") or "").lower()
                          if x.get("liveNow") is True or x.get("livestream") is True or typ=="livestream" or x.get("duration")==-1:
                              vid=x.get("videoId") or vid_from_url(x.get("url"))
                              if vid: out.append((vid,base+":live",x.get("title") or ""))
              except Exception: pass
              return out

          def discover():
              ranked={}
              with cf.ThreadPoolExecutor(max_workers=19) as ex:
                  fs=[ex.submit(discover_inv,b) for b in INVIDIOUS]+[ex.submit(discover_piped,b) for b in PIPED]
                  for fut in cf.as_completed(fs):
                      try: rows=fut.result() or []
                      except Exception: rows=[]
                      for vid,source,title in rows:
                          if vid not in ranked or (vertical_title(ranked[vid][2]) and not vertical_title(title)):
                              ranked[vid]=(vid,source,title)
              choices=sorted(ranked.values(),key=lambda x:(vertical_title(x[2]),x[0]))
              note("LIVE_CANDIDATES_NORMAL_FIRST",",".join(x[0] for x in choices[:10]))
              return choices

          def rss_candidates():
              url="https://www.youtube.com/feeds/videos.xml?channel_id="+CHANNEL_ID
              try:
                  _,_,xml=get(url,limit=1_000_000,timeout=10)
                  vids=re.findall(r"<yt:videoId>([A-Za-z0-9_-]{11})</yt:videoId>",xml)
                  out=[]
                  for v in vids:
                      if v not in out: out.append(v)
                  note("RSS_CANDIDATES",",".join(out[:12]))
                  return out[:12]
              except Exception as e:
                  note("RSS_FAIL",type(e).__name__,str(e)[:120])
                  return []

          def gh_get(path):
              api="https://api.github.com/repos/"+REPO+"/contents/"+path
              headers={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","User-Agent":"kana-altapi"}
              req=urllib.request.Request(api,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                  data=json.loads(r.read().decode())
              return base64.b64decode(data["content"]).decode("utf-8","replace"),data["sha"]

          def gh_put(path,content,message):
              api="https://api.github.com/repos/"+REPO+"/contents/"+path
              headers={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","User-Agent":"kana-altapi"}
              sha=None
              try:
                  req=urllib.request.Request(api,headers=headers)
                  with urllib.request.urlopen(req,timeout=12) as r: sha=json.loads(r.read().decode())["sha"]
              except Exception: pass
              payload={"message":message,"content":base64.b64encode(content.encode()).decode(),"branch":"main"}
              if sha: payload["sha"]=sha
              req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,"Content-Type":"application/json"},method="PUT")
              with urllib.request.urlopen(req,timeout=15) as r: return r.status

          result=None
          target=None
          discover_source=None

          # Primary: channel-confirmed LIVE IDs. Rank normal broadcasts ahead
          # of vertical feeds, independent of which provider answers first.
          for vid,source,title in discover()[:8]:
              r=try_video(vid)
              if r:
                  target,discover_source,result=vid,source,r
                  break

          # Secondary: previously published watch ID, but only if its video
          # metadata says this is a CURRENT live (not archived).
          if not result:
              try:
                  ktext,_=gh_get("youtube/output/kana.m3u")
                  km=re.search(r'(?:watch\?v=|/live/)([A-Za-z0-9_-]{11})',ktext)
                  if km:
                      current_id=km.group(1)
                      note("CURRENT_KANA_ID",current_id)
                      r=try_video(current_id)
                      if r:
                          target,discover_source,result=current_id,"kana-current-watch",r
              except Exception as e:
                  note("CURRENT_KANA_ID_FAIL",type(e).__name__,str(e)[:120])

          # Third: newest RSS entries, but only if the current published ID
          # could not produce a verified HLS.
          if not result:
              for cand in rss_candidates()[:4]:
                  if cand==target:
                      continue
                  r=try_video(cand)
                  if r:
                      target=cand
                      discover_source="youtube-rss-fallback"
                      result=r
                      break

          state={
              "ok":bool(result),"video_id":target,"discover_source":discover_source,
              "checked_at":dt.datetime.now(dt.timezone.utc).isoformat(),"log":logs[-60:]
          }

          if not result:
              try:
                  gh_put("youtube/state/kana_iptv_altapi.json",json.dumps(state,ensure_ascii=False,indent=2)+"\n","Update Kana IPTV Alt API diagnostics [skip ci]")
              except Exception: pass
              raise SystemExit("No verified AV HLS from public alternative APIs")

          state.update(result)
          playlist=(
              '#EXTM3U\n\n'
              '#EXTINF:-1 tvg-id="youtube.kana_tube_iptv" tvg-name="かなチューブ IPTV" '
              'tvg-logo="https://raw.githubusercontent.com/ajiousama/himitsu/main/youtube/logos/special/kana.png?v=ytv3-20260922b" '
              'group-title="今日の開催場",かなチューブ IPTV【LIVE】\n'
              +result["url"]+'\n'
          )
          note("PUBLISH_PLAYLIST",gh_put("youtube/output/kana_iptv.m3u",playlist,"Refresh Kana IPTV via Alt API [skip ci]"))
          note("PUBLISH_STATE",gh_put("youtube/state/kana_iptv_altapi.json",json.dumps(state,ensure_ascii=False,indent=2)+"\n","Update Kana IPTV Alt API state [skip ci]"))

          # FreeWiFi has ONE owner: youtube/manager.py sync_freewifi().
          # Direct edits from here used to overwrite the stable two-slot block.
          # Only update the dedicated playlists; the 5-minute YouTube worker
          # syncs both entries into FreeWiFi without rolling back layout.
          kana_body=(
              '#EXTINF:-1 tvg-id="youtube.kana_tube" tvg-name="かなチューブ" '
              'tvg-logo="https://raw.githubusercontent.com/ajiousama/himitsu/main/youtube/logos/special/kana.png?v=ytv3-20260922b" '
              'group-title="今日の開催場",かなチューブ【YouTube】\n'
              +'https://www.youtube.com/watch?v='+target
          )
          note("PUBLISH_KANA",gh_put(
              "youtube/output/kana.m3u",
              "#EXTM3U\n\n"+kana_body+"\n",
              "Update verified-current Kana YouTube watch ID [skip ci]",
          ))
          PY
          python3 -m py_compile /tmp/kana_altapi.py
          python3 /tmp/kana_altapi.py

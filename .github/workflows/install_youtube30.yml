name: Install YouTube 30 Logos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install logos
        run: |
          rm -rf /tmp/youtube30
          mkdir -p /tmp/youtube30 logos/youtube
          unzip -o _tmp/youtube30_trim80.zip -d /tmp/youtube30
          cp -f /tmp/youtube30/*.png logos/youtube/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add logos/youtube
          git commit -m 'Replace YouTube logos with 30-logo set' || exit 0
          git push

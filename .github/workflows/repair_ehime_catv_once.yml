name: Repair Ehime CATV logos once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair_ehime_catv_once.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore original CATV logos and cache-bust Ainan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          repair_once() {
            git fetch origin main
            git reset --hard origin/main

            # Restore only the 13 CATV logos accidentally redesigned.
            git checkout fa5bdae4224cc2f3e9bf82bc22880e1148019bd3 -- \
              logos/ehime_catv/01_town_premium.png \
              logos/ehime_catv/02_town_news24.png \
              logos/ehime_catv/03_machicam24.png \
              logos/ehime_catv/04_info.png \
              logos/ehime_catv/05_program_promo.png \
              logos/ehime_catv/06_event_premium.png \
              logos/ehime_catv/07_event_selection.png \
              logos/ehime_catv/08_ehime_channel.png \
              logos/ehime_catv/09_ehime_bousai.png \
              logos/ehime_catv/10_igo_shogi.png \
              logos/ehime_catv/11_fishing_vision.png \
              logos/ehime_catv/12_cnnj.png \
              logos/ehime_catv/13_nikkei_cnbc.png

            # The approved Ainan artwork is already in 14_ainan_livecam.png.
            # Give it a new URL so IPTV apps cannot keep showing the cached old image.
            cp logos/ehime_catv/14_ainan_livecam.png logos/ehime_catv/14_ainan_livecam_v2.png

            python - <<'PY'
          from pathlib import Path
          p = Path('freewifi')
          s = p.read_text(encoding='utf-8-sig')
          old = 'https://raw.githubusercontent.com/ajiousama/himitsu/main/logos/ehime_catv/14_ainan_livecam.png'
          new = 'https://raw.githubusercontent.com/ajiousama/himitsu/main/logos/ehime_catv/14_ainan_livecam_v2.png'
          if 'tvg-id="ecatv.ainan_livecam"' not in s:
              raise SystemExit('Ainan channel missing from freewifi')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

            # Exact binary checks for the restored originals.
            test "$(git hash-object logos/ehime_catv/01_town_premium.png)" = "bdaf6aca1bfe5f81a77e2a6aaf6081496fba9e54"
            test "$(git hash-object logos/ehime_catv/02_town_news24.png)" = "b015f0885a40ddebd793fcdf781a1aa43155528c"
            test "$(git hash-object logos/ehime_catv/03_machicam24.png)" = "c116185ce73e39ecc5588d77392c9ef51535a144"
            test "$(git hash-object logos/ehime_catv/04_info.png)" = "798f45ea8b9e45c85bd87be6e33c9d80d93f4324"
            test "$(git hash-object logos/ehime_catv/05_program_promo.png)" = "6ada6101986d0898c7095a3a6950a68c754bb918"
            test "$(git hash-object logos/ehime_catv/06_event_premium.png)" = "261d71ef0dd65338df0241e28d6a9cf0b4e4ae53"
            test "$(git hash-object logos/ehime_catv/07_event_selection.png)" = "1601a3d7377cd15953edb0ee51b80faa3eda2e24"
            test "$(git hash-object logos/ehime_catv/08_ehime_channel.png)" = "d9b9cbc5aaee3d2934529d01031077277b8e7c9a"
            test "$(git hash-object logos/ehime_catv/09_ehime_bousai.png)" = "9f1dca5596e179bab697475dc34b086bc902ac9f"
            test "$(git hash-object logos/ehime_catv/10_igo_shogi.png)" = "afa6a461e52d5430c304cb2a4913eb5228fea5a5"
            test "$(git hash-object logos/ehime_catv/11_fishing_vision.png)" = "e1cf78b6f7acc5925fabdae623b91a6c082b86dd"
            test "$(git hash-object logos/ehime_catv/12_cnnj.png)" = "e64357bbea4f59ea7cbe88277f85d374f9c214b1"
            test "$(git hash-object logos/ehime_catv/13_nikkei_cnbc.png)" = "336db4cb33da22fa83a0b05f474be99169a91443"
            test "$(git hash-object logos/ehime_catv/14_ainan_livecam_v2.png)" = "028b4b64bdc709089073b2bf013cff5f7c56de35"
            grep -q 'tvg-id="ecatv.ainan_livecam".*14_ainan_livecam_v2.png' freewifi

            git add freewifi logos/ehime_catv
            if git diff --cached --quiet; then
              echo "Ehime CATV logos already repaired"
              return 0
            fi
            git commit -m "Restore Ehime CATV logos and refresh Ainan logo [skip ci]"
            git push origin HEAD:main
          }

          for attempt in 1 2 3 4; do
            echo "repair attempt $attempt/4"
            if repair_once; then
              exit 0
            fi
            sleep 2
          done
          exit 1

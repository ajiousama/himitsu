name: Preserve ganble history

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ganble/playlist.m3u"
      - "snapshot_text_file.py"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: preserve-ganble-history
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Save immutable snapshot
        run: python snapshot_text_file.py ganble/playlist.m3u history/ganble
      - name: Commit new snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/ganble
          if git diff --cached --quiet; then
            echo "No new source version"
            exit 0
          fi
          git commit -m "Archive ganble source version [skip ci] [skip render]"
          git pull --rebase origin main
          git push origin HEAD:main

name: Check Radiko Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radiko_proxy_core.py"
      - "radiko_epg.py"
      - "radiko_public_front.py"
      - "radiko_public_selftest.py"
      - "radiko_public_start.bat"
      - ".github/workflows/radiko_gateway_check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Radiko gateway sources
        run: python -m py_compile radiko_proxy_core.py radiko_epg.py radiko_public_front.py radiko_public_selftest.py
      - name: Verify HTTPS forwarding contract
        run: |
          grep -q 'X-Forwarded-Proto.*https' radiko_public_front.py
          grep -q 'RADIKO_PUBLIC_HOST' radiko_public_start.bat
          grep -q 'funnel --bg --yes 9396' radiko_public_start.bat
          grep -q 'radiko_public_selftest.py.*live/KBS' radiko_public_start.bat
          echo 'Radiko HTTPS front contract OK'

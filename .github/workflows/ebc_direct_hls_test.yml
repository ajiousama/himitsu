name: EBC November 14 historical resolver test
on:
  push:
    branches: ['test/ebc-direct-hls-20261125']
    paths: ['.github/workflows/ebc_direct_hls_test.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install historical resolver candidate and recover exact source
        run: |
          git show be7add994c837868d90947738cadbd6ee201ea8a:youtube/manager.py > "$RUNNER_TEMP/manager_nov14.py"
          python -m pip install --upgrade pip
          python - <<'PY'
          import json, urllib.request, datetime, subprocess, pathlib, os
          from pip._vendor.packaging.version import Version
          cutoff=datetime.datetime.fromisoformat("2026-11-14T14:58:36+00:00")
          data=json.load(urllib.request.urlopen("https://pypi.org/pypi/yt-dlp/json",timeout=25))
          eligible=[v for v,files in data["releases"].items() if files and any(not f.get("yanked") and datetime.datetime.fromisoformat(f["upload_time_iso_8601"].replace("Z","+00:00"))<=cutoff for f in files)]
          version=max(eligible,key=Version)
          subprocess.check_call(["python","-m","pip","install","yt-dlp[default]=="+version,"curl_cffi"])
          pathlib.Path(os.environ["RUNNER_TEMP"],"historical_version.txt").write_text(version)
          PY
      - name: Restore configured authentication
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            umask 077
            printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/ebc_youtube_cookies.txt"
          fi
      - name: Test exact November 14 direct_hls function
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import importlib.util, pathlib, os, json, subprocess, datetime
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          spec=importlib.util.spec_from_file_location("historical_manager", temp/"manager_nov14.py")
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          m.COOKIES=temp/"ebc_youtube_cookies.txt"
          target="https://www.youtube.com/watch?v=L9OqeSJgzKA"
          result={"source_commit":"be7add994c837868d90947738cadbd6ee201ea8a","checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"video_id":"L9OqeSJgzKA","version_basis":"latest PyPI release uploaded by November 14 snapshot; actual historical runner version unknown","yt_dlp_version":subprocess.check_output(["yt-dlp","--version"],text=True).strip(),"node_version":subprocess.check_output(["node","--version"],text=True).strip(),"cookie_configured":m.COOKIES.exists() and m.COOKIES.stat().st_size>20,"direct_hls":None,"streams":[]}
          original=m.run_ytdlp
          def diagnostic(args,timeout=40):
              p=original(args,timeout)
              result["exit"]=p.returncode
              result["reason"]=m.classify(p.stderr)
              return p
          m.run_ytdlp=diagnostic
          try:
              url,reason=m.direct_hls(target)
              result["reason"]=reason
              result["url_returned"]=bool(url)
              if url and (".m3u8" in url or "manifest.googlevideo.com/" in url):
                  result["direct_hls"]=url
                  p=subprocess.run(["ffprobe","-v","error","-rw_timeout","10000000","-show_entries","stream=codec_name,codec_type,width,height","-of","json",url],capture_output=True,text=True,timeout=35)
                  result["ffprobe_exit"]=p.returncode
                  if p.returncode==0: result["streams"]=json.loads(p.stdout).get("streams",[])
          except Exception as e:
              result["exception"]=type(e).__name__
          result["verified_video"]=any(s.get("codec_type")=="video" for s in result["streams"])
          with open("diagnostics/ebc_direct_hls_nov14_result.json","w") as f: json.dump(result,f,indent=2)
          print(json.dumps({k:v for k,v in result.items() if k!="direct_hls"}))
          PY
      - name: Cleanup authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/ebc_youtube_cookies.txt"
      - name: Save isolated result
        if: always()
        run: |
          if test -f diagnostics/ebc_direct_hls_nov14_result.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/ebc_direct_hls_nov14_result.json
            git commit -m "Record November 14 EBC historical resolver probe"
            git push origin HEAD:refs/heads/test/ebc-direct-hls-20261125
          fi

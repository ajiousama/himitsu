name: EBC direct HLS isolated test
on:
  push:
    branches: ['test/ebc-direct-hls-20261125']
    paths: ['.github/workflows/ebc_direct_hls_test.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]" curl_cffi
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Restore configured YouTube authentication
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            umask 077
            printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/ebc_youtube_cookies.txt"
          fi
      - name: Probe direct playback
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json, subprocess, datetime, os, pathlib
          cookie_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ebc_youtube_cookies.txt"
          cookie_args = ["--cookies",str(cookie_file)] if cookie_file.exists() and cookie_file.stat().st_size > 20 else []
          target = "https://www.youtube.com/watch?v=L9OqeSJgzKA"
          result = {"video_id":"L9OqeSJgzKA","checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"test":"august_environment","cookie_configured":bool(cookie_args),"yt_dlp_version":subprocess.check_output(["yt-dlp","--version"],text=True).strip(),"attempts":[],"direct_hls":None,"streams":[]}
          for fmt in ("best[protocol^=m3u8]","best"):
              cmd=["yt-dlp","--js-runtimes","node","--no-warnings","--no-cache-dir","--socket-timeout","10","--retries","1","--fragment-retries","1","--extractor-args","youtube:player_client=default,web_safari,web","--no-playlist","--match-filter","is_live","-f",fmt,"-g",target]
              try:
                  p=subprocess.run(cmd[:1]+cookie_args+cmd[1:],capture_output=True,text=True,timeout=40)
                  urls=[x.strip() for x in p.stdout.splitlines() if x.startswith("https://")]
                  result["attempts"].append({"format":fmt,"exit":p.returncode,"stderr":p.stderr[-2500:],"url_count":len(urls)})
                  if p.returncode or len(urls)!=1 or "m3u8" not in urls[0]: continue
                  result["direct_hls"]=urls[0]
                  q=subprocess.run(["ffprobe","-v","error","-rw_timeout","10000000","-show_entries","stream=codec_name,codec_type,width,height","-of","json",urls[0]],capture_output=True,text=True,timeout=35)
                  result["ffprobe_exit"]=q.returncode
                  result["ffprobe_error"]=q.stderr[-2500:]
                  if q.returncode==0: result["streams"]=json.loads(q.stdout).get("streams",[])
                  if result["streams"]: break
              except Exception as e: result["attempts"].append({"format":fmt,"error":str(e)})
          result["verified_video"]=any(s.get("codec_type")=="video" for s in result["streams"])
          with open("diagnostics/ebc_direct_hls_august_result.json","w") as f: json.dump(result,f,indent=2,ensure_ascii=False)
          print(json.dumps({k:v for k,v in result.items() if k!="direct_hls"},ensure_ascii=False))
          PY
      - name: Cleanup configured authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/ebc_youtube_cookies.txt"
      - name: Save isolated test result
        if: always()
        run: |
          if test -f diagnostics/ebc_direct_hls_august_result.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/ebc_direct_hls_august_result.json
            git commit -m "Record isolated EBC direct HLS probe"
            git push origin HEAD:refs/heads/test/ebc-direct-hls-20261125
          fi

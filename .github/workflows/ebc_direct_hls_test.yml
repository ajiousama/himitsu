name: Kana MID 720p isolated read-only playback test
on:
  push:
    branches: ['test/ebc-direct-hls-20261125']
    paths: ['.github/workflows/ebc_direct_hls_test.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install resolver
        run: python -m pip install --upgrade --pre 'yt-dlp[default]' curl_cffi
      - name: Verify official current MID and test format 95
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import os, json, subprocess, datetime, tempfile, pathlib
          result={"checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"format":"95","video_id":None,"verified_av":False,"attempts":[]}
          with tempfile.TemporaryDirectory() as tmp:
              args=["yt-dlp","--js-runtimes","node","--no-cache-dir","--socket-timeout","10","--retries","1","--no-playlist"]
              if os.environ.get("YOUTUBE_COOKIES"):
                  p=pathlib.Path(tmp)/"cookies.txt"
                  p.write_text(os.environ["YOUTUBE_COOKIES"])
                  p.chmod(0o600)
                  args+=["--cookies",str(p)]
              try:
                  p=subprocess.run(args+["--dump-single-json","--ignore-no-formats-error","https://www.youtube.com/@kana_tube/live"],capture_output=True,text=True,timeout=45)
                  result["discovery_exit"]=p.returncode
                  result["discovery_error"]=p.stderr[-1200:]
                  info=json.loads(p.stdout) if p.stdout.strip() else {}
                  title=info.get("title") or ""
                  result.update(video_id=info.get("id"),title=title,live_status=info.get("live_status"),channel_id=info.get("channel_id"))
                  if info.get("channel_id")=="UCmHdGDdZGf4cMWRBmEw4Xww" and info.get("live_status")=="is_live" and ("11/25" in title or "11月25日" in title) and ("ミッドナイト" in title or "MID" in title.upper()) and "縦型" not in title:
                      result["official_mid_verified"]=True
                      q=subprocess.run(args+["--match-filter","is_live","-f","95","-g","https://www.youtube.com/watch?v="+info["id"]],capture_output=True,text=True,timeout=45)
                      result["extract_exit"]=q.returncode
                      result["extract_error"]=q.stderr[-1200:]
                      urls=[s.strip() for s in q.stdout.splitlines() if s.startswith("https://")]
                      if q.returncode==0 and len(urls)==1 and ("m3u8" in urls[0] or "manifest.googlevideo.com/" in urls[0]):
                          result["hls_obtained"]=True
                          f=subprocess.run(["ffprobe","-v","error","-rw_timeout","10000000","-read_intervals","%+6","-show_streams","-show_packets","-show_entries","stream=index,codec_type,codec_name,width,height:packet=stream_index","-of","json",urls[0]],capture_output=True,text=True,timeout=45)
                          result["ffprobe_exit"]=f.returncode
                          if f.returncode==0:
                              d=json.loads(f.stdout)
                              streams=d.get("streams",[])
                              packet_ids={v.get("stream_index") for v in d.get("packets",[])}
                              result["streams"]=streams
                              result["verified_av"]=all(any(s.get("codec_type")==t and s.get("index") in packet_ids for s in streams) for t in ("audio","video"))
                              if result["verified_av"]:
                                  result["direct_hls"]=urls[0]
                  else:
                      result["official_mid_verified"]=False
              except Exception as e:
                  result["exception"]=type(e).__name__
          pathlib.Path("diagnostics/kana_mid_720p_result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Save diagnostic only
        if: always()
        run: |
          if test -f diagnostics/kana_mid_720p_result.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics/kana_mid_720p_result.json
            git commit -m 'Record isolated Kana MID format 95 test'
            git push origin HEAD:refs/heads/test/ebc-direct-hls-20261125
          fi

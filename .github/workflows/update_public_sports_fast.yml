name: Update Public Sports Fast

on:
  workflow_dispatch:
  schedule:
    # Lightweight KEIRIN / AutoRace / NAR refresh every 10 minutes.
    - cron: "2,12,22,32,42,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "public_sports_epg_local.py"
      - "sports_race_time.py"
      - "normalize_race_epg_switch.py"
      - "publish_public_sports.py"
      - "test_normalize_race_epg_switch.py"
      - "youtube/test_manager.py"
      - "public_sports_epg_local_fast.py"
      - "freewifi_today_public_sports.py"
      - "freewifi_today_jra.py"
      - "epg/jra_epg_merge.py"
      - "test_publish_public_sports.py"
      - "check_gch_always.py"
      - "ganble/playlist.m3u"
      - "ganble/epg.xml"
      - "ganble/fast_publish_keirin_epg.py"
      - "finalize_today_public_sports.py"
      - ".github/workflows/update_public_sports_fast.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-public-sports-fast
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Keep Patapata TV awake
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 30 --retry 2 --retry-delay 1             https://freewifi-patapata-tv-final.onrender.com/health             >/dev/null || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build fresh direct public-sports EPG
        run: python -u public_sports_epg_local_fast.py

      - name: Snapshot non-BOAT fast result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-sports-fast
          cp public_sports_epg_local.xml /tmp/public-sports-fast/generated.xml
          cp verified_daily_status.json /tmp/public-sports-fast/verified.json

      - name: Publish non-BOAT state without overwriting BOAT
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python publish_public_sports.py --merge-fresh /tmp/public-sports-fast/generated.xml /tmp/public-sports-fast/verified.json

            python freewifi_today_public_sports.py
            # Always republish JRA's GCH MAIN/5002 routes, even on
            # days without scheduled races; this job runs every ten minutes.
            python freewifi_today_jra.py
            # Refresh the regional JRA HQ/LQ EPG with the same venue mapping
            # in the 10-minute loop, not just in the hourly full rebuild.
            python -m epg.jra_epg_merge
            python finalize_today_public_sports.py
            python build_today_event_counts.py

            # Final shared race boundaries: no fast refresh may restore the 6-minute 1R.
            python -m unittest -v test_normalize_race_epg_switch test_publish_public_sports
            python publish_public_sports.py
            # ganble is a separate legacy consumer; project only its KEIRIN rows
            # from the already-normalized canonical source.
            python ganble/fast_publish_keirin_epg.py
            python normalize_race_epg_switch.py ganble/epg.xml
            python normalize_race_epg_switch.py --check ganble/epg.xml

            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("today_public_sports_status.json").read_text(encoding="utf-8-sig"))
          if not d.get("generated_at"):
              raise SystemExit("today_public_sports_status.json missing generated_at")
          channels = d.get("channels") or {}
          counts = {
              "keirin": sum(k.startswith("keirin.") for k in channels),
              "auto": sum(k.startswith("auto.") for k in channels),
              "chihou": sum(k.startswith("chihou.") for k in channels),
          }
          print("PUBLIC SPORTS FAST:", counts, "generated_at=", d["generated_at"])
          PY

            # No race-day exception: all three protected GCH routes must survive.
            python check_gch_always.py
            python scripts/check_tv_source_partition.py
            # Do not publish public-sports changes that silently erase Kana IPTV.
            python -m unittest -v youtube.test_manager

            git add public_sports_epg_local.xml verified_daily_status.json freewifi today_public_sports_status.json today_jra_status.json today_event_counts.json ganble/epg.xml guides.xml
            if git diff --cached --quiet; then
              echo "Public sports fast state already current"
              exit 0
            fi
            git commit -m "Refresh public sports fast state [skip ci] [skip render]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main moved; retrying public sports fast publish"
            sleep 1
          done

          echo "::error::Public sports fast publish failed after retries"
          exit 1

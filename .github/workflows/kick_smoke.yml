name: KICK Smoke Test

on:
  push:
    paths:
      - '.github/workflows/kick_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet curl_cffi
      - name: Test KICK updater
        run: |
          python kick_update.py
          grep -q '# === KICK_MANAGED_START ===' freewifi
          grep -q '# === KICK_MANAGED_END ===' freewifi
          grep -A20 '# === KICK_MANAGED_START ===' freewifi | head -n 24

name: Finish NHK Radio TV after Vercel limit resets

on:
  workflow_dispatch:
  schedule:
    # 09:20 and 16:20 JST. Stops doing work once all 16 are switched.
    - cron: '20 0,7 * * *'

permissions:
  contents: write

concurrency:
  group: finish-nhk-radio-tv
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether all 16 are already complete
        id: state
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -c '^https://ajiousama-radiko.onrender.com/radio-tv/' freewifi || true)
          echo "render_count=$count"
          if [ "$count" -eq 16 ]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Osaka Vercel NHK relay is deployed
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='https://himitsu-six.vercel.app/api/radio-tv?station=nhk_r1_osaka&stage=audio'
          if curl -fsS --max-time 35 "$URL" | grep -q 'relay='; then
            echo 'NHK relay already deployed'
            exit 0
          fi

          # The relay code is already committed. Push one empty commit to make
          # Git integration retry after Vercel's Hobby build-rate limit resets.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git commit --allow-empty -m 'Retry Vercel Osaka NHK relay deployment'
          git push origin HEAD:main

          ok=0
          for i in $(seq 1 36); do
            sleep 15
            if body=$(curl -fsS --max-time 35 "$URL" 2>/dev/null) && grep -q 'relay=' <<<"$body"; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          echo 'Osaka NHK relay deployed'

      - name: Validate NHK playlist, AES key and AAC relay through Osaka
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request

          stations = ['nhk_r1_osaka','nhk_fm_osaka','nhk_r1_matsuyama','nhk_fm_matsuyama']
          base = 'https://himitsu-six.vercel.app/api/radio-tv'
          for station in stations:
              url = f'{base}?station={station}&stage=audio'
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  text = r.read().decode('utf-8','replace')
              if '#EXTM3U' not in text or 'relay=' not in text:
                  raise SystemExit(f'{station}: relay playlist missing')

              key = re.search(r'URI="([^"]*relay=[^"]+)"', text)
              segment = next((ln.strip() for ln in text.splitlines() if ln.strip() and not ln.startswith('#') and 'relay=' in ln), None)
              if not key or not segment:
                  raise SystemExit(f'{station}: relay key/segment missing')

              for label, target, minimum in [('key', key.group(1), 16), ('segment', segment, 1000)]:
                  q = urllib.request.Request(target, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(q, timeout=40) as r:
                      data = r.read()
                      status = getattr(r, 'status', 200)
                  if status != 200 or len(data) < minimum:
                      raise SystemExit(f'{station}: {label} relay bad status={status} bytes={len(data)}')
                  print(station, label, 'OK', len(data))
          PY

      - name: Point Render NHK inputs at Osaka relay playlists
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('radio_tv.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'https://simul2.drdi.st.nhk/live/12/joined/master.m3u8': 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_r1_osaka&stage=audio',
              'https://simul2.drdi.st.nhk/live/13/joined/master.m3u8': 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_fm_osaka&stage=audio',
              'https://simul2.drdi.st.nhk/live/16/joined/master.m3u8': 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_r1_matsuyama&stage=audio',
              'https://simul2.drdi.st.nhk/live/17/joined/master.m3u8': 'https://himitsu-six.vercel.app/api/radio-tv?station=nhk_fm_matsuyama&stage=audio',
          }
          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed += 1
          p.write_text(text, encoding='utf-8')
          print('NHK Render input replacements:', changed)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio_tv.py
          if ! git diff --cached --quiet; then
            git commit -m 'Feed Render NHK radio from Osaka Vercel relay'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for Render and verify all four NHK A/V muxes
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ajiousama-radiko.onrender.com/radio-debug'

          # Wait for the first station to prove the new Render deployment is live.
          ready=0
          for i in $(seq 1 30); do
            if body=$(curl -fsS --max-time 55 "$BASE/nhk_r1_osaka" 2>/dev/null) \
              && grep -q '^ffmpeg_rc=0$' <<<"$body" \
              && bytes=$(sed -n 's/^output_bytes=//p' <<<"$body" | tail -1) \
              && [ -n "$bytes" ] && [ "$bytes" -gt 0 ]; then
              ready=1
              break
            fi
            sleep 20
          done
          test "$ready" -eq 1

          for station in nhk_r1_osaka nhk_fm_osaka nhk_r1_matsuyama nhk_fm_matsuyama; do
            ok=0
            for i in 1 2 3; do
              if body=$(curl -fsS --max-time 55 "$BASE/$station" 2>/dev/null) \
                && grep -q '^ffmpeg_rc=0$' <<<"$body" \
                && bytes=$(sed -n 's/^output_bytes=//p' <<<"$body" | tail -1) \
                && [ -n "$bytes" ] && [ "$bytes" -gt 0 ]; then
                echo "$station mux OK bytes=$bytes"
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" -eq 1
          done

      - name: Switch four NHK FreeWiFi entries only after all tests pass
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import re
          from pathlib import Path

          targets = {
              'nhk_r1_osaka': 'nhk_r1_osaka',
              'nhk_fm_osaka': 'nhk_fm_osaka',
              'nhk_r1_matsuyama': 'nhk_r1_matsuyama',
              'nhk_fm_matsuyama': 'nhk_fm_matsuyama',
          }
          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8-sig').splitlines()
          found = set()
          for i, line in enumerate(lines):
              if not line.lstrip().startswith('#EXTINF:'):
                  continue
              m = re.search(r'tvg-id="([^"]+)"', line)
              if not m or m.group(1) not in targets:
                  continue
              tvgid = m.group(1)
              j = i + 1
              while j < len(lines) and not lines[j].strip():
                  j += 1
              if j >= len(lines) or lines[j].lstrip().startswith('#'):
                  raise SystemExit(f'missing stream URL after {tvgid}')
              lines[j] = f'https://ajiousama-radiko.onrender.com/radio-tv/{targets[tvgid]}'
              found.add(tvgid)
          if found != set(targets):
              raise SystemExit('not all NHK entries found')
          p.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          count=$(grep -c '^https://ajiousama-radiko.onrender.com/radio-tv/' freewifi || true)
          echo "Final Render radio count: $count"
          test "$count" -eq 16

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git commit -m 'Complete 16 FreeWiFi radio image channels'
          git pull --rebase origin main
          git push origin HEAD:main

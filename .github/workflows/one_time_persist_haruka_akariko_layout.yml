name: One-time persist Haruka Akariko layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_persist_haruka_akariko_layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch persistent restorer
        shell: python
        run: |
          from pathlib import Path
          p = Path('restore_akariko_haru.py')
          s = p.read_text(encoding='utf-8')
          if 'from normalize_haruka_akariko import normalize_layout' not in s:
              s = s.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom normalize_haruka_akariko import normalize_layout\n', 1)
          s = s.replace('BASE = "http://haru.charandom.blog/stream/jp/"', 'BASE = "https://haru.charandom.blog/stream/jp/"')
          old = '    out = "\\n".join(lines).rstrip() + "\\n"\n'
          new = '    out = normalize_layout("\\n".join(lines).rstrip() + "\\n")\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('restore output line not found')
          p.write_text(s, encoding='utf-8')

      - name: Rebuild FreeWiFi
        run: python restore_akariko_haru.py

      - name: Verify requested layout
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('freewifi').read_text(encoding='utf-8')
          for stale in ('haruka1 ', 'haruka2 ', 'haruka3 ', 'ハルカ1', 'ハルカ2', 'ハルカ3', 'http://haru.charandom.blog/'):
              if stale in s:
                  raise SystemExit('stale value remains: ' + stale)
          if 'https://haru.charandom.blog/' not in s:
              raise SystemExit('HTTPS Akariko URLs missing')
          pattern = r'NHK G \(haruka\)\nhttp://haruka-ipip\.f5\.si:9394/stream/14\.m3u8\n\n#EXTINF:[^\n]*NHK G \(akariko\)\nhttps://haru\.charandom\.blog/stream/jp/nhk_g/stream-output\.m3u8\?mode=hls'
          if not re.search(pattern, s):
              raise SystemExit('NHK G Haruka -> Akariko order check failed')
          print('Haruka/Akariko layout verified')

      - name: Commit final changes
        shell: bash
        run: |
          rm -f .github/workflows/one_time_persist_haruka_akariko_layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restore_akariko_haru.py freewifi .github/workflows/one_time_persist_haruka_akariko_layout.yml
          git diff --cached --check
          git commit -m "Persist Haruka cleanup and Akariko ordering"
          git push

name: Replace Haruka host once

on:
  push:
    paths:
      - '.github/workflows/replace_haruka_host_once.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Haruka hosts in freewifi
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('freewifi')
          text = p.read_text(encoding='utf-8')
          before = text

          for host in (
              'haruka-ipip.f5.si',
              'haruka-ip.f5.si',
              'ha-ipip.f5.si',
              'ha-ip.f5.si',
          ):
              text = text.replace(f'http://{host}:9394/', 'http://118.68.167.114:9394/')
              text = text.replace(f'https://{host}:9394/', 'http://118.68.167.114:9394/')

          if text == before:
              raise SystemExit('No Haruka host URLs found in freewifi')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          git commit -m 'Point all Haruka streams to 118.68.167.114:9394'
          git push

name: Update HARU VOD

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'haru_vod.py'
      - 'haru_vod_clips.py'
      - 'haru_vod_freewifi.py'
      - 'haru_vod_favorites.json'
      - 'build_haru_kai_epg.py'
      - 'api/haru-clip.js'
      - 'assets/haru_vod/**'
      - '.github/workflows/update_haru_vod.yml'

permissions:
  contents: write

concurrency:
  group: update-haru-vod-standalone
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build HARU VOD and publish into FreeWiFi on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "HARU VOD publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            python build_haru_kai_epg.py
            HARU_EPG_URL="file://${GITHUB_WORKSPACE}/haru_kai_epg.xml" python haru_vod.py \
              --check \
              --probe-timeout 4 \
              --max-age-days 14 \
              --max-per-program 12
            python haru_vod_clips.py
            python haru_vod_freewifi.py
            git add haru_vod.m3u freewifi
            if git diff --cached --quiet; then
              echo 'HARU VOD / FreeWiFi already current'
              exit 0
            fi
            git commit -m 'Update HARU VOD in FreeWiFi [skip ci]'
            if git push origin HEAD:main; then
              echo 'HARU VOD / FreeWiFi published'
              exit 0
            fi
            sleep 2
          done
          echo '::error::HARU VOD / FreeWiFi publish failed after retries'
          exit 1

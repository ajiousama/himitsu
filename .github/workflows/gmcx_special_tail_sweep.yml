name: GCCX All Special Endings Visual Recheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gmcx_special_tail_sweep.py"
      - ".github/workflows/gmcx_special_tail_sweep.yml"

permissions:
  contents: read

concurrency:
  group: gccx-all-special-endings-review
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        task: [kai_after_live_fine, fivehour_after_live_fine, lemmings_late_fine]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install FFmpeg and Pillow
        shell: bash
        run: |
          python -m pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Capture actual frames around GCCX special endings
        run: python -u gmcx_special_tail_sweep.py --task ${{ matrix.task }}
      - name: Save visual review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gccx-ending-${{ matrix.task }}
          path: gmcx_special_tail_sweep/${{ matrix.task }}/*
          if-no-files-found: warn

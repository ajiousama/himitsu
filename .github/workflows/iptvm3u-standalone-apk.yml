name: Build IPTVM3U standalone APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iptvm3u-standalone-apk.yml'
      - 'apps/iptvm3u/build/patch_iptvm3u_assets.py'
      - 'apps/iptvm3u/build/iptvm3u-fixed.jks.b64'
      - '.iptvm3u-apk-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Download M3U IPTV 3.0.19 XAPK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/de.herber_edevelopment.m3uiptv?version=latest' \
            -o /tmp/m3uiptv.xapk
          test -s /tmp/m3uiptv.xapk
          unzip -t /tmp/m3uiptv.xapk >/dev/null

      - name: Extract and patch base APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/xapk /tmp/base
          mkdir -p /tmp/xapk /tmp/base
          unzip -q /tmp/m3uiptv.xapk -d /tmp/xapk
          BASE="/tmp/xapk/de.herber_edevelopment.m3uiptv.apk"
          test -f "$BASE"
          test -f /tmp/xapk/config.armeabi_v7a.apk
          unzip -q "$BASE" -d /tmp/base
          python3 apps/iptvm3u/build/patch_iptvm3u_assets.py /tmp/base
          rm -rf /tmp/base/META-INF
          rm -f /tmp/base/stamp-cert-sha256
          rm -f "$BASE"
          (cd /tmp/base && zip -qr "$BASE" .)
          ls -1 /tmp/xapk/*.apk

      - name: Download APKEditor
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar' \
            -o /tmp/APKEditor.jar
          test -s /tmp/APKEditor.jar

      - name: Merge all splits as real standalone APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar /tmp/APKEditor.jar m \
            -i /tmp/xapk \
            -o /tmp/iptvm3u-unsigned.apk \
            -extractNativeLibs true \
            -clean-meta
          test -s /tmp/iptvm3u-unsigned.apk
          unzip -l /tmp/iptvm3u-unsigned.apk | grep 'lib/armeabi-v7a/libffmpegJNI.so'
          unzip -l /tmp/iptvm3u-unsigned.apk | grep 'assets/player/'
          java -jar /tmp/APKEditor.jar info -package -min-sdk-version -target-sdk-version -activities -i /tmp/iptvm3u-unsigned.apk

      - name: Align and sign APK with fixed key
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          base64 -d apps/iptvm3u/build/iptvm3u-fixed.jks.b64 > /tmp/iptvm3u.jks
          keytool -list -keystore /tmp/iptvm3u.jks -storepass iptvm3u -alias iptvm3u >/dev/null
          "$BT/zipalign" -p -f 4 /tmp/iptvm3u-unsigned.apk /tmp/iptvm3u-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/iptvm3u.jks \
            --ks-pass pass:iptvm3u \
            --key-pass pass:iptvm3u \
            --out iptvm3u.apk \
            /tmp/iptvm3u-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs iptvm3u.apk
          mkdir -p apps/iptvm3u
          cp iptvm3u.apk apps/iptvm3u/iptvm3u.apk
          "$BT/aapt2" dump badging iptvm3u.apk | tee /tmp/badging.txt
          grep -q "package: name='de.herber_edevelopment.m3uiptv'" /tmp/badging.txt
          grep -q 'launchable-activity:' /tmp/badging.txt
          "$BT/zipalign" -c -p 4 iptvm3u.apk
          sha256sum iptvm3u.apk
          cp iptvm3u.apk a.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvm3u-standalone-apk
          path: iptvm3u.apk
          if-no-files-found: error

      - name: Publish APK to main root
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f apps/iptvm3u/iptvm3u.apk iptvm3u.apk a.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'Publish universal standalone IPTVM3U APK [skip ci] [skip render]'
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

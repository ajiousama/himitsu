name: Move Green Channel to Keiba

on:
  push:
    paths:
      - '.github/workflows/move_greenchannel_to_keiba.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Change Green Channel group only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('freewifi')
          text = p.read_text(encoding='utf-8-sig')
          lines = text.splitlines(keepends=True)
          changed = 0
          out = []
          for line in lines:
              if line.startswith('#EXTINF:') and ('グリーンチャンネル' in line or 'Green Channel' in line):
                  new = re.sub(r'group-title="[^"]*"', 'group-title="競馬"', line)
                  if new != line:
                      changed += 1
                  line = new
              out.append(line)
          if changed == 0:
              raise SystemExit('No Green Channel EXTINF entries changed')
          p.write_text(''.join(out), encoding='utf-8')
          print(f'changed={changed}')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          git diff --cached --quiet && exit 0
          git commit -m "Move Green Channel to keiba group"
          git push

name: Rebuild Auto Race Venue Logos

# Manual only. Auto Race logo redesigns must never be triggered by ordinary
# FreeWiFi/public-sports maintenance.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-autorace-logo-writer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Generate
        run: python generate_autorace_logos.py
      - name: Validate
        run: |
          count=$(find logos/public_sports/venues -maxdepth 1 -type f -name 'autorace_*.png' | wc -l)
          test "$count" -ge 5
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A logos/public_sports/venues/autorace_*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild unified Auto Race venue logos [skip render]'
          git pull --rebase origin main
          git push origin main

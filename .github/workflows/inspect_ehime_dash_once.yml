name: Inspect Ehime CATV DASH structure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_ehime_dash_once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect MPD structure
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          for name in ('hc_town_news_24','hc_machi_cam_24'):
              url=f'https://cdn.e-catv.ne.jp/mpeg-dash/{name}/dash.mpd'
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=8).read()
              root=ET.fromstring(data)
              ns={'d':'urn:mpeg:dash:schema:mpd:2011'}
              print('\n###',name,'###')
              print('ROOT',root.attrib)
              for pidx,period in enumerate(root.findall('d:Period',ns)):
                  print('PERIOD',pidx,period.attrib)
                  for aidx,aset in enumerate(period.findall('d:AdaptationSet',ns)):
                      print(' ADAPT',aidx,aset.attrib)
                      st=aset.find('d:SegmentTemplate',ns)
                      if st is not None:
                          print('  SEGMENT_TEMPLATE',st.attrib)
                          tl=st.find('d:SegmentTimeline',ns)
                          if tl is not None:
                              ss=tl.findall('d:S',ns)
                              print('  TIMELINE_COUNT',len(ss),'LAST', [s.attrib for s in ss[-8:]])
                      for ridx,rep in enumerate(aset.findall('d:Representation',ns)):
                          print('  REP',ridx,rep.attrib)
                          st2=rep.find('d:SegmentTemplate',ns)
                          if st2 is not None:
                              print('   REP_SEGMENT_TEMPLATE',st2.attrib)
                              tl=st2.find('d:SegmentTimeline',ns)
                              if tl is not None:
                                  ss=tl.findall('d:S',ns)
                                  print('   REP_TIMELINE_COUNT',len(ss),'LAST', [s.attrib for s in ss[-8:]])
          PY

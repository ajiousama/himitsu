name: One-time reorder Akariko after Haruka

on:
  push:
    paths:
      - ".github/workflows/one_time_reorder_akariko_after_haruka.yml"

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move Akariko block after Haruka
        shell: python
        run: |
          from pathlib import Path

          p = Path("freewifi")
          text = p.read_text(encoding="utf-8")

          start = "# === AKARIKO_HARU_MANAGED_START ==="
          end = "# === AKARIKO_HARU_MANAGED_END ==="

          a = text.index(start)
          b = text.index(end, a) + len(end)
          epos = b
          while epos < len(text) and text[epos] in "\r\n":
              epos += 1

          block = text[a:b].strip() + "\n\n"
          rest = text[:a] + text[epos:]

          bad = ["haruka1", "haruka3", "(ハルカ1)", "(ハルカ3)", "haruka2", "(ハルカ2)", "http://haru.charandom.blog/"]
          found = [x for x in bad if x in rest or x in block]
          if found:
              raise RuntimeError(f"Unexpected old tokens remain: {found}")

          lines = rest.splitlines(keepends=True)
          last_url_end = None
          for i, line in enumerate(lines):
              if line.startswith("#EXTINF") and ('group-title="haruka ' in line or "(haruka)" in line):
                  j = i + 1
                  while j < len(lines):
                      s = lines[j].strip()
                      if s and not s.startswith("#"):
                          last_url_end = j + 1
                          break
                      j += 1

          if last_url_end is None:
              raise RuntimeError("No surviving haruka entry found")

          insert_at = last_url_end
          while insert_at < len(lines) and not lines[insert_at].strip():
              insert_at += 1

          out = "".join(lines[:insert_at])
          if out and not out.endswith("\n\n"):
              if not out.endswith("\n"):
                  out += "\n"
              out += "\n"
          out += block
          out += "".join(lines[insert_at:])

          if out.count(start) != 1 or out.count(end) != 1:
              raise RuntimeError("Akariko markers not unique")
          last_haruka_pos = max(out.rfind('group-title="haruka '), out.rfind("(haruka)"))
          if last_haruka_pos < 0 or out.index(start) <= last_haruka_pos:
              raise RuntimeError("Akariko was not placed after Haruka")

          p.write_text(out, encoding="utf-8")

      - name: Commit playlist reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Place Akariko after haruka"
            git push
          fi

      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/one_time_reorder_akariko_after_haruka.yml
          git commit -m "Remove one-time Akariko reorder workflow"
          git push

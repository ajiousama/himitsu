name: Probe Community Radio Audio Once

on:
  push:
    paths:
      - ".github/workflows/probe_community_radio_audio_once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Probe Render community radio audio
        shell: bash
        run: |
          set -u
          failed=0
          for s in FMOTOKUNI FM845 BARIBARI; do
            echo "===== $s ====="
            url="https://ajiousama-radiko.onrender.com/radio-tv/${s}?v=20260908a"
            log="${s}.log"
            if timeout 55 ffmpeg -hide_banner -loglevel info -i "$url" -map 0:a:0 -t 8 -af volumedetect -f null - >"$log" 2>&1; then
              cat "$log"
              maxv="$(grep -oE 'max_volume: -?[0-9]+(\.[0-9]+)? dB' "$log" | tail -1 || true)"
              meanv="$(grep -oE 'mean_volume: -?[0-9]+(\.[0-9]+)? dB' "$log" | tail -1 || true)"
              if grep -q "Stream #0:.*Audio:" "$log" && [ -n "$maxv" ]; then
                echo "PASS $s $meanv / $maxv"
              else
                echo "FAIL $s no decodable audio level"
                failed=1
              fi
            else
              cat "$log"
              echo "FAIL $s playback/decode failed"
              failed=1
            fi
          done
          exit "$failed"

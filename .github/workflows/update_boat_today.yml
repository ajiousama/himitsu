name: Update BOAT Today iPhone Seed

on:
  workflow_dispatch:
  schedule:
    # 10分おき。UTC/JSTの時間帯境界で止まらないよう24時間単一cronにする。
    # 毎時ちょうどの混雑を避け、03/13/23/33/43/53分に実行。
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches:
      - main
    paths:
      - "boat_stream_seed.m3u"
      - "boat_iphone_seed_build.py"
      - "boat_v2_build.py"
      - ".github/workflows/update_boat_today.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-boat-today-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify and preserve iPhone BOAT seed
        shell: bash
        run: |
          set -euo pipefail
          test -s boat_stream_seed.m3u
          cp boat_stream_seed.m3u /tmp/boat_stream_seed.m3u.before
          streams="$(grep -Ec '^https?://' boat_stream_seed.m3u || true)"
          echo "iPhone BOAT seed streams=$streams"
          sha256sum boat_stream_seed.m3u

      - name: Build today's BOAT from iPhone seed only
        run: python -u boat_iphone_seed_build.py

      - name: Confirm workflow did not rewrite iPhone seed
        shell: bash
        run: |
          set -euo pipefail
          cmp -s /tmp/boat_stream_seed.m3u.before boat_stream_seed.m3u || {
            echo '::error::boat_stream_seed.m3u was modified by the workflow'
            exit 1
          }
          echo 'iPhone BOAT seed preserved byte-for-byte'

      - name: Publish BOAT state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          validate_boat() {
            python - <<'PY'
          import json, re
          from pathlib import Path

          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          if d.get('system') != 'boat-v2-iphone-seed':
              raise SystemExit(f"unexpected BOAT system: {d.get('system')}")

          visible = int(d.get('visible_count') or 0)
          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          if entries != visible:
              raise SystemExit(f'BOAT playlist mismatch: entries={entries} visible={visible}')
          if 'ajiousama-radiko.onrender.com/boat/' in body:
              raise SystemExit('cloud resolver URL leaked into TODAY_BOAT block')

          seed = Path('boat_stream_seed.m3u').read_text(encoding='utf-8-sig', errors='replace')
          for url in re.findall(r'(?m)^https?://\S+$', body):
              if url not in seed:
                  raise SystemExit('TODAY_BOAT contains a URL not present in iPhone seed')

          print('BOAT iPhone-seed validation OK:', 'visible=', visible, 'entries=', entries)
          PY
          }

          build_from_latest_seed() {
            cp boat_stream_seed.m3u /tmp/boat_stream_seed.m3u.before
            python -u boat_iphone_seed_build.py
            cmp -s /tmp/boat_stream_seed.m3u.before boat_stream_seed.m3u || {
              echo '::error::boat_stream_seed.m3u changed during build'
              return 1
            }
          }

          publish() {
            validate_boat || return 1
            git add freewifi today_boat_status.json boat_v2_state.json
            if git diff --cached --quiet; then
              echo "BOAT iPhone-seed state already current"
              return 0
            fi
            git commit -m "Update BOAT from iPhone one-click seed [skip ci]"
            git push origin HEAD:main
          }

          if publish; then
            exit 0
          fi

          for attempt in 2 3 4; do
            echo "BOAT main moved; rebuild from newest iPhone seed ($attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            build_from_latest_seed
            if publish; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::BOAT iPhone-seed publish failed after retries"
          exit 1

      - name: Validate final BOAT state
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          held = int(d.get('held_count') or 0)
          visible = int(d.get('visible_count') or 0)
          cards = int(d.get('card_count') or 0)
          print('BOAT iPhone seed cards=', cards, 'active=', held, 'visible=', visible)

          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          if entries != visible:
              raise SystemExit(f'BOAT playlist mismatch: entries={entries} visible={visible}')
          if held and not visible:
              print('::warning::BOAT active venue exists but iPhone seed has no currently valid URL; run Scriptable one-click')
          PY

name: Update BOAT Today V2 Resolver

on:
  workflow_dispatch:
  schedule:
    # 09:05-22:35 JST: refresh the held-venue list every 30 minutes.
    - cron: "5,35 0-13 * * *"
    # 23:05 JST: final cleanup after night racing.
    - cron: "5 14 * * *"
  push:
    branches:
      - main
    paths:
      - "boat_v2_build.py"
      - "api/boat.js"
      - ".github/workflows/update_boat_today.yml"

permissions:
  contents: write

# BOAT V2 owns only the BOAT block and BOAT state files.
concurrency:
  group: himitsu-boat-v2-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build BOAT V2 held venues
        run: python -u boat_v2_build.py

      - name: Validate BOAT V2 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          if d.get('system') != 'boat-v2-resolver':
              raise SystemExit('unexpected BOAT system')
          held = int(d.get('held_count') or 0)
          visible = int(d.get('visible_count') or 0)
          cards = int(d.get('card_count') or 0)
          print('BOAT V2 cards=', cards, 'held=', held, 'visible=', visible)
          if held != visible:
              raise SystemExit(f'BOAT V2 venue mismatch: held={held} visible={visible}')
          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          count = text.count('https://himitsu-six.vercel.app/api/boat?venue=')
          print('BOAT V2 resolver entries=', count)
          if count != visible:
              raise SystemExit(f'BOAT V2 playlist mismatch: resolver_entries={count} visible={visible}')
          PY

      - name: Publish BOAT V2 state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            git add freewifi today_boat_status.json boat_v2_state.json
            if git diff --cached --quiet; then
              echo "BOAT V2 state already current"
              return 0
            fi
            git commit -m "Update BOAT V2 current venues [skip ci]"
            git push origin HEAD:main
          }

          if publish; then
            exit 0
          fi

          for attempt in 2 3 4; do
            echo "BOAT V2 main moved; rebuild on latest main ($attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            python -u boat_v2_build.py
            if publish; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::BOAT V2 publish failed after retries"
          exit 1

name: Update BOAT Today V2 Resolver

on:
  workflow_dispatch:
  schedule:
    # 09:05-22:35 JST: refresh the current streaming/VTR window every 30 minutes.
    - cron: "5,35 0-13 * * *"
    # 23:05 JST: final cleanup after night racing.
    - cron: "5 14 * * *"
  push:
    branches:
      - main
    paths:
      - "boat_v2_build.py"
      - "boat_v2_render_guard.py"
      - "boat_cloud_resolver.py"
      - "radiko_cloud_start.py"
      - ".github/workflows/update_boat_today.yml"

permissions:
  contents: write

# BOAT acquisition is independent, but writes to the same physical freewifi
# file as the general updater, so both use one repository write mutex.
concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wake BOAT Render resolver
        shell: bash
        run: |
          set +e
          base='https://ajiousama-radiko.onrender.com'
          echo 'Waking Render service before BOAT probe...'
          curl -L -sS -o /tmp/render-wake.txt -w 'Render root HTTP=%{http_code}\n' \
            --connect-timeout 15 --max-time 45 "$base/" || true
          for attempt in 1 2 3; do
            code="$(curl -sS -o /tmp/boat-probe.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 45 \
              "$base/boat/05?debug=1" || true)"
            echo "BOAT Render warm probe $attempt/3 HTTP=${code:-000}"
            if [ "$code" = '200' ] || [ "$code" = '503' ]; then
              cat /tmp/boat-probe.json || true
              break
            fi
            sleep 5
          done
          set -e

      - name: Build BOAT V2 streaming window
        run: |
          python -u boat_v2_build.py
          python -u boat_v2_render_guard.py

      # Publish usable improvement first. If Render is unhealthy, the guard
      # keeps only still-valid direct fallbacks and validation stays red.
      - name: Publish BOAT V2 state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            git add freewifi today_boat_status.json boat_v2_state.json
            if git diff --cached --quiet; then
              echo "BOAT V2 state already current"
              return 0
            fi
            git commit -m "Update BOAT V2 current venues [skip ci]"
            git push origin HEAD:main
          }

          if publish; then
            exit 0
          fi

          for attempt in 2 3 4; do
            echo "BOAT V2 main moved; rebuild on latest main ($attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            python -u boat_v2_build.py
            python -u boat_v2_render_guard.py
            if publish; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::BOAT V2 publish failed after retries"
          exit 1

      - name: Validate BOAT V2 state
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          if d.get('system') != 'boat-v2-resolver':
              raise SystemExit('unexpected BOAT system')
          held = int(d.get('held_count') or 0)
          visible = int(d.get('visible_count') or 0)
          cards = int(d.get('card_count') or 0)
          ready = bool(d.get('resolver_ready'))
          probe = int(d.get('resolver_probe_status') or 0)
          waiting = d.get('scheduled_waiting') or []
          ended = d.get('ended_removed') or []
          print('BOAT V2 cards=', cards, 'active=', held, 'visible=', visible, 'resolver_ready=', ready, 'probe=', probe)
          print('BOAT V2 waiting=', waiting, 'ended=', ended)
          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          print('BOAT V2 playlist entries=', entries)
          if entries != visible:
              raise SystemExit(f'BOAT V2 playlist mismatch: entries={entries} visible={visible}')
          if held and visible != held:
              raise SystemExit(f'BOAT V2 venue mismatch: active={held} visible={visible}')
          if held and (not ready or probe not in (200, 503)):
              raise SystemExit(f'BOAT V2 Render resolver unhealthy: ready={ready} probe={probe}')
          PY

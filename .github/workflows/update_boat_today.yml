name: Update BOAT Today V2 Resolver

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 0-14 * * *"
  push:
    branches:
      - main
    paths:
      - "boat_v2_build.py"
      - "boat_v2_render_guard.py"
      - "boat_cloud_resolver.py"
      - "boat_streaks_refresh.py"
      - "boat_youtube_refresh.py"
      - "radiko_cloud_start.py"
      - ".github/workflows/update_boat_today.yml"

permissions:
  contents: write

concurrency:
  group: himitsu-boat-today-writer
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install BOAT live extractor
        run: |
          python -m pip install --disable-pip-version-check -q -U --pre 'yt-dlp[default]' curl_cffi
          yt-dlp --version

      - name: Refresh official BOATRACE Streaks primary
        run: python -u boat_streaks_refresh.py

      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          rm -f youtube_cookies.txt
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
            echo 'BOAT YouTube cookies restored'
          else
            echo '::warning::YOUTUBE_COOKIES is not set'
          fi

      - name: Refresh official YouTube BOAT emergency fallback
        run: python -u boat_youtube_refresh.py

      - name: Wake and probe current BOAT Render resolver
        shell: bash
        run: |
          set +e
          base='https://ajiousama-radiko.onrender.com'
          curl -L -sS -o /tmp/render-wake.txt -w 'Render root HTTP=%{http_code}\n' \
            --connect-timeout 8 --max-time 20 "$base/" || true
          probe_venue="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
              active=set(d.get('active_window') or [])
              for _tid,item in (d.get('venues') or {}).items():
                  if item.get('name') in active and item.get('jcd'):
                      print(item['jcd']); raise SystemExit
          except Exception:
              pass
          print('05')
          PY
          )"
          echo "BOAT active smoke venue=$probe_venue"
          code="$(curl -sS -o /tmp/boat-probe.json -w '%{http_code}' \
            --connect-timeout 8 --max-time 15 \
            "$base/boat/$probe_venue?debug=1" || true)"
          echo "BOAT Render playable probe HTTP=${code:-000}"
          cat /tmp/boat-probe.json 2>/dev/null || true
          set -e

      - name: Build BOAT V2 streaming window
        run: |
          python -u boat_v2_build.py
          python -u boat_v2_render_guard.py

      - name: Publish BOAT V2 state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          validate_boat() {
            python - <<'PY'
          import json, re
          from pathlib import Path
          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          if d.get('system') != 'boat-v2-resolver':
              raise SystemExit('unexpected BOAT system')
          visible = int(d.get('visible_count') or 0)
          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          if entries != visible:
              raise SystemExit(f'BOAT V2 playlist mismatch: entries={entries} visible={visible}')
          print('BOAT pre-publish validation OK:', 'visible=', visible, 'entries=', entries)
          PY
          }

          publish() {
            validate_boat || return 1
            git add freewifi today_boat_status.json boat_v2_state.json boat_stream_seed.m3u
            if git diff --cached --quiet; then
              echo "BOAT V2 state already current"
              return 0
            fi
            git commit -m "Update BOAT V2 current venues [skip ci]"
            git push origin HEAD:main
          }

          if publish; then
            exit 0
          fi

          for attempt in 2 3 4; do
            echo "BOAT V2 main moved; rebuild on latest main ($attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            python -u boat_streaks_refresh.py
            python -u boat_youtube_refresh.py
            python -u boat_v2_build.py
            python -u boat_v2_render_guard.py
            if publish; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::BOAT V2 publish failed after retries"
          exit 1

      - name: Validate BOAT V2 state
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          held = int(d.get('held_count') or 0)
          visible = int(d.get('visible_count') or 0)
          cards = int(d.get('card_count') or 0)
          ready = bool(d.get('resolver_ready'))
          probe = int(d.get('resolver_probe_status') or 0)
          print('BOAT V2 cards=', cards, 'active=', held, 'visible=', visible, 'resolver_ready=', ready, 'probe=', probe)
          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          if entries != visible:
              raise SystemExit(f'BOAT V2 playlist mismatch: entries={entries} visible={visible}')
          if held and not visible:
              print('::warning::BOAT active venue exists but no playable source is currently available')
          PY

      - name: Remove YouTube cookies
        if: always()
        run: rm -f youtube_cookies.txt

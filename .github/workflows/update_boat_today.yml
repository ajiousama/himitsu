name: Update BOAT Today Verified Hybrid

on:
  workflow_dispatch:
  schedule:
    # Rebuild every 5-10 minutes from current-day iPhone seed plus only
    # individually verified Render/JLC/Sakura resolver fallbacks.
    - cron: "3,13,23,33,43,53 * * * *"
    - cron: "8,18,28,38,48,58 * * * *"
  push:
    branches:
      - main
    paths:
      - "boat_stream_seed.m3u"
      - "boat_iphone_seed_build.py"
      - "boat_v2_build.py"
      - "boat_cloud_resolver.py"
      - "boat_cloud_resolver_fast.py"
      - "radiko_cloud_start.py"
      - ".github/workflows/update_boat_today.yml"

permissions:
  contents: write

# freewifi/guides writers share one mutex to prevent stale overwrite races.
concurrency:
  group: himitsu-freewifi-state-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify iPhone BOAT seed input
        shell: bash
        run: |
          set -euo pipefail
          test -s boat_stream_seed.m3u
          cp boat_stream_seed.m3u /tmp/boat_stream_seed.m3u.before
          streams="$(grep -Ec '^https?://' boat_stream_seed.m3u || true)"
          echo "iPhone BOAT seed streams=$streams"
          sha256sum boat_stream_seed.m3u

      - name: Build today's BOAT from current-day direct seed plus verified resolver fallback
        run: python -u boat_iphone_seed_build.py

      - name: Refresh current event counts after BOAT visibility update
        run: python build_today_event_counts.py

      - name: Confirm builder did not rewrite iPhone seed
        shell: bash
        run: |
          set -euo pipefail
          cmp -s /tmp/boat_stream_seed.m3u.before boat_stream_seed.m3u || {
            echo '::error::boat_stream_seed.m3u was modified by the builder'
            exit 1
          }
          echo 'iPhone BOAT seed preserved byte-for-byte during build'

      - name: Publish BOAT state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          validate_boat() {
            python - <<'PY'
          import json, re
          from pathlib import Path

          RENDER_PREFIX = 'https://ajiousama-radiko.onrender.com/boat/'
          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          if d.get('system') != 'boat-v2-iphone-seed':
              raise SystemExit(f"unexpected BOAT system: {d.get('system')}")

          visible = int(d.get('visible_count') or 0)
          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          if entries != visible:
              raise SystemExit(f'BOAT playlist mismatch: entries={entries} visible={visible}')

          seed = Path('boat_stream_seed.m3u').read_text(encoding='utf-8-sig', errors='replace')
          venues = d.get('venues') or {}
          reverse = {str(v.get('url') or ''): v for v in venues.values() if v.get('url')}
          for url in re.findall(r'(?m)^https?://\S+$', body):
              if url in seed:
                  continue
              if url.startswith(RENDER_PREFIX) and re.fullmatch(r'https://ajiousama-radiko\.onrender\.com/boat/(?:0?[1-9]|1\d|2[0-4])', url):
                  item = reverse.get(url) or {}
                  if item.get('verified_resolver') is True:
                      continue
                  raise SystemExit(f'unverified BOAT resolver URL in TODAY_BOAT: {url}')
              raise SystemExit(f'TODAY_BOAT contains unsupported URL: {url}')

          print('BOAT verified-hybrid validation OK:', 'visible=', visible, 'entries=', entries,
                'verified_resolver_count=', int(d.get('verified_resolver_count') or 0))
          PY
          }

          rebuild_from_latest_seed() {
            cp boat_stream_seed.m3u /tmp/boat_stream_seed.m3u.before
            python -u boat_iphone_seed_build.py
            python build_today_event_counts.py
            cmp -s /tmp/boat_stream_seed.m3u.before boat_stream_seed.m3u || {
              echo '::error::boat_stream_seed.m3u changed during build'
              return 1
            }
          }

          publish() {
            validate_boat || return 1
            git add freewifi today_boat_status.json boat_v2_state.json today_event_counts.json
            if git diff --cached --quiet; then
              echo "BOAT verified-hybrid state already current"
              return 0
            fi
            git commit -m "Update BOAT state from verified hybrid sources [skip ci]"
            git push origin HEAD:main
          }

          if publish; then
            exit 0
          fi

          for attempt in 2 3 4; do
            echo "BOAT main moved; rebuild from newest seed ($attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            rebuild_from_latest_seed
            if publish; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::BOAT verified-hybrid publish failed after retries"
          exit 1

      - name: Validate final BOAT state
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          d = json.loads(Path('today_boat_status.json').read_text(encoding='utf-8'))
          held = int(d.get('held_count') or 0)
          visible = int(d.get('visible_count') or 0)
          cards = int(d.get('card_count') or 0)
          verified = int(d.get('verified_resolver_count') or 0)
          print('BOAT cards=', cards, 'active=', held, 'visible=', visible, 'verified-resolver=', verified)

          text = Path('freewifi').read_text(encoding='utf-8-sig', errors='replace')
          m = re.search(r'# === TODAY_BOAT_START ===(.*?)# === TODAY_BOAT_END ===', text, re.S)
          body = m.group(1) if m else ''
          entries = len(re.findall(r'^#EXTINF:.*tvg-id="boat\.', body, re.M))
          if entries != visible:
              raise SystemExit(f'BOAT playlist mismatch: entries={entries} visible={visible}')
          if held and not visible:
              print('::warning::BOAT active venue exists but neither a current-day direct seed nor a verified resolver is playable')
          PY

name: Restore Akariko backups

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore_akariko_backups.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: himitsu-freewifi-writer
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Restore Akariko backup entries and disable retired-source cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          freewifi = Path('freewifi')
          text = freewifi.read_text(encoding='utf-8-sig', errors='replace')

          # Remove any partial/duplicate Akariko blocks first, then restore the exact
          # eight Kansai backup entries that were removed on 2026-08-30.
          lines = text.splitlines()
          out = []
          i = 0
          while i < len(lines):
              if lines[i].startswith('#EXTINF:'):
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith('#EXTINF:') and not lines[j].startswith('## ') and not lines[j].startswith('### ') and not lines[j].startswith('# ==='):
                      j += 1
                  block = lines[i:j]
                  low = '\n'.join(block).lower()
                  if 'akariko-bck1.sankuria.sbs' in low or 'akariko backup' in low:
                      i = j
                      continue
                  out.extend(block)
                  i = j
                  continue
              out.append(lines[i])
              i += 1
          text = '\n'.join(out).rstrip() + '\n'

          akariko = [
              ('NHK大阪・総合_jp', 'https://tvguide.myjcom.jp/monomedia/ch_logo/otd/logo-7FE0-011-400x400.png?', 'NHK G Osaka (akariko backup)', 'nhk_g_osaka'),
              ('読売テレビ_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_12.png', '読売テレビ (akariko backup)', 'ytv'),
              ('毎日テレビ_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_9.png', '毎日放送 (akariko backup)', 'mbs'),
              ('関西テレビ_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_11.png', '関西テレビ (akariko backup)', 'kansai_tv'),
              ('ABCテレビ_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_10.png', '朝日放送 (akariko backup)', 'abc'),
              ('テレビ大阪_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_13.png', 'テレビ大阪 (akariko backup)', 'tv_osaka'),
              ('KBS京都_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_14.png', 'KBS京都 (akariko backup)', 'kbs'),
              ('サンテレビ_jp', 'https://xuanzi-storage.netgenx.site/icons/icon_14.png', 'サンテレビ (akariko backup)', 'sun'),
          ]
          blocks = []
          for tvg_id, logo, name, slug in akariko:
              blocks.extend([
                  f'#EXTINF:-1 tvg-id="{tvg_id}" tvg-logo="{logo}" group-title="関西",{name}',
                  f'https://akariko-bck1.sankuria.sbs/stream/jp/{slug}/stream-output.m3u8?mode=hls',
                  '',
              ])
          restored = '\n'.join(blocks).rstrip() + '\n\n'

          # Put them into the terrestrial section; reorder_freewifi will group each
          # backup next to its station and keep the requested global group order.
          anchor = '### 関東\n'
          if anchor in text:
              text = text.replace(anchor, restored + anchor, 1)
          else:
              marker = '# === NAORI_MANAGED_START ==='
              if marker in text:
                  text = text.replace(marker, restored + marker, 1)
              else:
                  text = text.rstrip() + '\n\n' + restored
          freewifi.write_text(text, encoding='utf-8')

          # The normal YouTube updater was explicitly deleting Akariko. Remove that
          # hook and its negative validation so future refreshes keep these entries.
          wf = Path('.github/workflows/update_general_youtube.yml')
          w = wf.read_text(encoding='utf-8')
          w = w.replace("      - 'freewifi_retired_sources.py'\n", '')
          w = w.replace('      - name: Remove retired FreeWiFi sources\n        run: python freewifi_retired_sources.py\n', '')
          w = re.sub(r"^\s*! grep -Eiq 'akariko-bck1\\\\\.sankuria\\\\\.sbs\|akariko backup' freewifi\n", '', w, flags=re.M)
          # Fallback for the exact current validation line.
          w = '\n'.join(line for line in w.splitlines() if "! grep -Eiq 'akariko-bck1" not in line) + '\n'
          wf.write_text(w, encoding='utf-8')

          retired = Path('freewifi_retired_sources.py')
          if retired.exists():
              retired.unlink()

          # Normalize provider groups/order after restoration.
          import reorder_freewifi
          reorder_freewifi.main()

          result = freewifi.read_text(encoding='utf-8')
          if result.count('akariko-bck1.sankuria.sbs') != 8:
              raise SystemExit('Akariko restore count is not 8')
          for slug in ('nhk_g_osaka','ytv','mbs','kansai_tv','abc','tv_osaka','kbs','sun'):
              if f'/stream/jp/{slug}/stream-output.m3u8?mode=hls' not in result:
                  raise SystemExit(f'Missing Akariko stream: {slug}')
          if 'run: python freewifi_retired_sources.py' in w:
              raise SystemExit('Retired-source cleanup hook still enabled')
          print('Akariko backups restored:', result.count('akariko-bck1.sankuria.sbs'))
          PY

      - name: Commit restored Akariko backups
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/restore_akariko_backups.yml
          git add -A freewifi .github/workflows/update_general_youtube.yml freewifi_retired_sources.py .github/workflows/restore_akariko_backups.yml
          git commit -m 'Restore Akariko backup streams'
          git pull --rebase origin main
          git push origin main

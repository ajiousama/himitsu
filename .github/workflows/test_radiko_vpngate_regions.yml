name: Test radiko VPN Gate regions

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Probe VPN Gate Japan region detection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn

          python - <<'PY'
          import base64, csv, pathlib, urllib.request

          url = 'https://www.vpngate.net/api/iphone/'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')

          rows = []
          for line in text.splitlines():
              if not line or line.startswith('*') or line.startswith('#'):
                  continue
              try:
                  row = next(csv.reader([line]))
              except Exception:
                  continue
              if len(row) < 15 or not (row[5] == 'Japan' or row[6] == 'JP') or not row[14]:
                  continue
              try:
                  score = int(row[2] or 0)
                  speed = int(row[4] or 0)
              except ValueError:
                  score = speed = 0
              rows.append((score, speed, row[14]))

          if not rows:
              raise SystemExit('No VPN Gate Japan OpenVPN server found')

          rows.sort(reverse=True)
          out = pathlib.Path('/tmp/vpngate-jp-regions')
          out.mkdir(exist_ok=True)

          for i, (_, _, encoded) in enumerate(rows[:20], 1):
              try:
                  raw = base64.b64decode(encoded).decode('utf-8', 'replace').replace('\r\n', '\n')
              except Exception:
                  continue
              raw += '\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 10\n'
              (out / f'{i:02d}.ovpn').write_text(raw)

          configs = sorted(out.glob('*.ovpn'))
          if not configs:
              raise SystemExit('No usable VPN Gate Japan OpenVPN config found')
          print(f'Prepared {len(configs)} Japan VPN candidates')
          PY

          echo '=== VPN GATE RADIKO REGION PROBE ==='
          echo 'candidate,status,radiko_area'

          ATTEMPT=0
          SUCCESS=0
          for CFG in /tmp/vpngate-jp-regions/*.ovpn; do
            ATTEMPT=$((ATTEMPT + 1))
            LOG="/tmp/openvpn-region-${ATTEMPT}.log"
            PID="/tmp/openvpn-region-${ATTEMPT}.pid"

            sudo rm -f "$LOG" "$PID"
            sudo openvpn --config "$CFG" --daemon --writepid "$PID" --log "$LOG" || true

            CONNECTED=0
            for i in $(seq 1 18); do
              if sudo grep -q 'Initialization Sequence Completed' "$LOG" 2>/dev/null; then
                CONNECTED=1
                break
              fi
              if [ -f "$PID" ]; then
                VPNPID=$(sudo cat "$PID" 2>/dev/null || true)
                if [ -n "$VPNPID" ] && ! sudo kill -0 "$VPNPID" 2>/dev/null; then
                  break
                fi
              fi
              sleep 1
            done

            if [ "$CONNECTED" -eq 1 ]; then
              AREA=$(curl -fsSL --max-time 10 https://radiko.jp/area 2>/dev/null | sed -n 's/.*class="\([^"]*\)".*/\1/p' | head -1 || true)
              if [ -z "$AREA" ]; then
                AREA=$(curl -fsSL --max-time 10 https://radiko.jp/area 2>/dev/null | grep -o 'JP[0-9][0-9]*' | head -1 || true)
              fi
              [ -n "$AREA" ] || AREA='UNKNOWN'
              echo "${ATTEMPT},OK,${AREA}"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "${ATTEMPT},FAIL,-"
            fi

            if [ -f "$PID" ]; then
              VPNPID=$(sudo cat "$PID" 2>/dev/null || true)
              if [ -n "$VPNPID" ]; then
                sudo kill "$VPNPID" 2>/dev/null || true
                sleep 1
                sudo kill -9 "$VPNPID" 2>/dev/null || true
              fi
            fi

            # Give routing a moment to return to the runner before the next tunnel.
            sleep 2
          done

          echo '=== SUMMARY ==='
          echo "successful VPNs: ${SUCCESS}/${ATTEMPT}"

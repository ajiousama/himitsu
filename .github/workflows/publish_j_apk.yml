name: Publish Jun IPTV j.apk

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish_j_apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download latest APK from build branch
        run: |
          curl -fL --retry 5 --retry-delay 2 \
            -o j.apk \
            https://raw.githubusercontent.com/ajiousama/himitsu/jun-iptv-build/jun-iptv/releases/JunIPTV_TS401_latest.apk
      - name: Publish j.apk to main safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add j.apk
          if git diff --cached --quiet; then
            echo "j.apk already current"
            exit 0
          fi
          git commit -m "Publish Jun IPTV j.apk [skip ci]"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

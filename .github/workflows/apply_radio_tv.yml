name: Apply Radio TV to FreeWiFi

on:
  workflow_dispatch:
  schedule:
    - cron: '2 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_radio_tv.yml'
      - 'build_radio_tv_static.py'
      - 'radio_tv_freewifi.py'

permissions:
  contents: write

concurrency:
  group: apply-radio-tv
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build or refresh 16 radio image HLS channels
        run: python build_radio_tv_static.py

      - name: Validate generated HLS locally
        shell: bash
        run: |
          set -euo pipefail
          test "$(find radio-tv-static -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 16
          for d in radio-tv-static/*/; do
            test -s "$d/master.m3u8"
            test -s "$d/video.m3u8"
            test -s "$d/init.mp4"
            test "$(find "$d" -maxdepth 1 -name 'seg_*.m4s' | wc -l)" -eq 24
            grep -q '#EXT-X-MEDIA:TYPE=AUDIO' "$d/master.m3u8"
            grep -q 'CODECS="avc1.64001e,mp4a.40.2"' "$d/master.m3u8"
            grep -q '#EXT-X-START:TIME-OFFSET=' "$d/video.m3u8"
            grep -q '#EXT-X-PROGRAM-DATE-TIME:' "$d/video.m3u8"
          done

      - name: Commit synchronized HLS playlists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio-tv-static
          if git diff --cached --quiet; then
            echo 'radio HLS already current'
          else
            git commit -m 'Sync radio image HLS to current time'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for raw HLS playlists
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/ajiousama/himitsu/main/radio-tv-static'
          ok=0
          for i in $(seq 1 24); do
            if curl -fsS --max-time 20 "$BASE/ABC/master.m3u8" -o /tmp/master.m3u8 \
              && curl -fsS --max-time 20 "$BASE/ABC/video.m3u8" -o /tmp/video.m3u8 \
              && grep -q 'TYPE=AUDIO' /tmp/master.m3u8 \
              && grep -q '#EXT-X-START:TIME-OFFSET=' /tmp/video.m3u8 \
              && grep -q '#EXT-X-PROGRAM-DATE-TIME:' /tmp/video.m3u8; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Validate current live audio source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://himitsu-six.vercel.app/api/radiko?station=ABC&stage=media' -o /tmp/abc-audio.m3u8
          grep -q '#EXTM3U' /tmp/abc-audio.m3u8
          grep -q '#EXT-X-PROGRAM-DATE-TIME:' /tmp/abc-audio.m3u8
          echo 'ABC Radiko live audio OK'

      - name: Keep 16 FreeWiFi radio entries on image HLS
        run: python radio_tv_freewifi.py

      - name: Validate and commit FreeWiFi update
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(grep -c 'https://raw.githubusercontent.com/ajiousama/himitsu/main/radio-tv-static/.*/master.m3u8' freewifi || true)
          echo "image radio URLs in freewifi: $COUNT"
          test "$COUNT" -eq 16
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'freewifi already uses 16 image HLS channels'
            exit 0
          fi
          git commit -m 'Keep 16 FreeWiFi radio image HLS channels'
          git pull --rebase origin main
          git push origin HEAD:main

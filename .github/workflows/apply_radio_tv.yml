# 2026-09-02: trigger direct-audio + tvg-logo IPTV playback test
name: Restore FreeWiFi Radio Streams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_radio_tv.yml'

permissions:
  contents: write

concurrency:
  group: restore-radio-streams
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 16 original radio URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          urls = {
              'nhk_r1_osaka': 'https://simul2.drdi.st.nhk/live/12/joined/master.m3u8',
              'nhk_fm_osaka': 'https://simul2.drdi.st.nhk/live/13/joined/master.m3u8',
              'nhk_r1_matsuyama': 'https://simul2.drdi.st.nhk/live/16/joined/master.m3u8',
              'nhk_fm_matsuyama': 'https://simul2.drdi.st.nhk/live/17/joined/master.m3u8',
              'radiko.JOEU-FM': 'https://himitsu-six.vercel.app/api/radiko?station=JOEU-FM',
              'radiko.RNB': 'https://himitsu-six.vercel.app/api/radiko?station=RNB',
              'radiko.ABC': 'https://himitsu-six.vercel.app/api/radiko?station=ABC',
              'radiko.CCL': 'https://himitsu-six.vercel.app/api/radiko?station=CCL',
              'radiko.802': 'https://himitsu-six.vercel.app/api/radiko?station=802',
              'radiko.FMO': 'https://himitsu-six.vercel.app/api/radiko?station=FMO',
              'radiko.MBS': 'https://himitsu-six.vercel.app/api/radiko?station=MBS',
              'radiko.OBC': 'https://himitsu-six.vercel.app/api/radiko?station=OBC',
              'radiko.KBS': 'https://himitsu-six.vercel.app/api/radiko?station=KBS',
              'radiko.ALPHA-STATION': 'https://himitsu-six.vercel.app/api/radiko?station=ALPHA-STATION',
              'radiko.E-RADIO': 'https://himitsu-six.vercel.app/api/radiko?station=E-RADIO',
              'radiko.CRK': 'https://himitsu-six.vercel.app/api/radiko?station=CRK',
          }

          p = Path('freewifi')
          lines = p.read_text(encoding='utf-8-sig').splitlines()
          found = set()
          for i, line in enumerate(lines):
              if not line.lstrip().startswith('#EXTINF:'):
                  continue
              m = re.search(r'tvg-id="([^"]+)"', line)
              if not m:
                  continue
              tvgid = m.group(1)
              if tvgid not in urls:
                  continue
              j = i + 1
              while j < len(lines) and not lines[j].strip():
                  j += 1
              if j >= len(lines) or lines[j].lstrip().startswith('#'):
                  raise SystemExit(f'missing stream URL after {tvgid}')
              lines[j] = urls[tvgid]
              found.add(tvgid)

          missing = sorted(set(urls) - found)
          if missing:
              raise SystemExit('missing radio entries: ' + ', '.join(missing))
          p.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          print('restored', len(found), 'radio streams')
          PY

      - name: Validate restored streams
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^https://simul2.drdi.st.nhk/live/' freewifi)" -ge 4
          test "$(grep -c '^https://himitsu-six.vercel.app/api/radiko?station=' freewifi)" -ge 12
          curl -fsS --max-time 30 'https://himitsu-six.vercel.app/api/radiko?station=ABC' | grep -q '#EXTM3U'
          echo 'radio restore validated'

      - name: Commit restore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freewifi
          if git diff --cached --quiet; then
            echo 'freewifi already restored'
            exit 0
          fi
          git commit -m 'Restore stable radio streams including NHK'
          git pull --rebase origin main
          git push origin HEAD:main

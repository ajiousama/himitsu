name: Cleanup Rakuten duplicate entries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cleanup_rakuten_duplicates.py"
      - ".github/workflows/cleanup_rakuten_duplicates.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove plain duplicate Rakuten entries
        run: python cleanup_rakuten_duplicates.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freewifi
          if git diff --cached --quiet; then
            echo "Rakuten duplicates already clean"
            exit 0
          fi
          git commit -m "Remove plain duplicate Rakuten entries [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR松山駅 LED発車標 TEST</title>
<style>
*{box-sizing:border-box}
:root{
  --safe:300px;
  --scale:3.2;
  --unit-w:909px;       /* 284px x 3.2 */
  --label-h:125px;      /* 39px x 3.2 */
  --led-w:819px;        /* 256px x 3.2 */
  --led-h:52px;         /* 16px x 3.2 */
  --white:#fff;
  --yellow:#ff0;
  --red:#f00;
  --green:#0f9;
  --green2:#0f0;
  --blue:#4af;
  --orange:#f80;
  --brown:#fc0;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#00151b;color:#fff;font-family:"MS Gothic","Yu Gothic UI","Meiryo",sans-serif}
.lang-en{display:none!important}
body.show-en .lang-ja{display:none!important}
body.show-en .lang-en{display:inline!important}
.led-native.lang-en{display:none!important}
body.show-en .led-native.lang-en{display:block!important}
body.show-en .led-native.lang-ja{display:none!important}
.soon-native{display:none!important}
body.phase-soon:not(.show-en) .train.is-soon .soon-native{display:block!important}
body:before{content:"";position:fixed;left:0;top:0;width:var(--safe);height:100vh;background:linear-gradient(180deg,#07303b,#00151b);opacity:.33}
#overlay{position:fixed;left:311px;right:14px;top:14px;height:40px;display:flex;align-items:center;justify-content:space-between;color:#9ccbd1;font-size:10px;pointer-events:none}
#overlay .brand{font-weight:900;letter-spacing:1px;color:#f80}
#overlay .status{color:#0f9;font-weight:900}
#overlay .clock{font:900 24px Consolas,monospace;color:#fff}
#overlay .clock small{font-size:13px;color:#b8d8dc}
#stage{position:fixed;left:311px;right:14px;top:61px;bottom:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sign{
  position:relative;width:min(var(--unit-w),100%);height:100%;max-height:690px;
  background:#444;border:1px solid #fff;padding:8px 0 8px;
  box-shadow:0 8px 24px #000b;display:grid;grid-template-rows:var(--label-h) 1fr 36px;gap:4px
}
#badge{position:absolute;right:6px;top:-18px;background:#900;color:#fff;border:1px solid #f00;padding:2px 7px;font-size:9px;font-weight:900;z-index:10}
#credit{position:absolute;left:6px;top:-18px;color:#78949a;font-size:8px;white-space:nowrap}
#labelWrap{position:relative;width:var(--unit-w);height:var(--label-h);overflow:hidden;margin:0 auto;background:#444}
#labelWrap img{position:absolute;left:0;top:0;width:var(--unit-w);height:var(--label-h);image-rendering:pixelated;image-rendering:crisp-edges}
#labelTitle{z-index:1}
#labelHeader{z-index:2}
#rows{width:var(--led-w);margin:0 auto;min-height:0;display:flex;flex-direction:column;background:#000;overflow:hidden}
.train{position:relative;flex:1 1 0;min-height:68px;display:grid;grid-template-rows:var(--led-h) 20px;background:#000;border-bottom:1px solid #222;overflow:hidden}
.train:last-child{border-bottom:0}
.native-wrap{position:relative;width:var(--led-w);height:var(--led-h);overflow:hidden;background:#000}
.led-native{
  position:absolute;left:0;top:0;width:256px;height:16px;transform:scale(var(--scale));transform-origin:0 0;
  image-rendering:pixelated;image-rendering:crisp-edges
}
.piece{position:absolute;top:0;height:16px;overflow:hidden}
.piece img{position:absolute;width:890px;height:753px;max-width:none;image-rendering:pixelated;image-rendering:crisp-edges}
.native-fallback{position:absolute;top:0;height:16px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font:900 8px/16px "MS Gothic",sans-serif;letter-spacing:0}
.fallback-service{left:0;width:112px;color:#f00}
.fallback-dest{left:176px;width:64px;color:#ff0;justify-content:center}
.soon-native{z-index:8}
.subline{height:20px;position:relative;overflow:hidden;white-space:nowrap;border-top:1px solid #222;background:#000;color:#fff;font:900 13px/20px "MS Gothic",sans-serif}
.subtrack{position:absolute;left:0;top:0;display:flex;width:max-content;animation-name:subscroll;animation-duration:var(--dur,28s);animation-delay:var(--delay,0s);animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
.subtrack>span{display:inline-block;padding-right:90px}
.subtrack .stop{color:#f00}.subtrack .station{color:#ff0}.subtrack .english{color:#0f9}
@keyframes subscroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
#ticker{width:var(--led-w);margin:0 auto;background:#000;border-top:1px solid #222;position:relative;overflow:hidden;white-space:nowrap}
#tickerTitle{position:absolute;left:0;top:0;width:88px;height:36px;overflow:hidden;background:#000;z-index:3}
#tickerTitleNative{position:absolute;left:0;top:0;width:64px;height:16px;transform:scale(2.2);transform-origin:0 0}
#tickerTitleNative .piece img{width:890px;height:753px}
#tickertrack{position:absolute;left:96px;top:0;height:36px;display:flex;align-items:center;width:max-content;color:#fff;font-size:15px;font-weight:900;animation:tickscroll 22s linear infinite}
#tickertrack span{padding-right:90px}
@keyframes tickscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.empty{height:100%;display:grid;place-items:center;color:#ff0;font-size:26px;font-weight:900}
@media(max-width:1100px){
  :root{--safe:250px;--scale:2.75;--unit-w:781px;--label-h:107px;--led-w:704px;--led-h:44px}
  #stage,#overlay{left:260px}
}
</style>
</head>
<body>
<div id="overlay">
  <div class="brand">EHIME ・ MATSUYAMA ・ JR DEPARTURE BOARD</div>
  <div class="status" id="source">R14実データ 読込中</div>
  <div class="clock"><span id="hm">--:--</span><small id="sec">:--</small></div>
</div>

<div id="stage">
  <div id="sign">
    <div id="credit">表示素材参照：r113.sakura.ne.jp JR四国 松山駅 発車標シミュレーター</div>
    <div id="badge">TEST / AUTO RELOAD</div>

    <div id="labelWrap">
      <img id="labelTitle" src="https://r113.sakura.ne.jp/p/hasshahyo/jrs-matsuyama/img/label/title-1.png" alt="">
      <img id="labelHeader" src="https://r113.sakura.ne.jp/p/hasshahyo/jrs-matsuyama/img/label/header.png" alt="">
    </div>

    <div id="rows"></div>

    <div id="ticker">
      <div id="tickerTitle"><div id="tickerTitleNative"></div></div>
      <div id="tickertrack"><span id="tick1">JR松山駅 発車案内</span><span id="tick2">JR松山駅 発車案内</span></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var SWITCH=20, PHASE_MS=3000, MAX=7, direction='north', language='ja', displayPhase=0, data=null, started=Date.now(), pageSignature='', currentRows=[];
var SPRITE='https://r113.sakura.ne.jp/p/hasshahyo/jrs-matsuyama/img/main.png';
var LABEL_BASE='https://r113.sakura.ne.jp/p/hasshahyo/jrs-matsuyama/img/label/';

function $(id){return document.getElementById(id)}
function pad(n){return String(n).padStart(2,'0')}
function min(t){var m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):NaN}
function add(t,d){var n=min(t);if(!Number.isFinite(n))return '';n=((n+d)%1440+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60)}
function now(){
  var p={};
  new Intl.DateTimeFormat('ja-JP',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',
    weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  }).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
  var iso=p.year+'-'+p.month+'-'+p.day;
  return {iso:iso,dow:new Date(iso+'T12:00:00+09:00').getDay(),
    minutes:Number(p.hour)*60+Number(p.minute),hh:p.hour,mm:p.minute,ss:p.second};
}
function shiftIso(iso,days){
  var a=iso.split('-').map(Number),d=new Date(Date.UTC(a[0],a[1]-1,a[2]+days));
  return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())
}
function valid(r,n){
  if(r.start&&n.iso<r.start)return false;
  if(r.end&&n.iso>r.end)return false;
  if(Array.isArray(r.exclude)&&r.exclude.indexOf(n.iso)>=0)return false;
  if(Array.isArray(r.dates)&&r.dates.indexOf(n.iso)<0)return false;
  if(Array.isArray(r.days)&&r.days.indexOf(n.dow)<0)return false;
  return true
}
function et(r,n){return r.timeByDow&&Object.prototype.hasOwnProperty.call(r.timeByDow,String(n.dow))?r.timeByDow[String(n.dow)]:r.time}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function platform(r){
  var m=String(r.info||'').match(/(?:^|・)(\d+)番/);return m?m[1]:'—'
}
function remark(r){
  return String(r.info||'').replace(/^\d+番・?/,'').replace(/^・/,'')||'各駅停車'
}
function serviceText(r){
  var s=String(r.service||'普通');
  if(r.kind==='limited'&&!/^特急/.test(s)) return '特急 '+s;
  if(/^普通$/.test(s)) return '各駅停車';
  return s
}
function stationEn(name){
  var map={
    '今治':'Imabari','壬生川':'Nyugawa','伊予西条':'Iyo-Saijo','新居浜':'Niihama',
    '観音寺':'Kan-onji','丸亀':'Marugame','高松':'Takamatsu','岡山':'Okayama',
    '岡山・高松':'Okayama / Takamatsu','伊予北条':'Iyo-Hojo','伊予市':'Iyo-shi',
    '内子':'Uchiko','伊予大洲':'Iyo-Ozu','八幡浜':'Yawatahama','卯之町':'Unomachi',
    '宇和島':'Uwajima','松山':'Matsuyama'
  };
  return map[name]||name;
}
function serviceEn(r){
  var s=String(r.service||'普通');
  if(/^普通$/.test(s)) return 'Local';
  s=s.replace(/しおかぜ/g,'Shiokaze').replace(/いしづち/g,'Ishizuchi').replace(/宇和海/g,'Uwakai')
     .replace(/伊予灘ものがたり/g,'Iyonada Monogatari').replace(/号/g,'');
  if(r.kind==='limited') return 'Limited Express '+s;
  if(r.kind==='sightseeing') return 'Sightseeing '+s;
  return s;
}
function remarkEn(r){
  var x=remark(r);
  if(!x||x==='各駅停車') return '';
  x=x.replace(/伊予長浜経由/g,'via Iyo-Nagahama').replace(/内子経由/g,'via Uchiko')
     .replace(/いしづち(\d+)号/g,'coupled with Ishizuchi $1')
     .replace(/しおかぜ(\d+)号/g,'coupled with Shiokaze $1');
  return x;
}
function timedStopsEn(r){
  var s=String(r.service||''),a=[];
  if(/宇和海/.test(s))a=[['伊予市',14],['内子',43],['八幡浜',80],['卯之町',107],['宇和島',136]];
  else if(/しおかぜ/.test(s))a=[['今治',37],['壬生川',58],['伊予西条',79],['新居浜',98],['丸亀',132],['高松',159],['岡山',185]];
  else if(/いしづち/.test(s))a=[['今治',37],['壬生川',58],['伊予西条',79],['新居浜',98],['丸亀',132],['高松',159]];
  return a.map(function(x){return stationEn(x[0])+' ('+add(r.time,x[1])+')'});
}
function terminalTextEn(r){
  var a=terminals(r);return a.length?a.map(function(x){return stationEn(x[0])+' '+x[1]}).join(' / '):'—';
}
function detailEn(r){
  var a=timedStopsEn(r),parts=[];
  if(a.length) parts.push('Stops: '+a.join(' → '));
  else{
    parts.push('Local train');
    if(/伊予長浜経由/.test(String(r.info||'')))parts.push('via Iyo-Nagahama');
    else if(/内子経由/.test(String(r.info||'')))parts.push('via Uchiko');
    if(r.dest)parts.push('Terminus: '+stationEn(r.dest));
  }
  var rem=remarkEn(r);if(rem)parts.push(rem);
  var term=terminalTextEn(r);if(term!=='—')parts.push('Arrival '+term);
  return parts.join('  ◆  ');
}

function terminals(r){
  var d=String(r.dest||''),s=String(r.service||''),i=String(r.info||''),t=r.time;
  if(/宇和海/.test(s))return[['宇和島',add(t,136)]];
  if(/しおかぜ/.test(s)&&/岡山・高松/.test(d))return[['高松',add(t,159)],['岡山',add(t,185)]];
  if(/いしづち/.test(s)&&/高松/.test(d))return[['高松',add(t,159)]];
  if(/いしづち/.test(s)&&/新居浜/.test(d))return[['新居浜',add(t,98)]];
  var north={'今治':37,'伊予西条':76,'観音寺':121,'高松':170,'伊予北条':26};
  var south={'伊予市':19,'内子':49,'伊予大洲':/伊予長浜経由/.test(i)?102:83,'八幡浜':/伊予長浜経由/.test(i)?150:127,'宇和島':/伊予長浜経由/.test(i)?198:176};
  var x=Object.prototype.hasOwnProperty.call(north,d)?north[d]:south[d];
  return Number.isFinite(x)?[[d,add(t,x)]]:[]
}
function terminalText(r){
  var a=terminals(r);return a.length?a.map(function(x){return x[0]+' '+x[1]}).join(' / '):'—'
}
function timedStops(r){
  var s=String(r.service||''),a=[];
  if(/宇和海/.test(s))a=[['伊予市',14],['内子',43],['八幡浜',80],['卯之町',107],['宇和島',136]];
  else if(/しおかぜ/.test(s))a=[['今治',37],['壬生川',58],['伊予西条',79],['新居浜',98],['丸亀',132],['高松',159],['岡山',185]];
  else if(/いしづち/.test(s))a=[['今治',37],['壬生川',58],['伊予西条',79],['新居浜',98],['丸亀',132],['高松',159]];
  return a.map(function(x){return x[0]+'('+add(r.time,x[1])+')'})
}
function detail(r){
  var a=timedStops(r),parts=[];
  if(a.length) parts.push('停車駅：'+a.join(' → '));
  else{
    parts.push('各駅停車');
    if(/伊予長浜経由/.test(String(r.info||'')))parts.push('愛ある伊予灘線経由');
    else if(/内子経由/.test(String(r.info||'')))parts.push('内子経由');
    if(r.dest)parts.push('終点 '+r.dest)
  }
  var rem=remark(r);if(rem&&rem!=='各駅停車')parts.push(rem);
  var term=terminalText(r);if(term!=='—')parts.push('終点着 '+term);
  return parts.join('　◆　')
}
function getRows(n){
  if(!data||!Array.isArray(data.records))return[];
  var a=data.records.filter(function(r){return r.board==='rail'&&r.direction===direction&&valid(r,n)})
    .map(function(r){var x=Object.assign({},r);x.time=et(r,n);return x})
    .filter(function(r){return Number.isFinite(min(r.time))})
    .sort(function(a,b){return min(a.time)-min(b.time)});
  var upcoming=a.filter(function(r){return min(r.time)>=n.minutes-1});
  if(upcoming.length<MAX){
    var iso=shiftIso(n.iso,1),nn={iso:iso,dow:new Date(iso+'T12:00:00+09:00').getDay(),minutes:0};
    var next=data.records.filter(function(r){return r.board==='rail'&&r.direction===direction&&valid(r,nn)})
      .map(function(r){var x=Object.assign({},r);x.time=et(r,nn);x.nextDay=true;return x})
      .filter(function(r){return Number.isFinite(min(r.time))})
      .sort(function(a,b){return min(a.time)-min(b.time)});
    upcoming=upcoming.concat(next.slice(0,MAX-upcoming.length))
  }
  return upcoming.slice(0,MAX)
}

var DEST_INDEX={
  '岡山・高松':0,'岡山':1,'高松':2,'多度津':3,'観音寺':4,'新居浜':5,'伊予西条':6,'今治':7,
  '伊予北条':8,'市坪':9,'伊予市':10,'伊予大洲':11,'八幡浜':12,'卯之町':13,'宇和島':14
};
var FINAL_DEST_INDEX={'高松':26,'新居浜':27,'今治':28,'伊予北条':29,'八幡浜':30,'宇和島':31};

function spritePiece(left,width,sx,row){
  var sy=Math.max(0,row||0)*17;
  return '<div class="piece" style="left:'+left+'px;width:'+width+'px">'+
    '<img referrerpolicy="no-referrer" src="'+SPRITE+'" alt="" style="left:-'+sx+'px;top:-'+sy+'px">'+
  '</div>';
}
function digitRow(v,blank){
  if(v===null||v===undefined||v==='')return blank===undefined?10:blank;
  var n=Number(v);return Number.isFinite(n)?n:(blank===undefined?10:blank)
}
function timeGroup(t){
  var p=String(t||'').split(':'),h=Number(p[0]),m=Number(p[1]);
  if(!Number.isFinite(h)||!Number.isFinite(m))return '';
  var h10=h>=10?Math.floor(h/10):10,h1=h%10,m10=Math.floor(m/10),m1=m%10;
  var out='<div style="position:absolute;left:112px;top:0;width:64px;height:16px;overflow:hidden">';
  out+='<div class="piece" style="left:0;width:64px"><img referrerpolicy="no-referrer" src="'+SPRITE+'" alt="" style="left:-338px;top:-17px"></div>';
  [[5,10,h10],[18,10,h1],[36,10,m10],[49,10,m1]].forEach(function(x){
    out+='<div class="piece" style="left:'+x[0]+'px;width:'+x[1]+'px"><img referrerpolicy="no-referrer" src="'+SPRITE+'" alt="" style="left:-405px;top:-'+(17*x[2])+'px"></div>';
  });
  return out+'</div>';
}
function parseTrainNum(r){
  var m=String(r.service||'').match(/(\d+)号/);if(!m)return null;
  var n=Number(m[1]);return Number.isFinite(n)&&n<=99?n:null
}
function trainNumGroup(r,lang,enabled){
  if(!enabled)return '';
  var n=parseTrainNum(r);if(n===null)return '';
  var tens=n>=10?Math.floor(n/10):10,ones=n%10,baseX=lang==='en'?272:239;
  var out='<div style="position:absolute;left:80px;top:0;width:32px;height:16px;overflow:hidden">';
  out+='<div class="piece" style="left:0;width:32px"><img referrerpolicy="no-referrer" src="'+SPRITE+'" alt="" style="left:-'+baseX+'px;top:-17px"></div>';
  [[2,8,tens],[11,8,ones]].forEach(function(x){
    out+='<div class="piece" style="left:'+x[0]+'px;width:'+x[1]+'px"><img referrerpolicy="no-referrer" src="'+SPRITE+'" alt="" style="left:-305px;top:-'+(17*x[2])+'px"></div>';
  });
  return out+'</div>';
}
function trainSpriteInfo(r){
  var svc=String(r.service||''),info=String(r.info||'');
  if(r.kind!=='limited'&&r.kind!=='sightseeing'){
    if(/内子経由/.test(info))return {type:4,name:3,num:false};
    if(/伊予長浜経由/.test(info))return {type:4,name:7,num:false};
    return {type:4,name:0,num:false};
  }
  if(/伊予灘ものがたり/.test(svc))return {type:4,name:22,num:false};
  if(/いしづち102/.test(svc))return {type:0,name:12,num:false};
  if(/いしづち104/.test(svc))return {type:0,name:13,num:false};
  if(/いしづち106/.test(svc))return {type:0,name:14,num:false};
  if(/しおかぜ/.test(svc))return {type:0,name:10,num:true};
  if(/宇和海/.test(svc))return {type:0,name:11,num:true};
  return {type:0,name:null,num:false};
}
function destSpriteIndex(r){
  var d=String(r.dest||'');
  if(r.isFinal&&Object.prototype.hasOwnProperty.call(FINAL_DEST_INDEX,d))return FINAL_DEST_INDEX[d];
  return Object.prototype.hasOwnProperty.call(DEST_INDEX,d)?DEST_INDEX[d]:null
}
function nativeRow(r,lang){
  var x=trainSpriteInfo(r),destIdx=destSpriteIndex(r),track=platform(r),trackIdx=/^[123]$/.test(track)?Number(track)-1:3;
  var typeX=lang==='en'?33:0,nameX=lang==='en'?152:71,destX=lang==='en'?496:431;
  var out='';
  out+=spritePiece(0,32,typeX,x.type);
  if(x.name!==null) out+=spritePiece(32,80,nameX,x.name);
  else out+='<div class="native-fallback fallback-service">'+esc(lang==='en'?serviceEn(r):serviceText(r))+'</div>';
  out+=trainNumGroup(r,lang,x.num);
  out+=timeGroup(r.time);
  if(destIdx!==null)out+=spritePiece(176,64,destX,destIdx);
  else out+='<div class="native-fallback fallback-dest">'+esc(lang==='en'?stationEn(r.dest):r.dest)+'</div>';
  out+=spritePiece(240,16,564,trackIdx);
  return out;
}
function soonOverlay(){
  return spritePiece(112,128,586,1);
}
function tickerTitle(){
  return spritePiece(0,64,725,1);
}

function setModeText(){
  var north=direction==='north';
  var img=$('labelTitle');
  if(img)img.src=LABEL_BASE+(north?'title-1.png':'title-0.png');
}
function render(n){
  setModeText();
  var a=getRows(n),h=$('rows');
  currentRows=a;
  if(!a.length){
    h.innerHTML='<div class="empty"><span class="lang-ja">本日の表示対象列車はありません</span><span class="lang-en">No more trains are shown for today.</span></div>';
    updateTicker();
    return
  }
  h.innerHTML=a.map(function(r,idx){
    var ja=detail(r),en=detailEn(r);
    var dur=Math.max(18,Math.min(48,Math.round(Math.max(ja.length,en.length)*.25)));
    var delay=-(idx*2.15);
    var diff=min(r.time)-n.minutes,soon=(diff>=0&&diff<=4);
    return '<div class="train'+(soon?' is-soon':'')+'">'+
      '<div class="native-wrap">'+
        '<div class="led-native lang-ja">'+nativeRow(r,'ja')+'</div>'+
        '<div class="led-native lang-en">'+nativeRow(r,'en')+'</div>'+
        '<div class="led-native soon-native">'+soonOverlay()+'</div>'+
      '</div>'+
      '<div class="subline"><div class="subtrack" style="--dur:'+dur+'s;--delay:'+delay+'s">'+
        '<span><span class="lang-ja"><span class="stop">停車駅</span>　<span class="station">'+esc(ja)+'</span></span><span class="lang-en english">'+esc(en)+'</span></span>'+
        '<span aria-hidden="true"><span class="lang-ja"><span class="stop">停車駅</span>　<span class="station">'+esc(ja)+'</span></span><span class="lang-en english">'+esc(en)+'</span></span>'+
      '</div></div>'+
    '</div>'
  }).join('');
  var tt=$('tickerTitleNative');if(tt)tt.innerHTML=tickerTitle();
  updateTicker()
}
function updateTicker(){
  var lead=currentRows[0];
  if(!lead){
    var emptyJa='JR松山駅 発車案内',emptyEn='JR Matsuyama Departure Information';
    $('tick1').textContent=language==='ja'?emptyJa:emptyEn;$('tick2').textContent=language==='ja'?emptyJa:emptyEn;
    return
  }
  var ja='ご案内　'+lead.time+'発 '+serviceText(lead)+' '+lead.dest+'行　◆　'+detail(lead);
  var en='Information  '+lead.time+'  '+serviceEn(lead)+' for '+stationEn(lead.dest)+'  ◆  '+detailEn(lead);
  $('tick1').textContent=language==='ja'?ja:en;$('tick2').textContent=language==='ja'?ja:en
}
function applyLanguage(){
  document.body.classList.toggle('show-en',displayPhase===2);
  document.body.classList.toggle('phase-soon',displayPhase===1);
  language=displayPhase===2?'en':'ja';
  updateTicker()
}
function tickClock(){
  var n=now();$('hm').textContent=n.hh+':'+n.mm;$('sec').textContent=':'+n.ss;
  var e=Math.floor((Date.now()-started)/1000)%SWITCH,remain=SWITCH-e;
  var phaseLabel=displayPhase===2?'English':(displayPhase===1?'日本語 / まもなく':'日本語');
  $('count').textContent=remain+' sec / '+phaseLabel;
  return n
}
function load(src){
  return new Promise(function(ok,ng){
    var s=document.createElement('script'),tm=setTimeout(function(){ng(new Error('timeout'))},6000);
    s.src=src+(src.indexOf('?')>=0?'&':'?')+'t='+Date.now();
    s.onload=function(){clearTimeout(tm);ok()};s.onerror=function(){clearTimeout(tm);ng(new Error('load'))};
    document.head.appendChild(s)
  })
}
async function watch(){
  try{
    var r=await fetch('/test/?watch='+Date.now(),{cache:'no-store'}),b=await r.text();
    if(!pageSignature){pageSignature=b;return}
    if(b&&b!==pageSignature)location.reload()
  }catch(e){}
}
async function boot(){
  try{
    delete window.MATSUYAMA_DATA;
    await load('/patapata/schedule.js');
    data=window.MATSUYAMA_DATA;
    if(!data||!Array.isArray(data.records))throw new Error('invalid');
    $('source').textContent='R14実データ / GitHub→Railway同期'
  }catch(e){
    data={records:[]};$('source').textContent='時刻表データ読込失敗'
  }
  var firstNow=tickClock(),lastMinute=firstNow.minutes;
  render(firstNow);
  setInterval(function(){
    var n=tickClock();
    if(n.minutes!==lastMinute){
      lastMinute=n.minutes;
      render(n);
    }
  },1000);
  setInterval(function(){
    displayPhase=(displayPhase+1)%3;
    applyLanguage();
    tickClock();
  },PHASE_MS);
  setInterval(function(){
    direction=direction==='north'?'south':'north';
    started=Date.now();
    var n=now();
    lastMinute=n.minutes;
    render(n);
    applyLanguage();
  },SWITCH*1000);
  applyLanguage();
  watch();setInterval(watch,10000)
}
boot();
})();
</script>
